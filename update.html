<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>更新</title>
<style>
  body{background:#0b0b14; color:#eceef2; font-family:-apple-system,sans-serif;
       display:flex; align-items:center; justify-content:center; height:100vh; margin:0;}
  p{font-size:14px; color:#8a8ea3; text-align:center; line-height:1.6; padding:0 16px;}
</style>
</head>
<body>
<p id="msg">更新中…</p>
<script>
async function run(){
  const msg = document.getElementById('msg');
  const bust = Date.now().toString(36);
  try{
    // 1) SW を外す（古い fetch ハンドラを無効化）
    if ('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    // 2) Cache Storage 全削除
    if ('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    // 3) HTTP キャッシュも避けて本体をネットワークから取り直す
    const files = [
      'index.html',
      'styles.css',
      'app.js',
      'sw.js',
      'manifest.json',
      'icon-192.png',
      'icon-512.png',
      'icon-maskable-512.png'
    ];
    await Promise.all(files.map(f =>
      fetch(f + '?r=' + bust, { cache: 'no-store', credentials: 'same-origin' })
        .then(res => { if (!res.ok) throw new Error(f + ' ' + res.status); })
    ));
    msg.textContent = '更新完了。起動します…';
    // 4) クエリ付きで index へ（途中キャッシュを避ける）
    location.replace('./index.html?r=' + bust);
  }catch(e){
    msg.textContent = '更新に失敗しました。通信できる状態で、もう一度 ↻ を押してください。';
  }
}
run();
</script>
</body>
</html>
