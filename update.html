<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更新</title>
<style>
  body{background:#0b0b14; color:#eceef2; font-family:-apple-system,sans-serif;
       display:flex; align-items:center; justify-content:center; height:100vh; margin:0;}
  p{font-size:14px; color:#8a8ea3;}
</style>
</head>
<body>
<p id="msg">更新中…</p>
<script>
async function run(){
  try{
    // 1) SW 登録解除
    if ('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) await r.unregister();
    }
    // 2) Cache Storage を掃除
    if ('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){}
  document.getElementById('msg').textContent = '更新完了。移動します…';
  // 3) ネットワークから index を読み直し → 新しい SW が再登録される
  setTimeout(() => { location.replace('index.html?r=' + Date.now().toString(36)); }, 400);
}
run();
</script>
</body>
</html>
