<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>更新</title>
<style>
  body{background:#0b0b14; color:#eceef2; font-family:-apple-system,sans-serif;
       display:flex; align-items:center; justify-content:center; height:100vh; margin:0;}
  p{font-size:14px; color:#8a8ea3; text-align:center; line-height:1.6; padding:0 16px;}
</style>
</head>
<body>
<p id="msg">更新中…</p>
<script>
async function run(){
  const msg = document.getElementById('msg');
  const bust = Date.now().toString(36);

  if (!navigator.onLine){
    msg.innerHTML = 'オフラインのため更新できません。<br><br><a href="./index.html" style="color:#ffd166;text-decoration:none;border:1px solid #ffd166;padding:8px 16px;border-radius:6px;display:inline-block;">アプリに戻る</a>';
    return;
  }

  try{
    // 1) 先にHTTPキャッシュをバイパスして最新アセットの取得を試みる（失敗時はキャッシュを壊さない）
    const files = [
      'index.html',
      'styles.css',
      // 単一化するときはこの8つを app.js 1つに戻す（build.html参照）
      'state.js',
      'engine.js',
      'toast-core.js',
      'toast-fields.js',
      'card-builders.js',
      'card-logic.js',
      'panels.js',
      'resume-fit.js',
      'sw.js',
      'manifest.json',
      'icon-192.png',
      'icon-512.png',
      'icon-maskable-512.png'
    ];
    await Promise.all(files.map(f =>
      fetch(f + '?r=' + bust, { cache: 'no-store', credentials: 'same-origin' })
        .then(res => { if (!res.ok) throw new Error(f + ' ' + res.status); })
    ));

    // 2) ダウンロード成功を確認してから、古いSWとCache Storageを安全にクリア
    if ('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }

    msg.textContent = '更新完了。起動します…';
    // 3) クエリ付きで index へ（途中キャッシュを避ける）
    location.replace('./index.html?r=' + bust);
  }catch(e){
    msg.innerHTML = '更新に失敗しました。<br><br><a href="./index.html" style="color:#ffd166;text-decoration:none;border:1px solid #ffd166;padding:8px 16px;border-radius:6px;display:inline-block;">アプリに戻る</a>';
  }
}
run();
</script>
</body>
</html>
