<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" name="viewport"/>
<meta content="#0b0b14" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<title>タイマー</title>
<link href="manifest.json" rel="manifest"/>
<link href="icon-192.png" rel="icon"/>
<style>
  :root{
    --bg:#0b0b14; --card:#15151f; --card2:#1b1b28; --line:#2a2a3a;
    --text:#eceef2; --sub:#8a8ea3; --accent:#9b8bff; --blue:#4fa3ff; --orange:#ffab5c;
    --danger:#ff6b6b; --ok:#5cd68a;
    /* タイマー・数字部分で共通使用するフォント指定 */
    --timer-number-font: Roboto, system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;}
  /* タイマー内の数字表示はすべてこのフォントで統一 */
  .stamval, .stammax, .inline-number-text, .main, .clockstack, .rank{
    font-family:var(--timer-number-font);
  }
  html,body{height:100%; overflow-x:hidden; overflow-y:auto; overscroll-behavior:none;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Roboto,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;
  }
  /* アプリ内の編集キャレットは一括で非表示。編集自体はそのまま可能。 */
  input{ caret-color:transparent; }
  /* インライン数字：親スロット幅いっぱいに置き、編集欄もその上に重ねる。
     「/」位置は valrow の左右均等フレックスで固定するため、幅ロックはしない。 */
  .inline-number{position:relative;display:block;width:100%;min-width:0;height:22px;line-height:22px;overflow:visible;}
  .inline-number-text{ display:block; width:100%; height:22px; line-height:22px; overflow:visible; font-variant-numeric:tabular-nums; }
  .stamval .inline-number-text{ text-align:right; }
  .stammax .inline-number-text{ text-align:left; }
  .inline-number.editing .inline-number-text{visibility:hidden;}
  .inline-edit-input{
    position:absolute; top:0; left:0; width:100%; height:100%; box-sizing:border-box;
    border:0; outline:0; background:transparent; color:inherit;
    font:inherit; font-variant-numeric:tabular-nums; text-align:inherit;
    padding:0; margin:0; border-radius:0; appearance:none; -webkit-appearance:none;
    -webkit-user-select:text; user-select:text; overflow:visible;
    z-index:3;
  }
  .stamval .inline-edit-input{ text-align:right; }
  .stammax .inline-edit-input{ text-align:left; }
  /* アカウント名：編集対象が分かるよう、通常のフォーカス枠を復活。 */
  .group .name:focus{ outline:1px solid #d8d8d8 !important; outline-offset:1px; box-shadow:none !important; }
  .group .name{ -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; touch-action:manipulation; user-select:text; }
  /* TWA復帰時の一瞬の再構築を視覚的に隠す。通常起動・通常操作では非表示。 */
  #resumeVeil{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:100;transition:opacity 90ms linear;}
  #resumeVeil.show{opacity:1;}
  header{
    display:flex; align-items:center; gap:8px; padding:10px 12px 6px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .spacer{flex:1; min-width:0;}
  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #cards{padding:6px 6px 20px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; align-items:start;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:6px 6px; position:relative; min-width:0;
    touch-action:pan-y; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  /* タイマー枠：種類ごとに細線で色分け。放置の通常色は受取待機の緑と非重複。 */
  .card.stam{border:1px solid #5aa9ff;}
  .card.idle{border:1px solid #f0a85a;}
  /* 長押しで削除確認中の対象を赤い破線で囲む。 */
  .longpress-target{
    outline:2px dashed var(--danger);
    outline-offset:3px;
  }
  .rule-line.longpress-target{
    outline:none;
    border-top-color:var(--danger) !important;
  }

  .row{display:flex; align-items:center; gap:3px; min-width:0;}
  .row + .row{margin-top:3px;}
  .namerow{margin-bottom:4px;}
  /* タイマーカードは種類に関係なく同じ外寸に揃える。中身だけ配置を変える。 */
  .card.stam, .card.abyss, .card.idle{height:56px; min-height:56px;} 
  .card.abyss{border:1px solid #b48cff; padding:6px 6px;}
  /* claim / full は種類別 border より後に書き、特異性を上げて破線・色が消えないようにする。
     （.card.abyss の border 短縮記法が後勝ちで破線を潰していた） */
  .card.claim,
  .card.stam.claim,
  .card.abyss.claim,
  .card.idle.claim{
    border-style:dashed !important;
    border-color:var(--ok) !important;
  }
  .card.full,
  .card.stam.full,
  .card.abyss.full,
  .card.idle.full{
    border-color:var(--orange) !important;
  }
  /* Abyssはカード全体を1つのタップ領域にする。入力欄以外はどこを押しても40使い切り。 */
  .card.abyss .clockstack, .card.abyss .stammax, .card.abyss .slash{pointer-events:none;}
  .card.abyss .abyss-head{justify-content:space-between; min-height:18px; height:18px; margin-bottom:2px; position:static;}
  .card.abyss .rank{position:absolute; top:0; left:6px; right:auto; width:4.5em; max-width:none; text-align:left;}
  .card.stam, .card.idle{
    padding:6px; display:flex; flex-direction:column; justify-content:center;
  }
  .name{
    width:100%; background:transparent; border:none; color:var(--text);
    font-size:11px; font-weight:600; padding:2px 0; min-width:0;
  }
  .name::placeholder{color:var(--sub);}
  /* ランクは常にインライン（ネイティブの大きな入力ボックス化を抑止） */
  .rank{
    position:absolute; top:2px; right:2px; width:4.5em; max-width:45%;
    height:18px; line-height:18px; min-height:0; max-height:18px;
    margin:0; padding:0 2px; box-sizing:border-box;
    background:transparent !important; border:none !important; outline:none;
    border-radius:0; box-shadow:none;
    color:var(--orange);
    font-size:10px; font-weight:800; text-align:left;
    font-variant-numeric:tabular-nums;
    -webkit-appearance:none; appearance:none;
    -webkit-user-select:text; user-select:text; -webkit-touch-callout:none;
    z-index:2;
  }
  .rank:focus{
    outline:none; background:transparent !important;
    box-shadow:none;
  }
  /* アカウント枠：通常カード2枚分の横幅 */
  .card.group{grid-column:span 2; padding:4px; border:1px solid #555b68; box-shadow:none; border-radius:8px;}
  .card.group.single{grid-column:span 1;}
  .group-namerow{margin-bottom:3px; gap:3px; padding:0 1px;}
  .group-namerow .name{font-size:12px; padding:1px 0; font-weight:700; color:var(--account); flex:0 0 5em; width:5em; max-width:5em; box-sizing:border-box;}
  .group-body{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; min-height:1px; align-items:end;}
  .group-body.one{grid-template-columns:1fr;}
  .group-body:empty{display:none;}
  /* Abyss「40使い切り」プレビュー中：押した所が分かるよう点線で囲む */
  .main{font-size:16px; line-height:1.1; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  /* 左右を均等フレックスにし「/」を中央固定。桁数が変わってもスラッシュは動かない。 */
  .valrow-stam{
    margin-top:0 !important; align-items:center; min-height:22px; height:22px;
    position:absolute; left:6px; right:6px; bottom:5px;
    display:flex; justify-content:center; gap:0;
  }
  .stamval{
    color:var(--text); font-size:18px; font-weight:700; text-align:right;
    font-variant-numeric:tabular-nums; min-width:0;
    overflow:visible; height:22px; line-height:22px;
    flex:1 1 0; display:block;
  }
  /* 最大値は左寄せにして、現在値(右寄せ)と対称。「/」が中央に見える */
  .stammax{
    color:var(--blue); font-size:18px; font-weight:700; text-align:left;
    font-variant-numeric:tabular-nums; height:22px; line-height:22px;
    flex:1 1 0; min-width:0; display:block;
  }
  .slash{
    position:relative; flex:0 0 auto; width:auto; height:22px;
    margin:0 4px; color:#7f8da3;
    font-size:15px; font-weight:700; line-height:20px;
    text-align:center; top:-1px;
    overflow:visible; pointer-events:none;
  }
  .clockstack{
    margin-left:0; margin-right:auto; display:flex; flex-direction:row; align-items:center; justify-content:flex-start;
    gap:0; font-size:9.5px; font-weight:700; line-height:18px; color:var(--accent);
    transform:none; white-space:nowrap;
  }
  .clockstack .ok{color:var(--ok); font-size:14px; line-height:18px;}
  .clockstack .full-at{color:var(--danger); font-size:9.5px; font-weight:800; line-height:18px;}
  /* 満タンまで2時間未満：現在スタミナ・放置数字を赤（予定時刻は触らない） */
  [data-role="curWrap"].near,
  [data-role="curWrap"].near .inline-number-text{color:var(--danger) !important;}
  .main.near{color:var(--danger) !important;}
  /* 予定時刻は全タイマーカードで右上に統一。Abyssと同じ基準位置に揃える。 */
  .card.stam > .stam-clock,
  .card.idle > .idle-clock{
    position:absolute; right:6px; left:auto; top:0; margin:0; transform:none; height:18px; line-height:18px;
  }
  /* Abyssも右上。ランクは左上、数値は下段中央。 */
  .card.abyss .abyss-clock{
    margin:0; min-width:0; flex-direction:row; align-items:center; justify-content:flex-start;
    gap:0; font-size:9.5px; line-height:18px; letter-spacing:.01em; transform:none;
    position:absolute; right:6px; left:auto; top:0; height:18px;
  }
  .card.abyss .valrow-stam{bottom:5px;}
  /* 放置タイマー本体も下段中央。予定時刻だけ左上へ配置。 */
  .valrow-idle{
    margin-top:0 !important; align-items:center; min-height:22px; height:22px;
    justify-content:center; gap:6px; position:absolute; left:6px; right:6px; bottom:5px;
  }
  .valrow-idle .main{min-width:2.6em; text-align:center; padding-left:0; font-size:19px; line-height:1.1;}
  .valrow-idle .clockstack{margin:0; position:absolute; left:0; top:auto;}
  .card.idle .valrow-idle .clockstack{position:absolute; left:0; bottom:22px; top:auto;}
  /* 当たり判定は ::before で左右を分ける。スラッシュをまたがない。編集中は無効化。 */
  [data-role="curWrap"], [data-role="maxWrap"]{ position:relative; }
  [data-role="curWrap"]::before{
    content:''; position:absolute; top:-6px; bottom:-4px; left:-8px; right:0; z-index:1;
  }
  [data-role="maxWrap"]::before{
    content:''; position:absolute; top:-6px; bottom:-4px; left:0; right:-8px; z-index:1;
  }
  [data-role="curWrap"].is-editing::before,
  [data-role="maxWrap"].is-editing::before{
    pointer-events:none;
  }
  .divider{
    grid-column:1 / -1; display:flex; align-items:center; gap:6px;
    padding:3px 2px; border-bottom:1px solid var(--line); position:relative;
    touch-action:pan-y; -webkit-touch-callout:none;
  }
  .divider .name{
    width:65%; max-width:260px; flex:0 1 auto; font-size:13px; font-weight:700; color:var(--accent); padding:0 0 2px;
  }
  .header-palette{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin:4px 0 2px;}
  .header-swatch{width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--line); box-shadow:none;}
  .header-swatch.selected{border-color:#fff; outline:1px solid var(--accent);}

  /* ルナビィ下線と同系の太い仕切り。色は item.color */
  .rule-line{
    grid-column:1 / -1; position:relative;
    height:0; margin:3px 2px; padding:0;
    border:0; border-top:2px solid #52617a;
    touch-action:pan-y; -webkit-touch-callout:none;
  }
  .rule-line::before{
    /* レイアウトを押し広げずに長押し判定だけ広げる透明ヒットエリア */
    content:''; position:absolute; left:0; right:0; top:-10px; bottom:-10px;
  }
  #toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%); max-width:90%;
    background:#1e1e2c; color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px 14px; font-size:13px; z-index:30;
    display:none; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #toast.show{display:flex; gap:10px; align-items:center;}
  #toast button{
    border:1px solid var(--line); background:var(--card2); color:var(--text);
    border-radius:8px; padding:6px 10px; font-size:12px; font-weight:600;
  }
  #toast button.ok{background:var(--danger); border-color:transparent; color:#fff;}
  /* 1回目タップで破線（確定待ち）。2回目で実行 */
  #toast button.armed{outline:2px dashed #fff; outline-offset:2px;}
  #toast .toast-color{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-size:12px;}
  #toast .toast-color input{width:28px;height:24px;padding:1px;border:1px solid var(--line);border-radius:6px;background:transparent;}
  #empty{color:var(--sub); font-size:13px; text-align:center; padding:40px 0;}
  #addPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; gap:10px; z-index:10;
  }
  #addPanel.show{display:flex; flex-wrap:wrap;}
  #addPanel .timerType{display:none;}
  #addPanel.group-mode .timerType{display:block;}
  #addPanel.group-mode .onlyTop{display:none;}
  #addPanel button{
    flex:1 1 calc(50% - 5px); min-width:calc(40% - 5px); padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:600;
  }
  #setupPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; flex-direction:column; gap:12px; z-index:11;
  }
  #setupPanel.show{display:flex;}
  #setupPanel .setupLabel{font-size:13px; color:var(--sub); text-align:center;}
  #setupFields{display:flex; align-items:center; justify-content:center; gap:6px;}
  #setupFields input{
    width:60px; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:16px; text-align:center; padding:8px 4px;
  }
  #setupFields span{color:var(--sub); font-size:13px;}
  #setupConfirm{
    padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#100c26; font-size:14px; font-weight:700;
  }
</style>
</head>
<body>
<div id="resumeVeil" aria-hidden="true"></div>
<header>
<button aria-label="アプリを更新" class="iconbtn" id="updateBtn" title="アプリを更新">↻</button>
<span aria-hidden="true" class="spacer"></span>
<button class="iconbtn" id="addBtn">＋</button>
</header>
<div id="cards"></div>
<div id="empty">＋ でタイマーを追加</div>
<div id="toast" role="status"></div>
<div id="addPanel">
<button class="timerType" data-type="stam">スタミナ</button>
<button class="timerType" data-type="abyss">Abyssスタミナ</button>
<button class="timerType" data-type="idle">放置報酬</button>
<button class="onlyTop" data-type="group">アカウント枠</button>
<button class="onlyTop" data-type="header">見出し</button>
<button class="onlyTop" data-type="rule">仕切り線</button>
</div>
<div id="setupPanel">
<div class="setupLabel" id="setupLabel"></div>
<div id="setupFields"></div>
<button id="setupConfirm">追加</button>
</div>
<script>
const STORAGE_KEY = 'freetimer:v1';
let state = load();
// 旧版で存在し得た「アカウント外タイマー」を起動時にアカウントへ移行。
// 現行UIではタイマーはアカウント枠の子としてのみ作成する。
function migrateOrphanTimers(){
  if (!state || !Array.isArray(state.items)) return false;
  const orphan = state.items.filter(it => it && (it.type==='stam' || it.type==='abyss' || it.type==='idle'));
  if (!orphan.length) return false;
  const keep = state.items.filter(it => !orphan.includes(it));
  const groups = [];
  for (let i=0; i<orphan.length; i+=2){
    groups.push({ id:'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,7), type:'group', name:'', children:orphan.slice(i,i+2) });
  }
  // 最初の孤立タイマーがあった位置に移行後のアカウント枠を挿入し、
  // それ以外の既存項目の順序はなるべく維持する。
  const firstIndex = state.items.findIndex(it => orphan.includes(it));
  const beforeCount = state.items.slice(0, firstIndex).filter(it => !orphan.includes(it)).length;
  state.items = keep.slice(0,beforeCount).concat(groups, keep.slice(beforeCount));
  saveNow();
  return true;
}
if (migrateOrphanTimers()) { /* 旧データの一度きりの移行 */ }
let refs = {};
let tickId = null;
let tickGen = 0;
let pending40Id = null;
let claimId = null;
// インライン数字編集中の対象。null | `${itemId}:cur` | `${itemId}:max`
let editingId = null;

// DOM参照は一度だけ取得して使い回す(毎分ティックや毎クリックで検索し直さない)。
const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('empty');
const addPanelEl = document.getElementById('addPanel');
const addBtnEl = document.getElementById('addBtn');
const setupPanelEl = document.getElementById('setupPanel');
const setupLabelEl = document.getElementById('setupLabel');
const setupFieldsEl = document.getElementById('setupFields');
const setupConfirmEl = document.getElementById('setupConfirm');
const toastEl = document.getElementById('toast');

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.items)){
        data.items.forEach(it=>{
          if (it && it.type === 'abyss'){
            if (!it.rank) it.rank = 1;
            // max はランクから再計算（旧データの手編集maxは捨てる）
            it.max = 240 + (Math.max(1, Math.min(200, it.rank|0)) - 1) * 5;
            if (it.current > it.max) it.current = it.max;
          }
        });
      }
      return data;
    }
  }catch(e){}
  return { items: [] };
}
// 同期localStorageは描画を止めることがある → 既定は次タスクに遅延。
// 即時が必要なときだけ save(true)
let saveTimer = null;
function saveNow(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
  }
}
function save(immediate){
  if (immediate){
    if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    saveNow();
    return;
  }
  if (saveTimer) return; // 連続操作は1回にまとめる
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    saveNow();
  }, 0);
}
// 描画を先にコミットしてから保存（確定タップ用）
function saveAfterPaint(){
  requestAnimationFrame(()=>{
    setTimeout(()=> saveNow(), 0);
  });
}
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// アプリ内のタップ操作は pointerdown に統一。ネイティブ入力の編集開始だけは、
// 長押しでキーボードを出さないため短い指離し時にfocusする。
function bindTapDown(el, handler){
  el.addEventListener('pointerdown', (e)=>{
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    handler(e);
  });
}

// 入力欄フォーカス時は常に末尾へカーソルを固定する。
function forceCursorToEnd(input){
  const place = () => { try{ input.setSelectionRange(input.value.length, input.value.length); }catch(e){} };
  input.addEventListener('focus', () => { place(); setTimeout(place, 0); });
  input.addEventListener('pointerdown', place);
}
// アカウント枠の名前欄専用：長押し判定(bindLongPressDelete)が同じ入力欄の
// pointerdown で readonly の付け外しを行っているため、forceCursorToEnd の
// pointerdown リスナーまで重ねると早押し時にフォーカスの取り合いになり、
// キーボードが開いてすぐ閉じる現象が起きていた。focus起点の処理だけに絞る。
function placeCursorOnFocus(input){
  const place = () => { try{ input.setSelectionRange(input.value.length, input.value.length); }catch(e){} };
  input.addEventListener('focus', () => { place(); setTimeout(place, 0); });
}
// 数字入力の共通処理。インライン編集側ではキャレット自体を非表示にする。
function clearOnFocus(input){
  input.addEventListener('focus', () => { input.value = ''; });
}
// 数字は通常の文字として表示し、タップ時だけ数字の真上に入力欄を重ねる。
// 入力欄はレイアウトから外してあるので、編集開始/終了で周囲の数字や「/」がズレない。
function createInlineNumber(initialValue, onCommit, editKey){
  const wrap = document.createElement('span');
  wrap.className = 'inline-number';
  const text = document.createElement('span');
  text.className = 'inline-number-text';
  let shownValue = String(initialValue);
  text.textContent = shownValue;
  wrap.appendChild(text);

  let editor = null;
  const setText = v => {
    v = String(v);
    if (v === shownValue) return;
    shownValue = v;
    text.textContent = v;
  };
  const isEditing = () => editor !== null || (editKey != null && editingId === editKey);
  const open = () => {
    if (editor) return;
    const parentHit = wrap.parentElement; // curWrap / maxWrap
    if (parentHit) parentHit.classList.add('is-editing');
    if (editKey != null) editingId = editKey;
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.pattern = '[0-9]*';
    input.className = 'inline-edit-input';
    input.autocomplete = 'off';
    input.autocapitalize = 'off';
    input.autocorrect = 'off';
    input.spellcheck = false;
    input.maxLength = 3;
    const originalValue = shownValue;
    editor = input;
    wrap.classList.add('editing');
    wrap.appendChild(input);

    // 開始直後の短時間だけ blur を握りつぶして focus を戻す。
    let guardBlur = true;
    const clearGuard = () => { guardBlur = false; };
    setTimeout(clearGuard, 350);

    const finish = () => {
      if (editor !== input) return;
      if (guardBlur) {
        try { input.focus({preventScroll:true}); } catch (e) {}
        return;
      }
      const value = input.value;
      editor = null;
      input.remove();
      wrap.classList.remove('editing');
      if (parentHit) parentHit.classList.remove('is-editing');
      if (editKey != null && editingId === editKey) editingId = null;
      onCommit(value);
    };
    input.addEventListener('input', () => {
      const v = input.value.replace(/\D/g, '').slice(0,3);
      if (input.value !== v) input.value = v;
    });
    input.addEventListener('blur', finish);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); clearGuard(); input.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); input.value = originalValue; clearGuard(); input.blur(); }
    });
    input.addEventListener('pointerdown', e => e.stopPropagation(), {capture:true});
    try { input.focus({preventScroll:true}); } catch (e) {}
  };
  return {wrap, text, open, setText, isEditing};
}

// 残り時間ではなく「何時何分に完了するか」を時刻表記で返す(スタミナ用)。
function fmtClockAt(remainMs, now){
  const d = new Date((now || Date.now()) + Math.max(0, remainMs));
  const p = n => String(n).padStart(2,'0');
  return { h: p(d.getHours()), m: p(d.getMinutes()) };
}
// 残り時間を「あと◯:◯◯」のカウントダウン表記で返す(放置報酬用)。
function fmtCountdown(ms){
  ms = Math.max(0, ms);
  const totalMin = Math.ceil(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h + ':' + String(m).padStart(2,'0');
}

function stamInfo(it, now){
  // ベースが既に満タンなら回復計算しない（満タン時刻は start に固定）
  if (it.current >= it.max){
    return { cur: it.max, remainMs:0, isFull:true, fullAt: it.start };
  }
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const recovered = Math.floor(elapsed / intervalMs);
  const cur = Math.min(it.max, it.current + recovered);
  if (cur >= it.max){
    const fullAt = it.start + Math.max(0, it.max - it.current) * intervalMs;
    return { cur: it.max, remainMs:0, isFull:true, fullAt: Math.min(now, fullAt) };
  }
  const nextIn = intervalMs - (elapsed % intervalMs);
  const need = it.max - cur;
  const remainMs = (need - 1) * intervalMs + nextIn;
  return { cur, remainMs, isFull:false };
}
// 満タンにしたら start を今に固定して、以降の回復計算を止める
function freezeIfFull(it, now){
  if (it.current >= it.max){
    it.current = it.max;
    it.start = now;
  }
}
// 現在値/上限値を書き換えても「次の1回復までの残り時間」がリセットされないよう、
// サイクルの位相(既にどれだけ経過しているか)を維持したまま基準時刻だけを進める。
function remainingAfter40(cur){
  cur = Math.max(0, Math.floor(Number(cur) || 0));
  return cur % 40; // 例: 220→20, 40→0, 39→39
}
// Dot Abyss 相当: 基礎240 + (ランク-1)×5（最大は計算のみ・手編集しない）
function abyssMaxFor(rank){
  const r = Math.max(1, Math.min(200, Math.floor(Number(rank) || 1)));
  return 240 + (r - 1) * 5;
}
function syncAbyssMax(it){
  it.rank = Math.max(1, Math.min(200, Math.floor(Number(it.rank) || 1)));
  it.max = abyssMaxFor(it.rank);
  if (it.current > it.max) it.current = it.max;
}
function preserveCycle(it, now){
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const phase = ((now - it.start) % intervalMs + intervalMs) % intervalMs;
  it.start = now - phase;
}
function idleInfo(it, now){
  const durMs = Math.max(1, it.durationMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const remainMs = Math.max(0, durMs - elapsed);
  return { remainMs, isFull: remainMs<=0, fullAt: it.start + durMs };
}
function fmtHM(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
// 満タン、または満タンまで2時間未満 → 赤
function isNearFull(remainMs, isFull){
  return !!isFull || (remainMs > 0 && remainMs < 7200000);
}
// 現在値の赤表示（文字に1回だけ当てる）
function setNearOnCurrent(editor, near){
  if (!editor || !editor.text) return;
  if (near) editor.text.style.setProperty('color', 'var(--danger)', 'important');
  else editor.text.style.removeProperty('color');
}

function timerNeedsTick(it, now){
  if (it.type==='stam' || it.type==='abyss') return !stamInfo(it, now).isFull;
  // 受取待機中は表示が固定なので、毎分tickを止めて無駄なDOM更新をしない。
  if (it.type==='idle') return it.state !== 'claim' && !idleInfo(it, now).isFull;
  return false;
}
function needsTicking(now){
  now = now || Date.now();
  return state.items.some(it=>{
    if (it.type==='group') return it.children.some(c=>timerNeedsTick(c, now));
    return timerNeedsTick(it, now);
  });
}
function tickRender(now){
  now = now || Date.now();
  for (const it of state.items){
    const r = refs[it.id];
    if (!r) continue;
    if (it.type==='group'){
      for (const child of it.children) updateTimerCard(child, r.childRefs[child.id], now);
    } else if (it.type==='stam' || it.type==='abyss' || it.type==='idle'){
      updateTimerCard(it, r, now);
    }
  }
}
function scheduleTick(gen){
  if (gen !== tickGen || !needsTicking()) return;
  const unit = 60000;
  const delay = Math.max(200, unit - (Date.now() % unit));
  tickId = setTimeout(()=>{
    tickId = null;
    if (gen !== tickGen) return;
    // 毎分はDOM構造を再構築せず、既存ノードの表示だけ差分更新。
    tickRender(Date.now());
    if (needsTicking()) scheduleTick(gen);
  }, delay);
}
function startTicking(force){
  if (force){ tickGen++; if (tickId) clearTimeout(tickId); tickId=null; }
  if (document.hidden) return;
  if (!tickId && needsTicking()) scheduleTick(tickGen);
}

// 長押し削除は全カードで共通化。
// 重要：pointerdown では通常のクリックを潰さない。短押しはブラウザ/既存の click 処理へ渡し、
// 長押しだけ削除トーストを開いて直後の click を1回だけ抑止する。
let suppressNextClick = false;
let suppressClearTimer = null;

function bindLongPressDelete(el, id, shortAction){
  const HOLD_MS = 520, MOVE_PX = 24; // 指の震え等で長押しが途中キャンセルされにくいよう少し広めに
  let timer = null, active = false, moved = false, longFired = false;
  let sx = 0, sy = 0, pid = null, nameInput = null;

  const isPrimary = e => e.isPrimary !== false && !(e.pointerType==='mouse' && e.button!==0);
  const clearSelection = ()=>{ try{ window.getSelection()?.removeAllRanges(); }catch(e){} };
  const isGroupName = target => {
    const n = target && target.closest ? target.closest('.group .name') : null;
    return !!n && el.contains(n);
  };
  const cleanup = ()=>{
    if (timer !== null){ clearTimeout(timer); timer = null; }
    active = false; moved = false; longFired = false; pid = null; nameInput = null;
  };

  el.addEventListener('pointerdown', e=>{
    // 編集系ヒットは長押しに入れない（数字・ランク・名前・編集中input）
    if (e.target && e.target.closest && (
      e.target.closest('.inline-edit-input') ||
      e.target.closest('[data-role="curWrap"]') ||
      e.target.closest('[data-role="maxWrap"]') ||
      e.target.closest('.rank') ||
      e.target.closest('input.name') ||
      e.target.closest('.name')
    )) return;
    if (el.querySelector && el.querySelector('.inline-edit-input')) return;
    if (editingId != null) return;
    if (!isPrimary(e) || active) return;
    active = true; moved = false; longFired = false;
    sx = e.clientX; sy = e.clientY; pid = e.pointerId;

    // 名前欄も、短押しは邪魔せずブラウザのネイティブなフォーカス/キーボード表示に
    // 任せる（先回りしてreadonly/preventDefaultすると、短押しでも稀にフォーカスが
    // 一瞬だけ入ってすぐ外れる＝キーボードが開いてすぐ閉じる、という副作用が出ていた）。
    // 長押しが確定した時にだけ、この入力欄からフォーカスを外す。
    if (isGroupName(e.target)){
      nameInput = e.target.closest('.group .name');
    }

    timer = setTimeout(()=>{
      if (!active || moved) return;
      timer = null;
      longFired = true;
      clearSelection();
      if (nameInput) nameInput.blur();
      suppressNextClick = true;
      if (suppressClearTimer) clearTimeout(suppressClearTimer);
      suppressClearTimer = setTimeout(()=>{ suppressNextClick=false; suppressClearTimer=null; }, 1000);
      askRemoveItem(id);
    }, HOLD_MS);
  }, {capture:true, passive:false});

  el.addEventListener('pointermove', e=>{
    if (!active || e.pointerId !== pid) return;
    if (Math.hypot(e.clientX-sx, e.clientY-sy) > MOVE_PX){
      moved = true;
      if (timer !== null){ clearTimeout(timer); timer = null; }
    }
  }, {capture:true, passive:true});

  el.addEventListener('pointerup', e=>{
    if (!active || e.pointerId !== pid) return;
    const wasLong = longFired, wasMoved = moved, input = nameInput;
    if (timer !== null){ clearTimeout(timer); timer = null; }

    if (wasLong){
      // 長押し後に発生するclickだけを抑止する。
      e.preventDefault();
      e.stopPropagation();
    } else if (!wasMoved && typeof shortAction === 'function'){
      // 短押しは各カード本来の操作へ渡す。
      // アカウント名行では、入力欄そのものをタップした時だけ編集開始。
      // 行の余白タップでは名前欄へフォーカスしない。
      if (!el.classList.contains('group-namerow') || input){
        shortAction(e);
      }
      if (input) e.stopPropagation();
    }
    cleanup();
  }, {capture:true, passive:false});

  el.addEventListener('pointercancel', e=>{
    if (!active || e.pointerId !== pid) return;
    cleanup();
  }, {capture:true, passive:true});

  el.addEventListener('contextmenu', e=>{
    if (isGroupName(e.target)){
      e.preventDefault(); e.stopPropagation(); clearSelection();
    }
  });
}
let toastTapDownHandler = null;
let longPressTargetEl = null;
function clearLongPressTarget(){
  if (longPressTargetEl){
    longPressTargetEl.classList.remove('longpress-target');
    longPressTargetEl = null;
  }
}
function askRemoveItem(id){
  clearLongPressTarget();
  const targetRef = refs[id];
  if (targetRef && targetRef.el){
    targetRef.el.classList.add('longpress-target');
    longPressTargetEl = targetRef.el;
  }
  const it = findItemById(id);
  const toast = document.getElementById('toast');
  if (!toast){ removeItem(id); return; }
  if (toastTapDownHandler){ toast.removeEventListener('pointerdown', toastTapDownHandler); toastTapDownHandler = null; }
  const canAdd = it && it.type === 'group' && it.children.length < 2;
  const isHeader = it && it.type === 'header';
  toast.innerHTML = (isHeader ? `<label class="toast-color">色<input type="color" value="${it.color || '#9b8bff'}" aria-label="ゲーム名の色"></label>` : '')
    + (canAdd ? '<button type="button" data-act="add">タイマー追加</button>' : '')
    + '<button type="button" class="ok" data-act="yes">削除</button>'
    + '<button type="button" data-act="no">やめる</button>';
  if (isHeader){
    const colorEl = toast.querySelector('.toast-color input');
    colorEl.addEventListener('input', ()=>{
      it.color = colorEl.value;
      if (refs[id]?.nameEl) refs[id].nameEl.style.color = it.color;
      save();
    });
    colorEl.addEventListener('pointerdown', e=>e.stopPropagation());
  }
  toast.classList.add('show');
  const onClick = (e)=>{
    const btn = e.target.closest('button');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'no'){
      // やめるは即閉じ
      clearLongPressTarget();
      toast.classList.remove('show');
      toast.removeEventListener('pointerdown', onClick);
      toastTapDownHandler = null;
      return;
    }
    if (act === 'yes' || act === 'add'){
      // 1回目: 破線で囲って確定待ち。他ボタンの破線は外す
      if (!btn.classList.contains('armed')){
        toast.querySelectorAll('button.armed').forEach(b => b.classList.remove('armed'));
        btn.classList.add('armed');
        return;
      }
      // 2回目: 実行
      clearLongPressTarget();
      toast.classList.remove('show');
      toast.removeEventListener('pointerdown', onClick);
      toastTapDownHandler = null;
      if (act === 'yes'){
        removeItem(id);
      } else {
        pendingAddGroupId = id;
        addPanelEl.classList.add('group-mode');
        addPanelEl.classList.add('show');
      }
    }
  };
  toastTapDownHandler = onClick;
  toast.addEventListener('pointerdown', onClick);
}
// stam / abyss 共通の下段 HTML
function valrowStamHtml(){
  return `<div class="row valrow-stam">
      <span class="stamval" data-role="curWrap"></span>
      <span class="slash">/</span>
      <span class="stammax" data-role="maxWrap"></span>
    </div>`;
}
// 現在値インライン編集（stam / abyss 共用）
function attachCurrentEditor(curWrap, it, extraCommit){
  const curEditor = createInlineNumber(stamInfo(it, Date.now()).cur, value => {
    const now = Date.now();
    if (it.type === 'abyss') syncAbyssMax(it);
    const info = stamInfo(it, now);
    const newCur = clampInt(value, 0, it.max, info.cur);
    preserveCycle(it, now);
    it.current = newCur;
    freezeIfFull(it, now);
    if (typeof extraCommit === 'function') extraCommit();
    updateOneTimer(it);
    startTicking(true);
    saveAfterPaint();
  }, it.id + ':cur');
  curWrap.appendChild(curEditor.wrap);
  return curEditor;
}
function buildStamCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card stam';
  wrap.dataset.id = it.id;
  wrap.innerHTML = `
    <div class="clockstack stam-clock" data-role="clock"></div>
    ${valrowStamHtml()}
  `;
  const curWrap = wrap.querySelector('[data-role="curWrap"]');
  const maxWrap = wrap.querySelector('[data-role="maxWrap"]');
  const curEditor = attachCurrentEditor(curWrap, it);
  const maxEditor = createInlineNumber(it.max, value => {
    const now = Date.now();
    const curNow = stamInfo(it, now).cur;
    const newMax = clampInt(value, 1, 999, it.max);
    preserveCycle(it, now);
    it.max = newMax;
    it.current = Math.min(curNow, newMax);
    freezeIfFull(it, now);
    updateOneTimer(it);
    startTicking(true);
    saveAfterPaint();
  }, it.id + ':max');
  maxWrap.appendChild(maxEditor.wrap);

  refs[it.id] = { el: wrap, curEl: curEditor, maxEl: maxEditor,
    clockEl: wrap.querySelector('[data-role="clock"]') };
  bindLongPressDelete(wrap, it.id);
  return wrap;
}

function buildAbyssCard(it){
  syncAbyssMax(it);
  const wrap = document.createElement('div');
  wrap.className = 'card abyss';
  wrap.dataset.id = it.id;
  wrap.innerHTML = `
    <div class="row abyss-head">
      <div class="clockstack abyss-clock" data-role="clock"></div>
      <input class="rank" data-role="rankInput" inputmode="numeric" pattern="[0-9]*" title="ランク">
    </div>
    ${valrowStamHtml()}
  `;
  const rankInput = wrap.querySelector('[data-role="rankInput"]');
  const curWrap = wrap.querySelector('[data-role="curWrap"]');
  const maxLabel = wrap.querySelector('[data-role="maxWrap"]');
  const curEditor = attachCurrentEditor(curWrap, it, () => { pending40Id = null; });
  // ランクはインラインのまま。フォーカス時だけ空欄。
  clearOnFocus(rankInput);
  ['paste','copy','cut','contextmenu','selectstart'].forEach(ev=>{
    rankInput.addEventListener(ev, e=>{ e.preventDefault(); });
  });
  rankInput.setAttribute('autocomplete','off');
  rankInput.setAttribute('autocapitalize','off');
  rankInput.setAttribute('autocorrect','off');
  rankInput.setAttribute('spellcheck','false');
  rankInput.addEventListener('focus', ()=>{
    if (pending40Id === it.id){ pending40Id = null; paintAbyssFortyPreview(it.id); }
  });
  rankInput.addEventListener('blur', ()=>{
    const now = Date.now();
    const live = stamInfo(it, now).cur;
    it.rank = clampInt(rankInput.value, 1, 200, it.rank || 1);
    syncAbyssMax(it);
    preserveCycle(it, now);
    it.current = Math.min(live, it.max);
    freezeIfFull(it, now);
    pending40Id = null;
    updateOneTimer(it);
    startTicking(true);
    saveAfterPaint();
  });
  const clockEl = wrap.querySelector('[data-role="clock"]');
  const onForty = (e)=>{
    e.stopPropagation();
    e.preventDefault();
    const now = Date.now();
    syncAbyssMax(it);
    const info = stamInfo(it, now);
    if (pending40Id === it.id){
      preserveCycle(it, now);
      it.current = remainingAfter40(info.cur);
      freezeIfFull(it, now);
      pending40Id = null;
      paintAbyssFortyPreview(it.id);
      startTicking(true);
      saveAfterPaint();
    } else {
      if (pending40Id && pending40Id !== it.id){
        const prev = pending40Id;
        pending40Id = null;
        paintAbyssFortyPreview(prev);
      }
      pending40Id = it.id;
      paintAbyssFortyPreview(it.id);
    }
  };
  const info0 = stamInfo(it, Date.now());
  curEditor.setText(info0.cur);
  maxLabel.textContent = String(it.max);
  rankInput.value = 'Lv.' + (it.rank || 1);
  refs[it.id] = { el: wrap, rankInput, curEl: curEditor, maxLabel, clockEl };
  bindLongPressDelete(wrap, it.id, (e) => onForty(e));
  return wrap;
}

function buildIdleCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card idle';
  wrap.dataset.id = it.id;
  wrap.innerHTML = `
    <div class="clockstack idle-clock" data-role="clock"></div>
    <div class="row valrow-idle">
      <div class="main" data-role="cur"></div>

    curEl: wrap.querySelector('[data-role="cur"]'), clockEl: wrap.querySelector('[data-role="clock"]') };

  bindLongPressDelete(wrap, it.id, ()=>toggleIdle(it));
  return wrap;
}


function buildTimerChild(it){
  return it.type==='stam' ? buildStamCard(it) : it.type==='abyss' ? buildAbyssCard(it) : buildIdleCard(it);
}
function buildGroupCard(it){

  wrap.innerHTML = `
    <div class="row namerow group-namerow">
      <input class="name" placeholder="アカウント" value="${esc(it.name)}">
    </div>
    <div class="group-body" data-role="body"></div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  placeCursorOnFocus(nameEl);
  // アカウント名も pointerdown で編集開始（長押し対象外）
  bindTapDown(nameEl, ()=>{
    try {
      nameEl.focus();
      nameEl.setSelectionRange(nameEl.value.length, nameEl.value.length);
    } catch (err) {}
  });
  const nameRowEl = wrap.querySelector('.group-namerow');
  refs[it.id] = { el: wrap, nameEl,
    bodyEl: wrap.querySelector('[data-role="body"]'),
    childRefs: {} };
  // 削除は名前行の余白長押しのみ（入力そのものは長押し対象外）
  bindLongPressDelete(nameRowEl, it.id);
  renderGroupBody(it);
  return wrap;
}
function renderGroupBody(it){
  const r = refs[it.id];
  if (!r) return;
  // 子カードの追加/削除に合わせてDOMを作り直す（並べ替えは発生しない：移動機能なし）
  const existingChildIds = new Set(it.children.map(c=>c.id));
  Object.keys(r.childRefs).forEach(id=>{ if(!existingChildIds.has(id)) delete r.childRefs[id]; });
  const single = it.children.length <= 1;
  r.el.classList.toggle('single', single);
  r.bodyEl.classList.toggle('one', single);
  for (const child of it.children){
    if (!r.childRefs[child.id]){
      const el = buildTimerChild(child);
      r.childRefs[child.id] = refs[child.id];
      r.bodyEl.appendChild(el);
    }
  }
}
function buildRuleCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'rule-line';
  wrap.style.borderTopColor = it.color || '#52617a';
  wrap.innerHTML = '';
  refs[it.id] = { el: wrap };
  bindLongPressDelete(wrap, it.id);
  return wrap;
}
function buildHeaderCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'divider';
  wrap.innerHTML = `
    <input class="name" placeholder="見出し(ゲーム名など)" value="${esc(it.name)}">
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.style.color = it.color || 'var(--accent)';
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  placeCursorOnFocus(nameEl);
  bindTapDown(nameEl, ()=>{
    try {
      nameEl.focus();
      nameEl.setSelectionRange(nameEl.value.length, nameEl.value.length);
    } catch (err) {}
  });
  refs[it.id] = { el: wrap, nameEl };
  bindLongPressDelete(wrap, it.id);
  return wrap;
}

// 構造を変えない操作は対象カードだけを更新する。
function getTimerRef(id){
  const direct = refs[id];
  if (direct) return direct;
  for (const it of state.items){
    if (it.type==='group' && it.children.some(c=>c.id===id)) return refs[it.id]?.childRefs[id] || null;
  }
  return null;
}
function updateOneTimer(it){
  updateTimerCard(it, getTimerRef(it.id), Date.now());
}
// タップで「受取」表示に切替。内部の実時間は止めない(表示だけの上書き)。
// もう一度タップ＝受取確定→フル時間で再開。
function toggleIdle(it){
  if (it.state === 'claim'){
    // 確定時だけtickを再開。待機中に止めていたタイマーをここで1回だけ再始動する。
    it.state = 'running';
    it.start = Date.now();
    if (claimId === it.id) claimId = null;
    updateOneTimer(it);
    startTicking(true);
  } else {
    // 「受取」待機中は表示が固定なので、tick自体を止める。
    it.state = 'claim';
    claimId = it.id;
    updateOneTimer(it);
    tickGen++;
    if (tickId){ clearTimeout(tickId); tickId = null; }
  }
  saveAfterPaint();
}
function cancelClaim(it){
  it.state = 'running';
  if (claimId === it.id) claimId = null;
  updateOneTimer(it);
  startTicking(true);
  saveAfterPaint();
}

// ×タップ→確認状態(赤)→もう一度タップで削除。ネイティブconfirm()はPWA環境で
// 動作しないことがあるため使わない。

document.addEventListener('pointerdown', (e) => {
  // 実際に選択状態があるときだけ解除する。通常のカードタップでは不要な処理を省く。
  try {
    if (document.activeElement !== e.target && window.getSelection){
      const sel = window.getSelection();
      if (sel && sel.rangeCount) sel.removeAllRanges();
    }
  } catch(err){}
  if (claimId != null){
    const claimed = findItemById(claimId);
    const r = claimed ? getTimerRef(claimId) : null;
    if (!claimed || !r || !r.el.contains(e.target)) cancelClaim(claimed || {id:claimId});
  }
  if (pending40Id != null){
    const r = refs[pending40Id];
    if (!r || !r.el.contains(e.target)){
      const id = pending40Id;
      pending40Id = null;
      paintAbyssFortyPreview(id);
    }
  }
  if (addPanelEl.classList.contains('show') && !addPanelEl.contains(e.target) && e.target !== addBtnEl){
    addPanelEl.classList.remove('show');
  }
  if (toastEl && toastEl.classList.contains('show') && !toastEl.contains(e.target)){
    clearLongPressTarget();
    toastEl.classList.remove('show');
    if (toastTapDownHandler){ toastEl.removeEventListener('pointerdown', toastTapDownHandler); toastTapDownHandler = null; }
  }
  // 作成パネルは基本、枠外タップで閉じない（数字入力中にキーボードを閉じただけで
  // 誤キャンセルされるのを防ぐため）。ただし仕切り線の色選択にはキャンセル手段が
  // 他に無いので、そこだけ枠外タップで閉じられるようにする。
  if (setupType === 'rule' && setupPanelEl.classList.contains('show') && !setupPanelEl.contains(e.target)){
    closeSetup();
  }
}, true);

function clampInt(v, min, max, fb){
  const n = parseInt(v,10);
  return Number.isFinite(n) ? Math.max(min, Math.min(max,n)) : fb;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function removeItem(id){
  if (refs[id]) refs[id].el.remove();
  delete refs[id];
  const topIdx = state.items.findIndex(i=>i.id===id);
  if (topIdx !== -1){
    state.items.splice(topIdx, 1);
  } else {
    for (const it of state.items){
      if (it.type !== 'group') continue;
      const idx = it.children.findIndex(c=>c.id===id);
      if (idx !== -1){
        it.children.splice(idx, 1);
        const parentRef = refs[it.id];
        if (parentRef) delete parentRef.childRefs[id];
        break;
      }
    }
  }
  save(); render(); startTicking(true);
}

// 04/20のようなデジタル時計表示を組み立てる共通処理(スタミナ・放置報酬で共用)。
function renderClock(el, remainMs, isFull, now, fullAt){
  if (!el) return;
  const key = isFull ? 'full:' + fmtHM(fullAt || now) : (()=>{ const c = fmtClockAt(remainMs, now); return c.h+c.m; })();
  if (el.dataset.clk === key) return;
  el.dataset.clk = key;
  if (isFull) el.innerHTML = `<span class="full-at">${fmtHM(fullAt || now)}</span>`;
  else el.textContent = fmtHM((now || Date.now()) + Math.max(0, remainMs));
}


// 40計算プレビュー/確定は当該Abyssカードだけ触る（全renderしない）
function findItemById(id){
  for (const it of state.items){
    if (it.id === id) return it;
    if (it.type === 'group'){
      const c = it.children.find(ch=>ch.id===id);
      if (c) return c;
    }
  }
  return null;
}
// 40プレビューの見た目更新は updateTimerCard に任せる（重複ロジック削減）
function paintAbyssFortyPreview(id){
  const it = findItemById(id);
  if (it && it.type === 'abyss') updateOneTimer(it);
}
function render(){
  const now = Date.now();
  emptyEl.style.display = state.items.length ? 'none' : 'block';

  const existingIds = new Set(state.items.map(i=>i.id));
  state.items.forEach(it=>{ if (it.type==='group') it.children.forEach(c=>existingIds.add(c.id)); });
  Object.keys(refs).forEach(id=>{ if(!existingIds.has(id)) delete refs[id]; });

  for (const it of state.items){
    if (!refs[it.id]){
      const el = it.type==='stam' ? buildStamCard(it) : it.type==='abyss' ? buildAbyssCard(it) : it.type==='idle' ? buildIdleCard(it) : it.type==='rule' ? buildRuleCard(it) : it.type==='group' ? buildGroupCard(it) : buildHeaderCard(it);
    } else if (it.type==='group'){
      renderGroupBody(it);
    }
  }

  const topEls = state.items.map(it => refs[it.id].el);

  // 順序が違うときだけ並べ替え（毎分の append を避ける）
  let needOrder = false;
  const kids = cardsEl.children;
  for (let i = 0; i < topEls.length; i++){
    if (kids[i] !== topEls[i]){ needOrder = true; break; }
  }
  if (needOrder){
    for (const el of topEls) cardsEl.appendChild(el);
  }

  for (const it of state.items){
    const r = refs[it.id];
    if (it.type==='rule') r.el.style.borderTopColor = it.color || '#52617a';
    if (it.type==='header' && r.nameEl){
      const c = it.color || '#9b8bff';
      if (r.nameEl.style.color !== c) r.nameEl.style.color = c;
    }
    if (it.type==='group'){
      if (document.activeElement !== r.nameEl && r.nameEl.value !== it.name) r.nameEl.value = it.name;
      for (const child of it.children) updateTimerCard(child, r.childRefs[child.id], now);
    } else {
      updateTimerCard(it, r, now);
    }
  }
}
// stam/abyss/idle の値更新をトップレベル/アカウント枠の子どちらでも共用する
function updateTimerCard(it, r, now){
  if (!it || !r) return;
  if (it.type==='stam'){
    let info = stamInfo(it, now);
    // 自然回復で満タン到達したら固定して以降の計算を止める
    if (info.isFull && it.current < it.max){
      it.current = it.max;
      it.start = info.fullAt || now;
      info = stamInfo(it, now);
      saveAfterPaint();
    }
    r.el.classList.toggle('full', info.isFull);
    renderClock(r.clockEl, info.remainMs, info.isFull, now, info.fullAt);
    if (r.curEl && !r.curEl.isEditing()) r.curEl.setText(info.cur);
    if (r.maxEl && !r.maxEl.isEditing()) r.maxEl.setText(it.max);
    setNearOnCurrent(r.curEl, isNearFull(info.remainMs, info.isFull));
  } else if (it.type==='abyss'){
    let info = stamInfo(it, now);
    if (info.isFull && it.current < it.max){
      it.current = it.max;
      it.start = info.fullAt || now;
      info = stamInfo(it, now);
      saveAfterPaint();
    }
    const wait40 = pending40Id === it.id;
    r.el.classList.toggle('full', info.isFull);
    r.el.classList.toggle('claim', wait40);
    renderClock(r.clockEl, info.remainMs, info.isFull, now, info.fullAt);
    if (r.rankInput && document.activeElement !== r.rankInput){
      const v = 'Lv.' + (it.rank || 1);
      if (r.rankInput.value !== v) r.rankInput.value = v;
    }
    if (r.curEl && !r.curEl.isEditing()) r.curEl.setText(wait40 ? remainingAfter40(info.cur) : info.cur);
    if (r.maxLabel){
      const v = String(it.max);
      if (r.maxLabel.textContent !== v) r.maxLabel.textContent = v;
    }
    setNearOnCurrent(r.curEl, isNearFull(info.remainMs, info.isFull));
  } else if (it.type==='idle'){
    const info = idleInfo(it, now);
    r.el.classList.toggle('claim', it.state==='claim');
    r.el.classList.toggle('full', info.isFull && it.state!=='claim');
    const label = it.state==='claim' ? '受取' : (info.isFull ? fmtHM(info.fullAt) : fmtCountdown(info.remainMs));
    if (r.curEl.textContent !== label) r.curEl.textContent = label;
    // 放置の数字：カウントダウン中かつ2時間未満で赤
    // 満タン・2時間前・受取待ちも赤維持
    r.curEl.classList.toggle('near', it.state==='claim' || isNearFull(info.remainMs, info.isFull));
    renderClock(r.clockEl, info.remainMs, info.isFull, now, info.fullAt);
  }
}

let pendingAddGroupId = null;
bindTapDown(addBtnEl, ()=>{
  pendingAddGroupId = null;
  addPanelEl.classList.remove('group-mode');
  addPanelEl.classList.toggle('show');
});
bindTapDown(addPanelEl, (e)=>{
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  const type = btn.dataset.type;
  if (type === 'group'){
    state.items.push(newGroupItem());
    addPanelEl.classList.remove('show');
    save(); render(); startTicking(true);
    return;
  }
  if (type === 'header'){
    openSetup('header');
    return;
  }
  if (type === 'rule'){
    openSetup('rule');
    return;
  }
  // stam / abyss / idle（アカウント枠の中の「タイマー追加」で出てくる選択肢）
  openSetup(type);
});

// 追加種別ごとの設定ダイアログ(回復間隔 / 満タンまでの時間をここで固定する)。
let setupType = null;
function openSetup(type){
  setupType = type;
  addPanelEl.classList.remove('show');
  if (type === 'header'){
    setupLabelEl.textContent = 'ゲーム名ヘッダーの文字色';
    const colors = ['#9b8bff','#b48cff','#6fc7ff','#70d6b0','#ffd166','#ff9f68','#ff7b9c','#d7dbe7'];
    const current = '#9b8bff';
    setupFieldsEl.innerHTML = `<div class="header-palette">${colors.map(c=>`<button type="button" class="header-swatch${c===current?' selected':''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>`;
    setupFieldsEl.querySelectorAll('.header-swatch').forEach(btn=>{
      bindTapDown(btn, ()=>{
        setupFieldsEl.querySelectorAll('.header-swatch').forEach(b=>b.classList.remove('selected'));
        btn.classList.add('selected');
        setupFieldsEl.dataset.color = btn.dataset.color;
      });
    });
    setupFieldsEl.dataset.color = current;
  } else if (type === 'stam' || type === 'abyss'){
    setupLabelEl.textContent = type === 'abyss' ? 'Abyssスタミナ回復間隔' : 'スタミナ回復間隔';
    setupFieldsEl.innerHTML = `<input type="text" inputmode="numeric" pattern="[0-9]*" id="setupInterval" value="${type==='abyss'?'3':'5'}"><span>分で1回復</span>`;
  } else if (type === 'rule'){
    setupLabelEl.textContent = '仕切り線の色（#RRGGBB）';
    setupFieldsEl.innerHTML = `<input type="color" id="setupColorPick" value="#52617a" style="width:42px;height:36px;padding:0;border:1px solid var(--line);background:transparent;">
      <input type="text" id="setupColor" value="#52617a" maxlength="7" style="width:7em;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;padding:8px;">`;
  } else {
    setupLabelEl.textContent = '満タンまでの時間';
    setupFieldsEl.innerHTML = `<input type="text" inputmode="numeric" pattern="[0-9]*" id="setupH" value="12"><span>h</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupM" value="0"><span>m</span>`;
  }
  setupFieldsEl.querySelectorAll('input').forEach(el=>{
    if (el.type === 'color') return;
    forceCursorToEnd(el);
    clearOnFocus(el); // フォーカスで空欄（放置の h/m や回復間隔）
  });
  if (type === 'rule'){
    const pick = setupFieldsEl.querySelector('#setupColorPick');
    const text = setupFieldsEl.querySelector('#setupColor');
    if (pick && text){
      pick.addEventListener('input', ()=>{ text.value = pick.value; });
      text.addEventListener('input', ()=>{
        const v = text.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) pick.value = v;
      });
    }
  }
  setupPanelEl.classList.add('show');
}
function closeSetup(){
  setupType = null;
  setupPanelEl.classList.remove('show');
}
function pushNewTimer(item){
  const group = pendingAddGroupId ? state.items.find(g=>g.id===pendingAddGroupId && g.type==='group') : null;
  if (!group || group.children.length >= 2){
    pendingAddGroupId = null;
    addPanelEl.classList.remove('group-mode');
    return false;
  }
  group.children.push(item);
  pendingAddGroupId = null;
  addPanelEl.classList.remove('group-mode');
  return true;
}
bindTapDown(setupConfirmEl, (e)=>{
  e.stopPropagation();
  if (setupType === 'header'){
    const item = newHeaderItem();
    item.color = setupFieldsEl.dataset.color || '#9b8bff';
    state.items.push(item);
  } else if (setupType === 'stam'){
    const interval = clampInt(setupFieldsEl.querySelector('#setupInterval').value, 1, 999, 5);
    if (!pushNewTimer(newStamItem(interval))) return;
  } else if (setupType === 'abyss'){
    const interval = clampInt(setupFieldsEl.querySelector('#setupInterval').value, 1, 999, 3);
    if (!pushNewTimer(newAbyssItem(interval))) return;
  } else if (setupType === 'rule'){
    let color = (setupFieldsEl.querySelector('#setupColor')||{}).value || '#52617a';
    color = String(color).trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(color)) color = '#52617a';
    state.items.push(newRuleItem(color));
  } else if (setupType === 'idle'){
    const h = clampInt(setupFieldsEl.querySelector('#setupH').value, 0, 999, 12);
    const m = clampInt(setupFieldsEl.querySelector('#setupM').value, 0, 59, 0);
    if (!pushNewTimer(newIdleItem(h*60+m))) return;
  }
  closeSetup();
  save(); render(); startTicking(true);
});

// 数字・ランク編集は #cards への pointerdown 委譲で一本化（カードごとの bind を減らす）
cardsEl.addEventListener('pointerdown', (e) => {
  if (e.isPrimary === false) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const t = e.target;
  if (!t || !t.closest) return;

  // ランク欄：pointerdown でフォーカス（長押し対象外）
  const rank = t.closest('.rank');
  if (rank) {
    try {
      rank.focus();
      rank.setSelectionRange(rank.value.length, rank.value.length);
    } catch (err) {}
    return;
  }

  const cur = t.closest('[data-role="curWrap"]');
  const max = t.closest('[data-role="maxWrap"]');
  if (!cur && !max) return;

  const host = (cur || max).closest('[data-id]');
  if (!host) return;
  const r = getTimerRef(host.dataset.id);
  if (!r) return;
  if (cur && r.curEl && r.curEl.open) r.curEl.open();
  else if (max && r.maxEl && r.maxEl.open) r.maxEl.open();
});

const resumeVeilEl = document.getElementById('resumeVeil');
let resumeTimer = null;
// 復帰処理を1本化：覆う → 差分更新 → tick再開 → 安定後に覆いを外す
function resumePipeline(){
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeVeilEl.classList.add('show');
  const finish = () => {
    tickRender(Date.now());
    startTicking(true);
    resumeTimer = setTimeout(()=>{
      resumeTimer = null;
      resumeVeilEl.classList.remove('show');
    }, 280);
  };
  requestAnimationFrame(() => requestAnimationFrame(finish));
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){
    tickGen++;
    if (tickId){ clearTimeout(tickId); tickId=null; }
    return;
  }
  resumePipeline();
});
window.addEventListener('pageshow', (e)=>{
  if (e.persisted) resumePipeline();
});

render();
startTicking(true);

// 長押しメニュー(コピー等)やドラッグ選択を出さない。
document.addEventListener('contextmenu', (e)=> e.preventDefault());
document.addEventListener('dragstart', (e)=> e.preventDefault());
// テキスト選択は入力欄側で必要な範囲だけ抑止する。
document.addEventListener('paste', (e)=> e.preventDefault());

bindTapDown(document.getElementById('updateBtn'), ()=>{
  // クエリ付きで update.html 自体のキャッシュも避ける
  location.href = 'update.html?r=' + Date.now().toString(36);
});

// Service worker: register once, never poll for updates automatically.
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
