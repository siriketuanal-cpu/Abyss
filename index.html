<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>深淵タイマー | ドットアビス</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0d14">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="深淵タイマー">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d14; --bg-panel:#131826; --bg-card:#171d2d; --bg-inset:#0e1320;
  --line:#262f45; --ink:#e9e7e0; --ink-dim:#8b93a7;
  --amber:#ffab5c; --violet:#9c86ff; --ok:#8fd6a8; --danger:#ff6b6b;
  --stam-full-c:#ff3b3b;
  --g0:#7c5fd6; --g1:#5b9dff; --g2:#8fa3c4;
  --stam-cur-c:#6fe8ff; --idle-c:#ffd166;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overscroll-behavior:none;}
body{
  background:radial-gradient(ellipse at 20% -10%,#1a2035 0%,transparent 55%),
             radial-gradient(ellipse at 90% 10%,#201530 0%,transparent 50%), var(--bg);
  color:var(--ink);
  font-family:"M PLUS Rounded 1c",sans-serif;
  min-height:100vh;
  padding:12px 10px 32px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:default;
}
.wrap{max-width:820px;margin:0 auto;}
header{margin-bottom:10px;text-align:center;}
header .eyebrow{font-family:Cinzel,serif;letter-spacing:.35em;font-size:9px;color:var(--ink-dim);text-transform:uppercase;}
header h1{
  font-family:Cinzel,serif;font-weight:700;font-size:22px;margin:2px 0 0;
  background:linear-gradient(135deg,#fff 0%,#b9c0d8 60%,var(--violet) 130%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--bg-panel);border:1px solid var(--line);border-radius:12px;
  padding:6px 12px;margin-bottom:8px;font-size:12px;color:var(--ink-dim);
  min-height:40px;
}
.bar-left{display:flex;align-items:center;gap:8px;justify-self:start;}
.bar-note{font-size:10px;color:var(--ink-dim);}
.daily-val{
  /* 淡い水色系統 */
  color:#9fd1f5;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;
  justify-self:center;white-space:nowrap;line-height:1;
  height:28px;display:flex;align-items:center;
}
.daily-progress{
  justify-self:end;display:flex;align-items:center;justify-content:flex-end;gap:3px;
  min-height:28px;height:28px;min-width:90px;
}
.pdot{
  width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:transparent;
}
.pdot.d0,.pdot.d1{--dotcolor:var(--g0);}
.pdot.d2,.pdot.d3{--dotcolor:var(--g1);}
.pdot.d4,.pdot.d5{--dotcolor:var(--g2);}
.pdot.filled{background:var(--dotcolor);border-color:var(--dotcolor);color:#fff;}
.rainbow-badge{
  font-size:22px;font-weight:900;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;
  background:conic-gradient(from 0deg,#ff5e5e,#ffb35e,#f5e05e,#7bdc7b,#5ec8ff,#a389ff,#ff5e5e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  /* 強いぼかしはレイアウトと視認性を崩すので控えめに */
  filter:drop-shadow(0 0 2px rgba(255,255,255,.35));
}
.grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px;}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
.card-row{display:flex;align-items:center;gap:11px;}
.card-row:nth-child(3),.card-row:nth-child(5){
  margin-top:9px;padding-top:9px;border-top:1px dashed #333f5c;
}
.card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:7px 11px;
  cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  flex:1 1 auto;min-width:0;
}
.card.g0{border:1.5px solid var(--g0);}
.card.g1{border:1.5px solid var(--g1);}
.card.g2{border:1.5px solid var(--g2);}
.card.open{z-index:30;}

.card.g0.open{border-color:var(--g0);box-shadow:0 0 0 1.5px var(--g0),0 8px 28px rgba(124,95,214,.3);}
.card.g1.open{border-color:var(--g1);box-shadow:0 0 0 1.5px var(--g1),0 8px 28px rgba(91,157,255,.3);}
.card.g2.open{border-color:var(--g2);box-shadow:0 0 0 1.5px var(--g2),0 8px 28px rgba(143,163,196,.3);}
.row-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.rank-disp,.rank-input{
  margin-left:auto;flex-shrink:0;width:4.2em;max-width:38%;
  color:#f0a07a;font-size:12px;font-weight:800;
  font-family:inherit;line-height:1.2;text-align:right;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.rank-disp{
  display:inline-block;border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;touch-action:manipulation;
}
.rank-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed #f0a07a;
  outline:none;caret-color:#f0a07a;text-align:right;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.rank-input.editing{display:inline-block;}

.name-disp,.name-input{
  width:6em;max-width:38%;min-width:3.5em;
  color:var(--ink);font-size:13px;font-weight:700;
  font-family:inherit;line-height:1.2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.name-disp{
  display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;touch-action:manipulation;
}
.name-disp.empty{color:var(--ink-dim);font-weight:500;}
.name-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed var(--violet);
  outline:none;caret-color:var(--ink);max-width:55%;width:8em;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.name-input.editing{display:inline-block;}
.name-input:focus{outline:none;}

.daily-mark{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:transparent;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;opacity:.4;outline:none;user-select:none;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  position:relative;z-index:26;transition:opacity .15s ease;
  appearance:none;-webkit-appearance:none;font-family:inherit;padding:0;
}
.daily-mark.show{opacity:.85;font-weight:900;background:transparent;-webkit-font-smoothing:antialiased;}
.daily-mark.g0.show{border-color:var(--g0);color:var(--g0);}
.daily-mark.g1.show{border-color:var(--g1);color:var(--g1);}
.daily-mark.g2.show{border-color:var(--g2);color:var(--g2);}
.daily-mark.armed{animation:markShake .3s ease;}
.daily-mark.disabled-by-edit{pointer-events:none;opacity:.25;}

@keyframes markShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}
.timers-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;}
.tblock{min-width:0;}
.ttag{font-size:9px;font-weight:700;letter-spacing:.04em;}
.ttag.stam{color:var(--ok);}
.ttag.idle{color:var(--idle-c);}
.tval{
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;font-family:"M PLUS Rounded 1c",sans-serif;
  line-height:1.05;white-space:nowrap;overflow:hidden;min-width:7.2ch;display:inline-block;letter-spacing:.01em;
}
.tval.stam{color:var(--ok);}
.tval.idle{color:var(--idle-c);}
.tval.full{color:var(--stam-full-c)!important;}
.tval.urgent{color:var(--stam-full-c)!important;}
.tsub{font-size:10px;color:var(--ink);height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.tsub-cur{font-weight:700;color:var(--stam-cur-c);font-family:"M PLUS Rounded 1c",sans-serif;}
.tsub-clock{margin-left:4px;}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;}
.pbar-fill{height:100%;border-radius:2px;transition:width .3s linear;}
.pbar-fill.stam{background:var(--ok);}
.pbar-fill.idle{background:var(--idle-c);}
.pbar-fill.stam.full{background:var(--stam-full-c)!important;}
.pbar-fill.idle.full{background:var(--stam-full-c)!important;}
.pbar-fill.idle.urgent{background:var(--stam-full-c)!important;}
.edit-panel{
  display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--bg-card);
  border:1px solid var(--violet);border-radius:12px;padding:10px 12px;
  box-shadow:0 12px 28px rgba(0,0,0,.55);z-index:31;
}
.card.g0 .edit-panel{border-color:var(--g0);}
.card.g1 .edit-panel{border-color:var(--g1);}
.card.g2 .edit-panel{border-color:var(--g2);}
.card.open .edit-panel{display:block;}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:25;}
.backdrop.show{display:block;}
.ebtn.idle.armed{background:linear-gradient(135deg,#ffb4b4,#ff6b6b);color:#2a0a0a;animation:armPulse .8s ease-in-out infinite;}
@keyframes armPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.edit-row:last-child{margin-bottom:0;}
.edit-row input[type="number"]{
  width:56px;background:var(--bg-inset);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);padding:6px 7px;font-size:13px;font-family:inherit;
}
.edit-row-oneline{flex-wrap:wrap;row-gap:8px;}
.edit-row-oneline > input[type="number"]{width:52px;}
.ebtn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.03em;}
.ebtn.stam{background:linear-gradient(135deg,#8ec5ff,#5b9dff);color:#0b1220;}
.ebtn.idle{background:linear-gradient(135deg,#c4b5fd,#9c86ff);color:#1a1030;}
.ebtn-gap{flex:1;}
footer{text-align:center;color:var(--ink-dim);font-size:10.5px;margin-top:10px;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="bar-left"><span class="bar-note">毎朝5:00更新</span></div>
    <span class="daily-val" id="dailyDateDisplay">—</span>
    <span class="daily-progress" id="dailyProgress"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="backdrop" id="backdrop" onclick="closeAllPanels()"></div>
</div>
<footer><span id="saveStamp">読み込み中…</span></footer>
<script>
const N = 6;
const STAM_INTERVAL = 3 * 60 * 1000;
const IDLE_DEFAULT_CAP_MS = 12 * 3600 * 1000;
const IDLE_LEAD_MS = 2 * 60 * 1000;
const URGENT_MS = 2 * 60 * 60 * 1000; // 満タンまで2時間未満で赤表示
// 公式: Lv1の自然回復上限は240。レベル上昇で上限増加（攻略情報）。
// 増加量+5/Lvは実測ベース（公式の詳細表は未公開）
const STAM_MAX_BASE = 240;
const STAM_MAX_PER_LEVEL = 5;
const RANK_MIN = 1;
const RANK_MAX = 200;

const STORAGE_KEY = 'dotabyss:unified:v1';

const defaultSlot = () => ({
  label: '',
  rank: 1,
  stamCurrent: 0, stamMax: 240, stamStart: null, stamRunning: false,
  idleStart: null, idleCapMs: IDLE_DEFAULT_CAP_MS, idleRunning: false,
  missionDone: false
});

function stamMaxFromRank(rank){
  const r = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(rank) || 1)));
  return Math.min(999, STAM_MAX_BASE + (r - 1) * STAM_MAX_PER_LEVEL);
}
function rankFromStamMax(max){
  const m = Math.max(STAM_MAX_BASE, safeNum(max, STAM_MAX_BASE));
  const r = 1 + Math.round((m - STAM_MAX_BASE) / STAM_MAX_PER_LEVEL);
  return Math.max(RANK_MIN, Math.min(RANK_MAX, r));
}

let state = { slots: Array.from({ length: N }, defaultSlot), dailyDate: '' };
let openIdx = -1;
let storageOk = true;
let textEditIdx = -1; // 名前 or ランク編集中の枠
let suppressOpenAllUntil = 0; // テキスト編集を閉じた同一タップでタイマー編集が開くのを防ぐ
let refs = [];
let tickId = null;
let armedIdle = {};
let labelSaveTimer = null;
let lastProgressSig = '';
let lastDailyLabel = '';

function groupClass(i){ return 'g' + (Math.floor(i / 2) % 3); }
function gameDayStr(){
  const d = new Date();
  if (d.getHours() < 5) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function formatDateJP(iso){
  if (!iso) return '—';
  const p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}
function safeNum(v, fb){ if (v === null || v === undefined || v === '') return fb; const n = Number(v); return Number.isFinite(n) ? n : fb; }
function formatTime(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}
function formatClock(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setText(el, text){ if (el && el.textContent !== text) el.textContent = text; }
function setClass(el, cls){ if (el && el.className !== cls) el.className = cls; }
function setWidth(el, pct){
  if (!el) return;
  const rounded = Math.round((pct || 0) * 10) / 10; // 0.1%刻みに丸めて、無意味な微小変化での再描画を防ぐ
  const w = rounded + '%';
  if (el.style.width !== w) el.style.width = w;
}
function setSaveStamp(text){
  const el = document.getElementById('saveStamp');
  if (el) el.textContent = text;
}

function ensureDailyDate(){
  const today = gameDayStr();
  if (state.dailyDate !== today) {
    state.dailyDate = today;
    state.slots.forEach(s => { s.missionDone = false; });
    for (let i = 0; i < refs.length; i++) {
      if (refs[i].mark) { refs[i].mark.classList.remove('show'); refs[i].mark.setAttribute('aria-pressed', 'false'); }
    }
    lastProgressSig = '';
    saveState();
  }
  const label = formatDateJP(state.dailyDate);
  if (label !== lastDailyLabel) {
    lastDailyLabel = label;
    const el = document.getElementById('dailyDateDisplay');
    if (el) el.textContent = label;
  }
  renderDailyProgress();
}

function renderDailyProgress(){
  const el = document.getElementById('dailyProgress');
  if (!el) return;
  let sig = '', count = 0;
  for (let k = 0; k < N; k++) {
    const done = !!state.slots[k].missionDone;
    sig += done ? '1' : '0';
    if (done) count++;
  }
  if (sig === lastProgressSig) return;
  lastProgressSig = sig;
  if (count >= N) {
    el.innerHTML = '<span class="rainbow-badge">◎</span>';
    return;
  }
  let html = '';
  for (let k = 0; k < N; k++) {
    const done = sig[k] === '1';
    html += '<span class="pdot d' + k + (done ? ' filled' : '') + '">' + (done ? '✓' : '') + '</span>';
  }
  el.innerHTML = html;
}

function parseStoredState(){
  if (typeof localStorage === 'undefined') throw new Error('no localStorage');
  const raw = localStorage.getItem(STORAGE_KEY);
  const result = { slots: null, dailyDate: gameDayStr() };
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed.slots && Array.isArray(parsed.slots) && parsed.slots.length === N) {
      const now = Date.now();
      result.slots = parsed.slots.map(s => {
        const o = defaultSlot();
        if (!s || typeof s !== 'object') return o;
        o.label = typeof s.label === 'string' ? s.label : '';
        if (s.rank != null && Number.isFinite(Number(s.rank))) {
          o.rank = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(s.rank))));
          o.stamMax = stamMaxFromRank(o.rank);
        } else {
          o.stamMax = Math.max(1, Math.min(999, safeNum(s.stamMax, STAM_MAX_BASE)));
          o.rank = rankFromStamMax(o.stamMax);
          o.stamMax = stamMaxFromRank(o.rank);
        }
        o.stamCurrent = Math.max(0, Math.min(o.stamMax, safeNum(s.stamCurrent, 0)));
        const ss = safeNum(s.stamStart, null);
        if (ss && ss > 0 && ss < Date.now() + 60000 && s.stamRunning) {
          const elapsed = Math.max(0, now - ss);
          const recovered = Math.floor(elapsed / STAM_INTERVAL);
          o.stamCurrent = Math.min(o.stamMax, o.stamCurrent + recovered);
          o.stamStart = ss + recovered * STAM_INTERVAL;
          o.stamRunning = true;
          if (o.stamCurrent >= o.stamMax) {
            o.stamCurrent = o.stamMax;
            o.stamStart = ss;
          }
        }
        o.idleCapMs = safeNum(s.idleCapMs, IDLE_DEFAULT_CAP_MS);
        const is = safeNum(s.idleStart, null);
        if (is && is > 0 && is < Date.now() + 60000 && s.idleRunning) {
          o.idleStart = is;
          o.idleRunning = true;
        }
        o.missionDone = !!s.missionDone;
        return o;
      });
    }
    result.dailyDate = typeof parsed.dailyDate === 'string' ? parsed.dailyDate : gameDayStr();
  }
  return result;
}

function loadState(){
  try {
    const parsed = parseStoredState();
    if (parsed.slots) state.slots = parsed.slots;
    state.dailyDate = parsed.dailyDate;
  } catch (e) {
    storageOk = false;
    setSaveStamp('このブラウザでは保存機能が使えません');
    state.dailyDate = gameDayStr();
  }
  build();
  render();
  if (storageOk) setSaveStamp('読み込み完了');
}

// 他タブの保存を検知した時用の軽い再同期（build()でDOMを作り直さない）
function resyncFromStorage(){
  try {
    const parsed = parseStoredState();
    if (parsed.slots) state.slots = parsed.slots;
    state.dailyDate = parsed.dailyDate;
  } catch (e) { return; }
  for (let i = 0; i < N; i++) {
    const s = state.slots[i];
    const r = refs[i];
    if (!r) continue;
    if (r.card) {
      const nameEl = document.getElementById('name-' + i);
      const nameDisp = document.getElementById('name-disp-' + i);
      if (nameEl && document.activeElement !== nameEl) nameEl.value = s.label;
      if (nameDisp && document.activeElement !== nameEl) {
        if (s.label) { nameDisp.textContent = s.label; nameDisp.classList.remove('empty'); }
        else { nameDisp.textContent = 'スロット ' + (i + 1); nameDisp.classList.add('empty'); }
      }
      const rankDisp = document.getElementById('rank-disp-' + i);
      const rankEl = document.getElementById('rank-' + i);
      if (rankDisp && document.activeElement !== rankEl) rankDisp.textContent = 'R.' + (s.rank || 1);
      if (rankEl && document.activeElement !== rankEl) rankEl.value = String(s.rank || 1);
    }
    if (r.mark) { r.mark.classList.toggle('show', !!s.missionDone); r.mark.setAttribute('aria-pressed', s.missionDone ? 'true' : 'false'); }
  }
  lastProgressSig = '';
  lastDailyLabel = '';
  render();
}

function saveState(){
  if (!storageOk) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    setSaveStamp('保存済み ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds()));
  } catch (e) {
    setSaveStamp('保存に失敗しました');
  }
}

function getStamInfo(s, now){
  if (!s.stamRunning || !s.stamStart) {
    const cur = s.stamCurrent;
    return { current: cur, fullIn: null, fullAt: null, isFull: cur >= s.stamMax, pct: s.stamMax ? (cur / s.stamMax) * 100 : 0 };
  }
  const elapsed = Math.max(0, now - s.stamStart);
  const recovered = Math.floor(elapsed / STAM_INTERVAL);
  const current = Math.min(s.stamMax, s.stamCurrent + recovered);
  if (current >= s.stamMax) return { current: s.stamMax, fullIn: 0, fullAt: null, isFull: true, pct: 100 };
  const nextIn = STAM_INTERVAL - (elapsed % STAM_INTERVAL);
  const need = s.stamMax - current;
  const fullIn = (need - 1) * STAM_INTERVAL + nextIn;
  return { current, fullIn, fullAt: now + fullIn, isFull: false, pct: s.stamMax ? Math.min(100, (current / s.stamMax) * 100) : 0 };
}

function getIdleInfo(s, now){
  if (!s.idleRunning || !s.idleStart) return { display: '—:—', meta: '未開始', pct: 0, isFull: false, remainingMs: null };
  const cap = s.idleCapMs || IDLE_DEFAULT_CAP_MS;
  const elapsed = Math.max(0, now - s.idleStart);
  const remaining = Math.max(0, cap - elapsed);
  const isFull = remaining <= 0;
  const fullAt = s.idleStart + cap;
  return {
    display: isFull ? 'MAX' : formatTime(remaining),
    meta: isFull ? formatClock(fullAt) + ' 到達' : formatClock(fullAt) + ' 満タン',
    pct: Math.min(100, (elapsed / cap) * 100),
    isFull,
    remainingMs: remaining
  };
}

function stamRemainderAfter40s(current){
  // 常に「使えるだけ40を消費してから開く」運用なので、40で割った余りを表示する
  // 例: 250 → 40を6回使って10が残る → 10
  const c = Math.max(0, Math.floor(Number(current) || 0));
  return c % 40;
}

function prefillsStamCur(i){
  const s = state.slots[i];
  const now = Date.now();
  const live = s.stamRunning ? getStamInfo(s, now).current : s.stamCurrent;
  const stepped = stamRemainderAfter40s(live);
  const curEl = document.getElementById('stam-cur-' + i);
  if (curEl) {
    curEl.value = String(stepped);
    curEl.dataset.prev = String(stepped);
  }
}

function restoreEditInputs(i){

  if (curEl) { curEl.value = String(live); curEl.dataset.prev = String(live); }
}

function onCardClick(i, ev){
  const t = ev.target;
  if (t.closest && (t.closest('input') || t.closest('button') || t.closest('.name-disp') || t.closest('.rank-disp') || t.closest('.name-input') || t.closest('.rank-input'))) return;
  // 名前・ランク編集中: テキスト編集だけ閉じる（タイマー編集は開かない）
  if (textEditIdx >= 0) {
    const ae = document.activeElement;
    if (ae && ae.classList && (ae.classList.contains('name-input') || ae.classList.contains('rank-input'))) {
      ae.blur();
    }
    textEditIdx = -1;
    suppressOpenAllUntil = Date.now() + 150;
    return;
  }
  // blur 経由で閉じた直後の同一タップでも開かない
  if (Date.now() < suppressOpenAllUntil) {
    return;
  }
  disarmAllIdle();
  // 開いている枠の上側タップで閉じる / パネル内は閉じない
  if (openIdx === i) {
    if (t.closest && t.closest('.edit-panel')) return;
    if (document.activeElement) document.activeElement.blur();
    restoreEditInputs(i);
    openIdx = -1;
    updateOpenState();
    return;
  }
  if (document.activeElement) document.activeElement.blur();
  const prevOpen = openIdx;
  openIdx = i;
  updateOpenState();
  if (prevOpen >= 0) restoreEditInputs(prevOpen);
  prefillsStamCur(i);
}

function updateOpenState(){
  const editing = openIdx >= 0;
  for (let i = 0; i < N; i++) {
    if (refs[i] && refs[i].card) {
      refs[i].card.classList.toggle('open', openIdx === i);
      refs[i].card.setAttribute('aria-expanded', openIdx === i ? 'true' : 'false');
    }
    // 編集中は右のデイリー✓を触れなくする（暗転より上にいる誤タップ対策）
    if (refs[i] && refs[i].mark) {
      refs[i].mark.classList.toggle('disabled-by-edit', editing);
    }
  }
  const bd = document.getElementById('backdrop');
  if (bd) bd.classList.toggle('show', editing);
}

let markUncheckArm = {};
function toggleMissionMark(i){
  const s = state.slots[i];
  const mark = refs[i] && refs[i].mark;
  if (!s.missionDone) {
    // チェックを入れるのはワンタップでOK
    s.missionDone = true;
    saveState();
    if (mark) { mark.classList.add('show'); mark.setAttribute('aria-pressed', 'true'); if (document.activeElement === mark) mark.blur(); }
    renderDailyProgress();
    return;
  }
  // 外す時だけダブルタップ確認

    s.missionDone = false;
    saveState();
    if (mark) { mark.classList.remove('show', 'armed'); mark.setAttribute('aria-pressed', 'false'); if (document.activeElement === mark) mark.blur(); }
    renderDailyProgress();
  } else {
    if (mark) mark.classList.add('armed');
    markUncheckArm[i] = setTimeout(() => {
      delete markUncheckArm[i];
      if (mark) mark.classList.remove('armed');
    }, 800);
  }
}

function onCurFocus(el){ el.dataset.prev = el.value; el.value = ''; }
function onCurBlur(i, el){ if (el.value === '') el.value = el.dataset.prev || state.slots[i].stamCurrent; }


function applyStam(i){
  const curEl = document.getElementById('stam-cur-' + i);
  const max = state.slots[i].stamMax;
  const raw = (curEl.value == null ? '' : String(curEl.value)).trim();
  let cur;
  if (raw === '') {
    // 空のまま更新 → 入力欄を開いた時点の候補（prev）があればそれ、なければリアルタイム値
    const prev = parseInt(curEl.dataset.prev, 10);
    if (!isNaN(prev)) cur = prev;
    else {
      const s = state.slots[i];
      cur = s.stamRunning ? getStamInfo(s, Date.now()).current : s.stamCurrent;
    }
  } else {
    cur = parseInt(raw, 10);
  }
  if (isNaN(cur)) {
    const s = state.slots[i];
    cur = s.stamRunning ? getStamInfo(s, Date.now()).current : s.stamCurrent;
  }
  if (document.activeElement) document.activeElement.blur();
  state.slots[i].stamCurrent = Math.max(0, Math.min(cur, max));
  state.slots[i].stamStart = Date.now();
  state.slots[i].stamRunning = true;
  curEl.value = state.slots[i].stamCurrent;
  saveState();
  openIdx = -1;
  updateOpenState();
  render();
}

  for (let j = 0; j < N; j++) endNameEditVisual(j);
  const el = document.getElementById('rank-' + i);
  const disp = document.getElementById('rank-disp-' + i);
  if (!el) return;
  if (disp) disp.style.display = 'none';
  el.classList.add('editing');
  el.value = String(state.slots[i].rank || 1);
  textEditIdx = i;
  el.focus({ preventScroll: true });
  const collapseSel = () => {
    try {
      const n = el.value.length;
      el.setSelectionRange(n, n);
    } catch (e) {}
  };
  collapseSel();
  setTimeout(collapseSel, 0);

}
function onRankBlur(i){
  const el = document.getElementById('rank-' + i);
  const disp = document.getElementById('rank-disp-' + i);
  if (!el) return;
  let r = parseInt(String(el.value).replace(/\D/g, ''), 10);
  if (isNaN(r)) r = state.slots[i].rank || 1;
  r = Math.max(RANK_MIN, Math.min(RANK_MAX, r));
  const now = Date.now();
  const s = state.slots[i];
  // 稼働中は現在値を確定してから上限変更（上限アップでスタミナが跳ねるのを防ぐ）
  if (s.stamRunning && s.stamStart) {
    const info = getStamInfo(s, now);
    s.stamCurrent = info.current;
    s.stamStart = now;
  }
  s.rank = r;
  s.stamMax = stamMaxFromRank(r);
  if (s.stamCurrent > s.stamMax) s.stamCurrent = s.stamMax;
  el.classList.remove('editing');
  el.value = String(r);
  if (disp) {
    disp.style.display = '';
    disp.textContent = 'R.' + r;
  }
  saveState();
  render();
  if (textEditIdx === i) textEditIdx = -1;
  suppressOpenAllUntil = Date.now() + 150;
}


function disarmIdle(i){
  if (armedIdle[i] !== undefined) {
    clearTimeout(armedIdle[i]);
    delete armedIdle[i];
    const btn = document.getElementById('recv-btn-' + i);
    if (btn) { btn.textContent = '受取'; btn.classList.remove('armed'); }
  }
}
function disarmAllIdle(){ Object.keys(armedIdle).forEach(k => disarmIdle(Number(k))); }

function onReceiveClick(i, btnEl){
  if (armedIdle[i] !== undefined) {
    clearTimeout(armedIdle[i]);
    delete armedIdle[i];
    if (document.activeElement) document.activeElement.blur();
    state.slots[i].idleStart = Date.now() - IDLE_LEAD_MS;
    state.slots[i].idleRunning = true;
    saveState();
    btnEl.textContent = '受取';
    btnEl.classList.remove('armed');
    openIdx = -1;
    updateOpenState();
    render();
  } else {
    disarmAllIdle();
    btnEl.textContent = '確定';
    btnEl.classList.add('armed');
    armedIdle[i] = setTimeout(() => {
      delete armedIdle[i];
      btnEl.textContent = '受取';
      btnEl.classList.remove('armed');
    }, 4000);
  }
}

function render(){
  try {
    ensureDailyDate();
    const now = Date.now();
    if (!refs.length) return;
    for (let i = 0; i < N; i++) {
      const s = state.slots[i];
      const r = refs[i];
      if (!r || !r.stamVal) continue;
      const stam = getStamInfo(s, now);
      const idle = getIdleInfo(s, now);
      let stamMain, stamCls, stamCurTxt, stamClockTxt, stamBarCls;
      if (s.stamRunning) {
        if (stam.isFull) {
          stamMain = 'MAX'; stamCls = 'tval stam full';
          stamCurTxt = stam.current + '/' + s.stamMax; stamClockTxt = '';
          stamBarCls = 'pbar-fill stam full';
        } else {
          stamMain = formatTime(stam.fullIn);
          const stamUrgent = stam.fullIn != null && stam.fullIn < URGENT_MS;
          stamCls = 'tval stam' + (stamUrgent ? ' urgent' : '');
          stamCurTxt = stam.current + '/' + s.stamMax;
          stamClockTxt = formatClock(stam.fullAt); stamBarCls = 'pbar-fill stam';
        }
      } else {
        stamMain = '—:—'; stamCls = 'tval stam';
        stamCurTxt = s.stamCurrent + '/' + s.stamMax; stamClockTxt = '';
        stamBarCls = 'pbar-fill stam';
      }
      setText(r.stamVal, stamMain); setClass(r.stamVal, stamCls);
      setText(r.stamSubCur, stamCurTxt); setText(r.stamSubClock, stamClockTxt);
      setWidth(r.stamBar, stam.pct); setClass(r.stamBar, stamBarCls);
      setText(r.idleVal, idle.display);
      let idleCls = 'tval idle';
      if (idle.isFull) idleCls += ' full';
      else if (s.idleRunning && idle.remainingMs != null && idle.remainingMs < URGENT_MS) idleCls += ' urgent';
      setClass(r.idleVal, idleCls);
      setText(r.idleSub, idle.meta);
      setWidth(r.idleBar, idle.pct);
      setClass(r.idleBar, 'pbar-fill idle' + (idle.isFull ? ' full' : (idleCls.indexOf('urgent') >= 0 ? ' urgent' : '')));
    }
  } catch (e) { console.warn(e); }
}

function startTicking(){
  if (tickId) { clearInterval(tickId); tickId = null; }
  tickId = setInterval(render, 1000);
}
function stopTicking(){
  if (tickId) { clearInterval(tickId); tickId = null; }
}

// ---------- イベント委譲（#grid 1箇所でまとめて受け取る） ----------
function setupDelegatedEvents(){
  const grid = document.getElementById('grid');
  if (!grid || grid.dataset.delegated) return;
  grid.dataset.delegated = '1';

  grid.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t.classList && (t.classList.contains('name-disp') || t.classList.contains('rank-disp'))) {
      return;
    }
    if (t.closest && t.closest('input')) return; // 数値入力欄はネイティブのフォーカスに任せる
    const el = t.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const i = Number(el.dataset.idx);
    if (action === 'card') onCardClick(i, ev);
    else if (action === 'update') applyStam(i);
    else if (action === 'receive') onReceiveClick(i, el);
    else if (action === 'mark') toggleMissionMark(i);
  });

  grid.addEventListener('focusin', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('stam-cur-') === 0) onCurFocus(t);
  });

  grid.addEventListener('focusout', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('stam-cur-') === 0) onCurBlur(Number(t.id.split('-').pop()), t);
    else if (t.classList && t.classList.contains('name-input')) onNameBlur(Number(t.id.split('-').pop()));
    else if (t.classList && t.classList.contains('rank-input')) onRankBlur(Number(t.id.split('-').pop()));
  });

  grid.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.classList && t.classList.contains('name-input')) {
      setLabel(Number(t.id.split('-').pop()), t.value);
    }
  });

  // 名前・ランク: span長押し成功後にだけ input へ切替（OSの選択メニューと分離）
  let lpTimer = null;
  let lpX = 0, lpY = 0;
  const LP_MS = 500;
  const LP_MOVE2 = 12 * 12;
  const clearLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
  const lpStart = (ev) => {
    const el = ev.target;
    if (!el || !el.classList) return;
    let mode = null;
    if (el.classList.contains('name-disp')) mode = 'name';
    else if (el.classList.contains('rank-disp')) mode = 'rank';
    else return;
    const i = Number((el.id || '').split('-').pop());
    if (!Number.isFinite(i)) return;
    clearLp();
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    lpX = pt.clientX; lpY = pt.clientY;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (mode === 'name') beginNameEdit(i);
      else beginRankEdit(i);
    }, LP_MS);
  };
  const lpMove = (ev) => {
    if (!lpTimer) return;
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const dx = pt.clientX - lpX, dy = pt.clientY - lpY;
    if (dx * dx + dy * dy > LP_MOVE2) clearLp();
  };
  grid.addEventListener('touchstart', lpStart, { passive: true });
  grid.addEventListener('touchmove', lpMove, { passive: true });
  grid.addEventListener('touchend', clearLp, { passive: true });
  grid.addEventListener('touchcancel', clearLp, { passive: true });
  grid.addEventListener('mousedown', (ev) => { if (ev.button === 0) lpStart(ev); });
  grid.addEventListener('mousemove', lpMove);
  grid.addEventListener('mouseup', clearLp);
}



// 長押しメニュー抑制（span表示化後は touch 監視は不要。軽量に contextmenu のみ）
document.addEventListener('contextmenu', (ev) => {
  const el = ev.target;
  // 編集中の input はペースト等を許可
  if (el && el.tagName === 'INPUT' && el.classList && el.classList.contains('editing')) return;
  if (el && el.tagName === 'INPUT' && el.type === 'number') return;
  ev.preventDefault();
}, { capture: true });

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (Date.now() < startupGraceUntil) return;
    stopTicking();
  } else {
    startTicking();
    render();
  }
});
window.addEventListener('pageshow', () => {
  startTicking();
  render();
});
window.addEventListener('focus', () => {
  if (!document.hidden) {
    startTicking();
    render();
  }
});

// 同じアプリを別タブで開いている場合、片方の保存でもう片方が古いデータのまま
// 上書きしてしまわないよう、他タブの保存を検知したらこのタブのデータも同期する
window.addEventListener('storage', (ev) => {
  if (ev.key !== STORAGE_KEY) return;
  const active = document.activeElement;
  const isEditingSomething = openIdx >= 0 || (active && (active.tagName === 'INPUT'));
  if (isEditingSomething) return; // 入力中は邪魔しない。閉じた後の次回操作で自然に揃う
  resyncFromStorage();
});

// PWA: サービスワーカー登録（file:// では使えないため http(s) の時だけ）
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
