<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深淵</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#000000; --bg-panel:#000000; --bg-card:#000000; --bg-inset:#111111;
  --line:#262f45; --ink:#e9e7e0; --ink-dim:#8b93a7;
  --amber:#ffab5c; --violet:#9c86ff; --ok:#8fd6a8; --danger:#ff6b6b;
  --stam-full-c:#ff3b3b;
  /* 到達表示は共通の語法で、ゲームごとに一目で見分けられる色を使う。 */
  --reach-abyss:#ff3b3b;
  --reach-g:#6fe8ff;
  --reach-sl:#b9aaff;
  --reach-orb:#f2a4b7;
  /* 小さい予定時刻はゲームをまたいで同じ柔らかな色に統一する。 */
  --reach-plan:#c9b8ff;
  /* オーブは次回（ラベンダー）と全回復予定（桜色）を役割別に区別する。 */
  --orb-next:#c9b8ff;
  --orb-full:#f2a4b7;
  --g0:#7c5fd6; --g1:#5b9dff; --g2:#8fa3c4;
  --stam-cur-c:#6fe8ff; --idle-c:#ffd166;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overscroll-behavior:none;background-color:#000;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  min-height:100vh;
  padding:12px 10px 32px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:none!important;
}
.wrap{max-width:820px;margin:0 auto;}
.bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--bg-panel);border:1px solid #3d4a62;border-radius:12px;
  padding:6px 12px;margin-bottom:8px;font-size:12px;color:var(--ink-dim);
  min-height:40px;
}
.bar-left{display:flex;align-items:center;gap:8px;justify-self:start;}
.bar-note{font-size:10px;color:var(--ink-dim);display:none;}
.daily-val{
  color:#9fd1f5;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;
  justify-self:center;white-space:nowrap;line-height:1;
  height:28px;display:flex;align-items:center;
}
.daily-progress{
  justify-self:end;display:flex;align-items:center;justify-content:flex-end;gap:3px;
  min-height:28px;height:28px;min-width:90px;
}
.pdot{
  width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:transparent;
}
.pdot.d0,.pdot.d1{--dotcolor:var(--g0);}
.pdot.d2,.pdot.d3{--dotcolor:var(--g1);}
.pdot.d4,.pdot.d5{--dotcolor:var(--g2);}
.pdot.filled{background:var(--dotcolor);border-color:var(--dotcolor);color:#fff;}
.complete-badge{
  display:inline-flex;align-items:center;justify-content:center;
  height:20px;padding:0 6px;border-radius:4px;
  font-size:9px;font-weight:800;letter-spacing:.04em;
  line-height:1;white-space:nowrap;
  color:#1a1408;
  background:#ffc94a;
  border:1px solid #e0a82e;
}
/* テスト用: ドットアビスをグループカラーごとに切り替える。 */
.abyss-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.abyss-tab{
  min-height:32px;border:1px solid #3d4a62;border-radius:8px;background:#0c111c;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;gap:5px;
  font:700 10.5px/1 inherit;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.abyss-tab-name{font-size:12px;font-weight:800;white-space:nowrap;}
/* 時間はグループ色と分け、どのタブでも同じ淡いアンバーで読ませる。 */
.abyss-tab-idle{color:#ffd98f;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;opacity:1;text-shadow:0 0 4px rgba(255,217,143,.16);}
.abyss-tab.g0{color:#b9aaff;}.abyss-tab.g1{color:#a6ccff;}.abyss-tab.g2{color:#c2ccdf;}
.abyss-tab.active.g0{border-color:var(--g0);background:#1a1530;box-shadow:0 0 0 1px rgba(124,95,214,.25);}
.abyss-tab.active.g1{border-color:var(--g1);background:#10233c;box-shadow:0 0 0 1px rgba(91,157,255,.25);}
.abyss-tab.active.g2{border-color:var(--g2);background:#1c2330;box-shadow:0 0 0 1px rgba(143,163,196,.25);}
/* スタミナが2時間未満のグループは、該当タブの識別文字だけを太い赤で知らせる。 */
.abyss-tab.urgent .abyss-tab-name{color:#ff5656;font-weight:900;text-shadow:0 0 5px rgba(255,86,86,.28);}
/* 放置報酬の実タイマーと同じ緊急条件では、タブ内の放置タイマーだけを赤字にする。 */
.abyss-tab.idle-urgent .abyss-tab-idle{color:var(--stam-full-c);font-weight:900;text-shadow:0 0 5px rgba(255,86,86,.28);}
.grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px;}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
.grid[data-group] .card-row{display:none;margin-top:0!important;padding-top:0!important;border-top:none!important;}
.grid[data-group="g0"] .card-row[data-group="g0"],
.grid[data-group="g1"] .card-row[data-group="g1"],
.grid[data-group="g2"] .card-row[data-group="g2"]{display:flex;}
.card-row{display:flex;align-items:center;gap:11px;}
/* ドットアビスはスタミナと放置報酬を独立カードとして横並びにする。 */
.abyss-timers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;flex:1 1 auto;min-width:0;}
.abyss-timers > .card{min-width:0;}
/* 放置報酬は一枚カードのまま、スタミナ側の名前・ランク行ぶんだけ上部余白を確保する。 */
.card.abyss-idle-card{cursor:pointer;padding-top:29px;}
.card-row:nth-child(3),.card-row:nth-child(5){
  margin-top:2px;padding-top:8px;border-top:1px solid #5a6a88;
}
.card{
  background:var(--bg-card);border:1px solid #2c2c2c;border-radius:12px;padding:7px 11px;
  cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  flex:1 1 auto;min-width:0;
  transition:border-color .12s ease;
  contain:layout style;
}
.card.g0{border:1.5px solid var(--g0);}
.card.g1{border:1.5px solid var(--g1);}
.card.g2{border:1.5px solid var(--g2);}
.card.open{z-index:30;}

.card.g0.open{border-color:var(--g0);box-shadow:0 0 0 1.5px var(--g0);}
.card.g1.open{border-color:var(--g1);box-shadow:0 0 0 1.5px var(--g1);}
.card.g2.open{border-color:var(--g2);box-shadow:0 0 0 1.5px var(--g2);}

/* ドットアビスは内部操作を分離したまま、外枠だけを連結して1枚の管理カード風に見せる。 */
.abyss-timers{position:relative;gap:0;flex:0 0 75%;max-width:75%;}
.abyss-timers > .abyss-stam-card{
  border-radius:12px 0 0 12px;
  border-right:0!important;
  padding-right:12px;
}
.abyss-timers > .abyss-idle-card{
  border-radius:0 12px 12px 0;
  border-left:0!important;
  padding-left:12px;
}
/* 選択タブは内側を中立な濃色に保ち、下線・外枠・文字の強調だけで状態を伝える。 */
.abyss-tab{position:relative;overflow:hidden;}
.abyss-tab:not(.active){background:#090e17;border-color:#2d3a51;}
.abyss-tab.active{border-width:1.5px;background:#101824;box-shadow:0 0 0 1px rgba(210,224,255,.18);}
.abyss-tab.active::before{
  content:'';position:absolute;z-index:0;left:0;right:0;bottom:0;height:2px;
  border-radius:0;background:currentColor;opacity:.95;
}
.abyss-tab > *{position:relative;z-index:1;}
.abyss-tab.active .abyss-tab-name{font-weight:900;}
.abyss-tab.active.g0{border-color:#9f86ff;background:#101824;box-shadow:0 0 0 1px rgba(159,134,255,.34);}
.abyss-tab.active.g1{border-color:#77b7ff;background:#101824;box-shadow:0 0 0 1px rgba(119,183,255,.34);}
.abyss-tab.active.g2{border-color:#b5c5e0;background:#101824;box-shadow:0 0 0 1px rgba(181,197,224,.34);}
.row-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
/* 放置報酬は一枚の受取カードとして扱い、デイリー✔だけを右上へ重ねる。 */
.abyss-idle-card .daily-mark{
  position:absolute;z-index:2;top:7px;right:11px;
  width:auto;height:auto;border:none;border-radius:0;background:transparent;box-shadow:none;
  color:transparent;font-size:24px;line-height:1;text-shadow:none;pointer-events:none;cursor:inherit;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;
}
.idle-mark.daily-mark.show{
  color:#b9aaff;background:transparent;border:none;box-shadow:none;
  text-shadow:0 0 7px rgba(185,170,255,.55);
}
.idle-mark.g0.daily-mark.show{
  color:#b9aaff;background:transparent;border:none;box-shadow:none;
  text-shadow:0 0 7px rgba(185,170,255,.55);
}
.idle-mark.g1.daily-mark.show{
  color:#6fe8ff;background:transparent;border:none;box-shadow:none;
  text-shadow:0 0 7px rgba(111,232,255,.55);
}
.idle-mark.g2.daily-mark.show{
  color:#d0d8e8;background:transparent;border:none;box-shadow:none;
  text-shadow:0 0 7px rgba(208,216,232,.55);
}
.idle-mark.disabled-by-edit{pointer-events:none;opacity:.25;}
.rank-disp,.rank-input{
  margin-left:auto;flex-shrink:0;width:4.2em;max-width:38%;
  color:#f0a07a;font-size:12px;font-weight:800;
  font-family:inherit;line-height:1.2;text-align:right;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
  .rank-disp{
  display:inline-block;border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;-webkit-user-drag:none;touch-action:manipulation;
}
.rank-disp::selection{background:transparent;color:inherit;}
/* 長押しの対象は表示枠全体ではなく、実際の文字の近くに限定する。 */
.name-lp-hit,.rank-lp-hit{
  display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:0 1px;cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;
}
.rank-lp-hit{min-width:2.4em;text-align:right;}
.rank-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed #f0a07a;
  outline:none;caret-color:#f0a07a;text-align:right;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.rank-input.editing{display:inline-block;}

.name-disp,.name-input{
  width:6em;max-width:38%;min-width:3.5em;
  color:var(--ink);font-size:13px;font-weight:700;
  font-family:inherit;line-height:1.2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.name-disp{
  display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;touch-action:manipulation;
}
.name-disp.empty{color:var(--ink-dim);font-weight:500;}
.name-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed var(--violet);
  outline:none;caret-color:var(--ink);max-width:55%;width:8em;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.name-input.editing{display:inline-block;}
.name-input:focus{outline:none;}


@keyframes markShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}
.tblock{min-width:0;}
.ttag{font-size:9px;font-weight:700;letter-spacing:.04em;}
.ttag.stam{color:var(--ok);}
.ttag.idle{color:var(--idle-c);}
.tval{
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  line-height:1.05;white-space:nowrap;overflow:hidden;min-width:7.2ch;display:inline-block;letter-spacing:.01em;
}
.tval.stam{color:var(--ok);}
.tval.idle{color:var(--idle-c);}
.tval.full{color:var(--stam-full-c)!important;}
.tval.reached{color:var(--reach-abyss)!important;}
.tval.urgent{color:var(--stam-full-c)!important;}
.tsub{font-size:10px;color:var(--ink);height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.tsub{position:relative;}
.tsub-cur{display:inline-block;width:calc(3ch + 2px);font-weight:700;text-align:right;color:#ffb35e;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
/* 現在値だけを元の3文字幅の領域で置き換える。後続の/上限値と時刻は動かさない。 */
.tsub-cur-input{
  display:none;position:absolute;left:0;top:0;width:3ch;height:13px;box-sizing:border-box;margin:0;padding:0;
  border:0;border-radius:0;background:transparent;color:#ffb35e;
  font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  font-size:10px;line-height:13px;font-weight:700;text-align:left;outline:none;appearance:textfield;-moz-appearance:textfield;
}
.tsub-cur-input::-webkit-outer-spin-button,.tsub-cur-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.tsub.stam-manual-editing .tsub-cur{visibility:hidden;}
.tsub.stam-manual-editing .tsub-cur-input{display:block;}
/* 1回目のタップで表示する40消費後の参考値。対象カードは暗転より前面に保つ。 */
.card.stam-preview{z-index:28;}
.tsub-sep{font-weight:600;color:var(--ink-dim);margin:0 1px;}
.tsub-max{font-weight:700;color:var(--stam-cur-c);font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
.tsub-clock{margin-left:4px;font-weight:700;color:var(--reach-plan);}
.idle-clock{color:var(--reach-plan);font-weight:700;}
.idle-meta{color:var(--reach-plan);font-weight:700;}
/* 放置報酬の受取待機は色と文字だけで示し、点滅・アニメーションは使わない。 */
.tblock-idle{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tblock-idle.receive-armed .tval.idle{color:#bfe8ff!important;}
.tblock-idle.receive-armed .idle-meta{color:#bfe8ff!important;}
.edit-panel{
  display:none;position:absolute;top:calc(100% + 6px);background:#000;
  border:1px solid var(--violet);border-radius:12px;padding:10px 12px;
  z-index:31;
  contain:layout style;
  box-sizing:border-box;
  width:100%;
  left:0;right:auto;
}
.card.g0 .edit-panel{border-color:var(--g0);}
.card.g1 .edit-panel{border-color:var(--g1);}
.card.g2 .edit-panel{border-color:var(--g2);}
.card.open .edit-panel{display:block;border-color:var(--ok);}
.edit-side-stam{
  display:flex;align-items:center;width:100%;min-width:0;
  justify-content:flex-start;position:relative;gap:0;min-height:34px;
}
.edit-side-stam input[type="number"]{
  width:42px;
  flex:0 0 42px;
  background:var(--bg-inset);
  border:1px solid #4a5a78;
  border-radius:6px;
  color:var(--ink);
  padding:4px 5px;
  font-size:11.5px;
  font-family:inherit;
  text-align:center;
  box-sizing:border-box;
}
.edit-side-stam .ebtn.stam{
  position:absolute;
  left:58%;
  transform:translateX(-50%);
  padding:6px 12px;
  font-size:11.5px;
  border-radius:8px;
  white-space:nowrap;
}

.backdrop{
  display:none;
  position:fixed;
  z-index:25;
  top:-30vh;
  left:0;
  right:0;
  height:160vh;
  width:100%;
  background:#000;
  opacity:.72;
  pointer-events:auto;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
.backdrop.show{display:block;}
/* 放置報酬の受取確認は、編集モーダルより薄い暗転で対象だけを明確にする。 */
.backdrop.idle-confirm{display:block;z-index:27;opacity:.72;}
.abyss-idle-card.receive-armed{z-index:28;}
.ebtn.idle.armed{background:linear-gradient(135deg,#ffb4b4,#ff6b6b);color:#2a0a0a;animation:armPulse .8s ease-in-out infinite;}
@keyframes armPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.edit-row:last-child{margin-bottom:0;}
.edit-row input[type="number"]{
  width:56px;background:var(--bg-inset);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);padding:6px 7px;font-size:13px;font-family:inherit;
}
.edit-row-oneline{flex-wrap:wrap;row-gap:8px;}
.edit-row-oneline > input[type="number"]{width:52px;}
.ebtn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.03em;}
.ebtn.stam{background:linear-gradient(135deg,#8ec5ff,#5b9dff);color:#0b1220;}
.ebtn.idle{background:linear-gradient(135deg,#c4b5fd,#9c86ff);color:#1a1030;}
.ebtn-gap{flex:1;}
footer{text-align:center;color:var(--ink-dim);font-size:10.5px;margin-top:10px;display:none;}

	/* テスト用ゲームタブ */
	.game-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
/* ドットアビスの75%タイマー領域と、ゲームタブ・ゲームパネルの基準幅を揃える。 */
#abyssTabs,#gameTabs,.game-tab-panel{width:calc(37.5% - 2.25px);max-width:calc(37.5% - 2.25px);}
@media (max-width:619px){#abyssTabs,#gameTabs,.game-tab-panel{width:75%;max-width:75%;}}
/* 共通75%幅のタイマー領域を、それぞれの所属領域の中央へ揃える。 */
#grid .card-row{justify-content:center;}
#abyssTabs,#gameTabs,.game-tab-panel{margin-left:auto;margin-right:auto;}
	.game-tab{
	  min-height:34px;border:1px solid #3d4a62;border-radius:9px;background:#0c111c;color:var(--ink-dim);
	  font:700 11.5px/1 inherit;letter-spacing:.03em;cursor:pointer;
	  -webkit-tap-highlight-color:transparent;
	}
	.game-tab.active{border-color:#6fe8ff;background:#132b35;color:#dff9ff;box-shadow:0 0 0 1px rgba(111,232,255,.2);}
		.game-tab-panel{display:none;}
		/* タブ下枠とタイマーカード上枠が重なって見えないよう、両ゲームに共通の最小余白を設ける。 */
		.game-tab-panel.active{display:block;margin-top:6px;}
		.game-tab-panel .gsection,.game-tab-panel .slsection{margin-top:0;}
	
	.gsection{margin-top:14px;}
.gsection-title{
  font-size:11px;color:var(--ink-dim);font-weight:700;margin:0 0 6px 2px;
  display:flex;align-items:baseline;gap:6px;
}
.gsection-note{font-size:9.5px;font-weight:400;color:#5c6785;display:none;}
.gwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .gcard{
  background:var(--bg-card);border:1.5px solid #3a3a3a;border-radius:12px;padding:7px 9px;
  cursor:pointer;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent;
}
.gcard.g-inline-active{z-index:30;}
.grow-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.gname-disp,.gname-input{
  font-size:10.5px;font-weight:700;color:var(--ink);
  font-family:inherit;line-height:1.2;max-width:70%;min-width:2.5em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}

  .tsub-cur,.tsub-max,.gsub .gsub-cur,.gsub .gsub-max,.sl-stamina-current-display,

  /* 数値インライン入力の共通基準。キャレットの高さ・太さは文字サイズと行高に従うため、全タイマーで同じ値へ揃える。 */

  /*

  .tsub-cur-input,.g-inline-current-field{

<script>
const N = 6;
const STAM_INTERVAL = 3 * 60 * 1000;
const IDLE_DEFAULT_CAP_MS = 12 * 3600 * 1000;
// ドットアビスの確認待ちは、画面外を押すまで維持し、再タップで確定する。
const IDLE_LEAD_MS = 2 * 60 * 1000;
const URGENT_MS = 2 * 60 * 60 * 1000;
const STAM_MAX_BASE = 240;
const STAM_MAX_PER_LEVEL = 5;
const RANK_MIN = 1;
const RANK_MAX = 200;

const STORAGE_KEY = 'dotabyss:unified:v1';

const defaultSlot = () => ({
  label: '',
  rank: 1,
  stamCurrent: 0, stamMax: 240, stamStart: null, stamRunning: false,
  idleStart: null, idleCapMs: IDLE_DEFAULT_CAP_MS, idleRunning: false,
  missionDone: false
});

function stamMaxFromRank(rank){
  const r = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(rank) || 1)));
  return Math.min(999, STAM_MAX_BASE + (r - 1) * STAM_MAX_PER_LEVEL);
}
function rankFromStamMax(max){
  const m = Math.max(STAM_MAX_BASE, safeNum(max, STAM_MAX_BASE));
  const r = 1 + Math.round((m - STAM_MAX_BASE) / STAM_MAX_PER_LEVEL);
  return Math.max(RANK_MIN, Math.min(RANK_MAX, r));
}

// ---- Gジェネ ----
const GN = 2;
const G_STAM_INTERVAL = 5 * 60 * 1000;
const G_RESET_HOUR = 1;
const defaultGSlot = () => ({
  label: '',
  stamCurrent: 0, stamMax: 130, stamStart: null, stamRunning: false, missionDone: false
});
let gRefs = [];

// ---- 幻想水滸伝 STAR LEAP ----
const SL_STAM_MAX = 80;
const SL_STAM_INTERVAL = 12 * 60 * 1000;
const SL_ORB_MAX = 4;
const SL_ORB_INTERVAL = 6 * 60 * 60 * 1000;
const defaultSLTimer = () => ({ current: 0, start: null, running: false });
const defaultSLState = () => ({ stamina: defaultSLTimer(), orb: defaultSLTimer() });
let slEdit = null;
let slRefs = {};

let state = { slots: Array.from({ length: N }, defaultSlot), dailyDate: '', g: { slots: Array.from({ length: GN }, defaultGSlot), dailyDate: '' }, sl: defaultSLState() };

let storageOk = true;
let textEditIdx = -1;
let refs = [];
let abyssTabRefs = {};
let tickId = null;
// 単一の自己スケジュール型描画ループの世代。古い予約済みコールバックを無効化する。
let tickGeneration = 0;
// 1操作内で複数clickが起きても、次フレームの復旧は1回だけにまとめる。
let interactionTickRecoveryFrame = 0;
let resetCheckTimer = null;
let swRegistrationScheduled = false;
let armedIdle = {};
// ドットアビスのスタミナ操作は同時に1枚だけ開けるため、編集状態を単一値で保持する。
let stamEdit = null;
// 手入力中に同じタイマーをタップした際、そのタップは確定操作として一度だけ消費する。
let pendingManualStamTap = -1;
// 長押し確定・長押しチェックの直後に発生する同一カードのclickだけを消費する。時間ベースの全体ガードにはしない。
let pendingLongPressClick = null;
// 数値インライン編集の状態定数。入口操作はゲーム別のまま、状態遷移だけを明文化する。
const DOT_EDIT_PHASE = Object.freeze({ REFERENCE: 'reference', MANUAL: 'manual' });
const G_EDIT_MODE = Object.freeze({ ARMED: 'armed', CURRENT: 'current', MAX: 'max' });
let labelSaveTimer = null;
let lastProgressSig = '';
let lastDailyLabel = '';

function groupClass(i){ return 'g' + (Math.floor(i / 2) % 3); }
function dayStrAt(resetHour){
  const d = new Date();
  if (d.getHours() < resetHour) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function gameDayStr(){ return dayStrAt(5); }
function formatDateJP(iso){
  if (!iso) return '—';
  const p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}
function safeNum(v, fb){ if (v === null || v === undefined || v === '') return fb; const n = Number(v); return Number.isFinite(n) ? n : fb; }
function formatTime(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}
function formatClock(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
// 小さい予定表示は時刻だけにし、到達後の主表示だけに「到達」を付ける。
function formatPlanClock(ts){ return ts ? formatClock(ts) : ''; }
function formatFixedDuration(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
}
// Gジェネ・スターリープの分単位表示用。残り時間を過小に見せないよう切り上げる。
function formatGameMinute(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const totalMinutes = Math.max(1, Math.ceil(ms / 60000));
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours + ':' + String(minutes).padStart(2, '0');
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setText(el, text){ if (!el) return; if (el.dataset._h !== undefined) delete el.dataset._h; if (el.textContent !== text) el.textContent = text; }
// 時刻値と接尾辞は固定DOMへ差分テキストだけを流し込み、毎秒のinnerHTML差替えを避ける。
function setClockParts(timeEl, suffixEl, timeText, suffixText){
  setText(timeEl, timeText || '');
  setText(suffixEl, suffixText || '');
}
function setClass(el, cls){ if (el && el.className !== cls) el.className = cls; }
function setAttr(el, name, value){
  if (!el) return;
  const next = String(value);
  if (el.getAttribute(name) !== next) el.setAttribute(name, next);
}
function setVisible(el, visible){
  if (!el) return;
  const next = visible ? '' : 'none';
  if (el.style.display !== next) el.style.display = next;
}
function clampInt(value, min, max, fallback){
  const parsed = parseInt(String(value == null ? '' : value).trim(), 10);
  return Number.isFinite(parsed) ? Math.max(min, Math.min(max, parsed)) : fallback;
}
function setLongPressDisplay(disp, hitClass, text){
  if (!disp) return;
  const hit = document.createElement('span');
  hit.className = hitClass;
  hit.textContent = text;
  disp.replaceChildren(hit);
}
function restoreLongPressEdit(input, disp, inputValue, displayValue, hitClass, empty){
  if (input) { input.classList.remove('editing'); input.value = inputValue; }
  if (!disp) return;
  setVisible(disp, true);
  setLongPressDisplay(disp, hitClass, displayValue);
  disp.classList.toggle('empty', !!empty);
}
function focusEditAtEnd(input){
  if (!input) return;
  input.focus({ preventScroll: true });
  const place = () => { try { input.setSelectionRange(input.value.length, input.value.length); } catch(e){} };
  place(); setTimeout(place, 0); setTimeout(place, 40);
}
function setSaveStamp(text){
  const el = document.getElementById('saveStamp');
  if (el) el.textContent = text;
}

function ensureDailyDate(){
  const today = gameDayStr();
  if (state.dailyDate !== today) {
    state.dailyDate = today;
    state.slots.forEach(s => { s.missionDone = false; });
    for (let i = 0; i < refs.length; i++) {
      if (refs[i] && refs[i].mark) { refs[i].mark.classList.remove('show'); refs[i].mark.setAttribute('aria-pressed', 'false'); }
    }
    lastProgressSig = '';
    saveState();
  }
  const label = formatDateJP(state.dailyDate);
  if (label !== lastDailyLabel) {
    lastDailyLabel = label;
    const el = document.getElementById('dailyDateDisplay');
    if (el) el.textContent = label;
  }
  renderDailyProgress();
}

function renderDailyProgress(){
  const el = document.getElementById('dailyProgress');
  if (!el) return;
  let sig = '', count = 0;
  for (let k = 0; k < N; k++) {
    const done = !!state.slots[k].missionDone;
    sig += done ? '1' : '0';
    if (done) count++;
  }
  if (sig === lastProgressSig) return;
  lastProgressSig = sig;
  if (count >= N) {
    el.innerHTML = '<span class="complete-badge">COMPLETE</span>';
    return;
  }
  let html = '';
  for (let k = 0; k < N; k++) {
    const done = sig[k] === '1';
    html += '<span class="pdot d' + k + (done ? ' filled' : '') + '">' + (done ? '✓' : '') + '</span>';
  }
  el.innerHTML = html;
}

function parseStoredState(){
  if (typeof localStorage === 'undefined') throw new Error('no localStorage');
  const raw = localStorage.getItem(STORAGE_KEY);
  const result = { slots: null, dailyDate: gameDayStr(), g: { slots: null, dailyDate: dayStrAt(G_RESET_HOUR) }, sl: defaultSLState() };
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed.slots && Array.isArray(parsed.slots) && parsed.slots.length === N) {
      const now = Date.now();
      result.slots = parsed.slots.map(s => {
        const o = defaultSlot();
        if (!s || typeof s !== 'object') return o;
        o.label = typeof s.label === 'string' ? s.label : '';
        if (s.rank != null && Number.isFinite(Number(s.rank))) {
          o.rank = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(s.rank))));
          o.stamMax = stamMaxFromRank(o.rank);
        } else {
          o.stamMax = Math.max(1, Math.min(999, safeNum(s.stamMax, STAM_MAX_BASE)));
          o.rank = rankFromStamMax(o.stamMax);
          o.stamMax = stamMaxFromRank(o.rank);
        }
        o.stamCurrent = Math.max(0, Math.min(o.stamMax, safeNum(s.stamCurrent, 0)));
        const ss = safeNum(s.stamStart, null);
        if (ss && ss > 0 && ss < Date.now() + 60000 && s.stamRunning) {
          const elapsed = Math.max(0, now - ss);
          const recovered = Math.floor(elapsed / STAM_INTERVAL);
          o.stamCurrent = Math.min(o.stamMax, o.stamCurrent + recovered);
          o.stamStart = ss + recovered * STAM_INTERVAL;
          o.stamRunning = true;
          if (o.stamCurrent >= o.stamMax) {
            o.stamCurrent = o.stamMax;
            o.stamStart = ss;
          }
        }
        o.idleCapMs = safeNum(s.idleCapMs, IDLE_DEFAULT_CAP_MS);
        const is = safeNum(s.idleStart, null);
        if (is && is > 0 && is < Date.now() + 60000 && s.idleRunning) {
          o.idleStart = is;
          o.idleRunning = true;
        }
        o.missionDone = !!s.missionDone;
        return o;
      });
    }
    result.dailyDate = typeof parsed.dailyDate === 'string' ? parsed.dailyDate : gameDayStr();
    result.g = result.g || { slots: null, dailyDate: dayStrAt(G_RESET_HOUR) };
    if (parsed.g && Array.isArray(parsed.g.slots) && parsed.g.slots.length === GN) {
      const now2 = Date.now();
      result.g.slots = parsed.g.slots.map(s => {
        const o = defaultGSlot();
        if (!s || typeof s !== 'object') return o;
        o.label = typeof s.label === 'string' ? s.label : '';
        o.stamMax = Math.max(1, Math.min(999, safeNum(s.stamMax, 130)));
        o.stamCurrent = Math.max(0, Math.min(o.stamMax, safeNum(s.stamCurrent, 0)));
        const ss = safeNum(s.stamStart, null);
        if (ss && ss > 0 && ss < Date.now() + 60000 && s.stamRunning) {
          const elapsed = Math.max(0, now2 - ss);
          const recovered = Math.floor(elapsed / G_STAM_INTERVAL);
          o.stamCurrent = Math.min(o.stamMax, o.stamCurrent + recovered);
          o.stamStart = ss + recovered * G_STAM_INTERVAL;
          o.stamRunning = true;
          if (o.stamCurrent >= o.stamMax) { o.stamCurrent = o.stamMax; o.stamStart = ss; }
        }
        o.missionDone = !!s.missionDone;
        return o;
      });
      result.g.dailyDate = typeof parsed.g.dailyDate === 'string' ? parsed.g.dailyDate : dayStrAt(G_RESET_HOUR);
    }

    if (parsed.sl && typeof parsed.sl === 'object') {
      const readSLTimer = (source, max) => {
        const out = defaultSLTimer();
        if (!source || typeof source !== 'object') return out;
        out.current = Math.max(0, Math.min(max, safeNum(source.current, 0)));
        const start = safeNum(source.start, null);
        if (source.running && start && start > 0 && start < Date.now() + 60000) {
          out.start = start;
          out.running = true;
        }
        return out;
      };
      result.sl.stamina = readSLTimer(parsed.sl.stamina, SL_STAM_MAX);
      result.sl.orb = readSLTimer(parsed.sl.orb, SL_ORB_MAX);
    }
  }
  return result;
}

function loadState(){
  try {
    const parsed = parseStoredState();
    if (parsed.slots) state.slots = parsed.slots;
    state.dailyDate = parsed.dailyDate;
    if (parsed.g && parsed.g.slots) state.g.slots = parsed.g.slots;
    if (parsed.g) state.g.dailyDate = parsed.g.dailyDate;
    if (parsed.sl) state.sl = parsed.sl;
  } catch (e) {
    storageOk = false;
    setSaveStamp('このブラウザでは保存機能が使えません');
    state.dailyDate = gameDayStr();
  }
  build();
  render();
  // 進行中のタイマーがある場合だけ、毎秒描画を開始する。
  startTicking();
  scheduleResetCheck();
  if (storageOk) setSaveStamp('読み込み完了');
}

function saveState(){
  if (!storageOk) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    setSaveStamp('保存済み ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds()));
  } catch (e) {
    setSaveStamp('保存に失敗しました');
  }
}

function getStamInfo(s, now){
  if (!s.stamRunning || !s.stamStart) {
    const cur = s.stamCurrent;
    return { current: cur, fullIn: null, fullAt: null, isFull: cur >= s.stamMax };
  }
  const elapsed = Math.max(0, now - s.stamStart);
  const recovered = Math.floor(elapsed / STAM_INTERVAL);
  const current = Math.min(s.stamMax, s.stamCurrent + recovered);
  if (current >= s.stamMax) {
    const need = Math.max(0, s.stamMax - s.stamCurrent);
    const fullAt = s.stamStart + need * STAM_INTERVAL;
    return { current: s.stamMax, fullIn: 0, fullAt: fullAt, isFull: true };
  }
  const nextIn = STAM_INTERVAL - (elapsed % STAM_INTERVAL);
  const need = s.stamMax - current;
  const fullIn = (need - 1) * STAM_INTERVAL + nextIn;
  return { current, fullIn, fullAt: now + fullIn, isFull: false };
}

function getGStamInfo(s, now){
  if (!s.stamRunning || !s.stamStart) {
    const cur = s.stamCurrent;
    return { current: cur, fullIn: null, fullAt: null, isFull: cur >= s.stamMax };
  }
  const elapsed = Math.max(0, now - s.stamStart);
  const recovered = Math.floor(elapsed / G_STAM_INTERVAL);
  const current = Math.min(s.stamMax, s.stamCurrent + recovered);
  if (current >= s.stamMax) {
    const need = Math.max(0, s.stamMax - s.stamCurrent);
    const fullAt = s.stamStart + need * G_STAM_INTERVAL;
    return { current: s.stamMax, fullIn: 0, fullAt: fullAt, isFull: true };
  }
  const nextIn = G_STAM_INTERVAL - (elapsed % G_STAM_INTERVAL);
  const need = s.stamMax - current;
  const fullIn = (need - 1) * G_STAM_INTERVAL + nextIn;
  return { current, fullIn, fullAt: now + fullIn, isFull: false };
}

function getSLTimerInfo(timer, max, interval, now){
  if (!timer.running || !timer.start) {
    const current = timer.current;
    return { current, nextIn: null, fullIn: null, fullAt: null, isFull: current >= max };
  }
  const elapsed = Math.max(0, now - timer.start);
  const recovered = Math.floor(elapsed / interval);
  const current = Math.min(max, timer.current + recovered);
  if (current >= max) {
    const need = Math.max(0, max - timer.current);
    const fullAt = timer.start + need * interval;
    return { current: max, nextIn: 0, fullIn: 0, fullAt, isFull: true };
  }
  const nextIn = interval - (elapsed % interval);
  const need = max - current;
  const fullIn = (need - 1) * interval + nextIn;
  return { current, nextIn, fullIn, fullAt: now + fullIn, isFull: false };
}

function getIdleInfo(s, now){
  if (!s.idleRunning || !s.idleStart) return { display: '—:—', meta: '未開始', isFull: false, remainingMs: null };
  const cap = s.idleCapMs || IDLE_DEFAULT_CAP_MS;
  const elapsed = Math.max(0, now - s.idleStart);
  const remaining = Math.max(0, cap - elapsed);
  const isFull = remaining <= 0;
  const fullAt = s.idleStart + cap;
  return {
    display: isFull ? 'MAX' : formatTime(remaining),
    meta: isFull ? formatClock(fullAt) + ' 到達' : formatClock(fullAt) + ' 満タン',
    clockTxt: formatClock(fullAt),
    suffix: isFull ? ' 到達' : ' 満タン',
    isFull,
    remainingMs: remaining
  };
}

function stamRemainderAfter40s(current){

function beginStamReference(i){

  if (!r) return;
  clearStamEdit();
  const live = getLiveStamCurrent(i);
  stamEdit = { index: i, value: stamRemainderAfter40s(live), phase: DOT_EDIT_PHASE.REFERENCE };

// スタミナタイマー領域の長押しで、任意値を空欄から直接入力する。
function beginStamManualInput(i){
  const r = refs[i];
  if (!r || !r.directCurEl || !r.stamSub) return;
  if (Object.keys(armedIdle).length > 0) {
    disarmAllIdle();
    return;
  }
  let edit = stamEdit;
  if (!edit || edit.index !== i) {
    clearStamEdit();
    const live = getLiveStamCurrent(i);
    edit = { index: i, value: stamRemainderAfter40s(live), phase: DOT_EDIT_PHASE.MANUAL, manualOnly: true };
    stamEdit = edit;
    if (r.card) r.card.classList.add('stam-preview');
  } else {
    edit.phase = DOT_EDIT_PHASE.MANUAL;
    edit.manualOnly = true;
  }
  const input = r.directCurEl;
  input.value = '';
  r.stamSub.classList.add('stam-manual-editing');
  syncIdleConfirmBackdrop();
  input.focus({ preventScroll: true });
}

function commitStamEdit(rawValue){
  if (!stamEdit) return;
  const { index: i, value, manualOnly } = stamEdit;
  const s = state.slots[i];
  const raw = rawValue == null ? '' : String(rawValue).trim();
  // 長押しから開いた手入力を空欄のまま閉じた場合は、値を変えずに取り消す。
  if (raw === '' && manualOnly) {
    clearStamEdit();
    syncIdleConfirmBackdrop();
    render();
    return;
  }
  let next = value;
  if (raw !== '') next = clampInt(raw, 0, s.stamMax, next);
  s.stamCurrent = clampInt(next, 0, s.stamMax, 0);
  s.stamStart = Date.now();
  s.stamRunning = true;
  clearStamEdit();
  saveState();
  syncIdleConfirmBackdrop();
  render();
  startTicking();
}

// 画面外タップ時は、1回目の参考表示なら取消、手入力なら確定する。
function resolveStamEditFromOutside(){
  if (!stamEdit) return;
  if (stamEdit.phase === DOT_EDIT_PHASE.REFERENCE) {
    clearStamEdit();
    render();
    syncIdleConfirmBackdrop();
    return;
  }
  commitStamEdit();
}

function getSLConfig(type){
  return type === 'orb'
    ? { timer: state.sl.orb, max: SL_ORB_MAX, interval: SL_ORB_INTERVAL }
    : { timer: state.sl.stamina, max: SL_STAM_MAX, interval: SL_STAM_INTERVAL };
}

function normalizeSLTimer(type, now){
  const cfg = getSLConfig(type);
  const timer = cfg.timer;
  if (!timer.running || !timer.start) return getSLTimerInfo(timer, cfg.max, cfg.interval, now);
  const elapsed = Math.max(0, now - timer.start);
  const recovered = Math.floor(elapsed / cfg.interval);
  if (recovered > 0) {
    timer.current = Math.min(cfg.max, timer.current + recovered);
    timer.start += recovered * cfg.interval;
  }
  if (timer.current >= cfg.max) {
    timer.current = cfg.max;
    timer.running = false;
    timer.start = null;
  }
  return getSLTimerInfo(timer, cfg.max, cfg.interval, now);
}

function formatSLFullRecoveryInput(ms){
  const totalMinutes = Math.max(0, Math.floor(ms / 60000));
  return Math.floor(totalMinutes / 60) + ':' + String(totalMinutes % 60).padStart(2, '0');
}

function parseSLFullRecoveryInput(value){
  const raw = String(value || '').trim().replace(/：/g, ':');
  let hours, minutes;
  if (raw.includes(':')) {
    const parts = raw.split(':');
    // H:MMのみを許容し、秒を含むH:MM:SSは受け付けない。
    if (parts.length !== 2 || parts.some(p => !/^\d+$/.test(p))) return null;
    hours = Number(parts[0]);
    minutes = Number(parts[1]);
  } else if (/^\d+$/.test(raw)) {
    // 数字のみは1〜2桁を分、3桁以上をHMM/HHMMとして読む。
    // 入力欄側で数字を4桁に打ち止めるため、ここでは重複した桁数拒否を持たない。
    // 例: 42 → 42分、342 → 3時間42分、1800 → 18時間00分。
    if (raw.length <= 2) {
      hours = 0;
      minutes = Number(raw);
    } else {
      hours = Number(raw.slice(0, -2));
      minutes = Number(raw.slice(-2));
    }
  } else {
    return null;
  }
  if (!Number.isInteger(hours) || !Number.isInteger(minutes) || hours < 0 || minutes < 0 || minutes > 59) return null;
  const ms = (hours * 3600 + minutes * 60) * 1000;
  if (ms < 0 || ms > SL_ORB_MAX * SL_ORB_INTERVAL) return null;
  return ms;
}

  const cfg = getSLConfig(type);
  const r = slRefs[type];
  const raw = r && r.input ? String(r.input.value || '').trim() : '';
  const now = Date.now();
  let changed = false;
  if (type === 'stamina') {
    const value = clampInt(raw, 0, cfg.max, null);
    if (value !== null) {
      cfg.timer.current = value;
      cfg.timer.running = value < cfg.max;
      cfg.timer.start = cfg.timer.running ? now : null;
      changed = true;
    }
  } else {
    const fullIn = parseSLFullRecoveryInput(raw);
    if (fullIn !== null) {
      const missing = fullIn === 0 ? 0 : Math.ceil(fullIn / cfg.interval);
      const current = cfg.max - missing;
      const nextIn = fullIn === 0 ? 0 : fullIn - (missing - 1) * cfg.interval;
      cfg.timer.current = current;
      if (current >= cfg.max) {
        cfg.timer.running = false;
        cfg.timer.start = null;
      } else {
        cfg.timer.running = true;
        cfg.timer.start = now - (cfg.interval - nextIn);
      }
      changed = true;
    }
  }
  slClearEdit();
  if (changed) saveState();
  renderSL();
  if (changed) startTicking();
}

  if (!slEdit) return;

function setupSLDelegatedEvents(){
  const wrap = document.getElementById('slwrap');
  if (!wrap || wrap.dataset.delegated) return;
  wrap.dataset.delegated = '1';
  wrap.addEventListener('click', (ev) => {
    const target = ev.target;
    if (target.closest && target.closest('input')) return;
    const card = target.closest && target.closest('.slcard');
    if (!card) return;
    const type = card.dataset.sltype;
    if (slEdit && slEdit.type === type && slEdit.mode === 'armed') { slBeginEdit(type); return; }
    if (slEdit) return;
    slArm(type);
  });
  // 数字を4桁で打ち止めにする。H:MMのコロンは数字数に含めない。
  // キー入力と貼り付けの双方で同じ制限を適用し、5桁・6桁の確定時拒否を不要にする。
  wrap.addEventListener('input', (ev) => {
    const input = ev.target;
    if (!input || input.id !== 'sl-orb-full-input') return;
    const raw = String(input.value || '');
    let digits = 0;
    let next = '';
    for (const ch of raw) {
      if (/^\d$/.test(ch)) {
        if (digits < 4) { next += ch; digits += 1; }
      } else if (ch === ':' && !next.includes(':')) {
        next += ch;
      }
    }
    if (next !== raw) {
      input.value = next;
      input.setSelectionRange(next.length, next.length);
    }
  });
  wrap.addEventListener('focusout', (ev) => {
    const input = ev.target;
    if (!input || !input.id || (input.id !== 'sl-stamina-current-input' && input.id !== 'sl-orb-full-input')) return;
    slCommit();
  });
  wrap.addEventListener('keydown', (ev) => {
    const input = ev.target;
    if (!input || !input.id || (input.id !== 'sl-stamina-current-input' && input.id !== 'sl-orb-full-input')) return;
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); input.value = ''; input.blur(); }
  });
  document.addEventListener('click', (ev) => {
    if (!slEdit) return;
    if (ev.target && ev.target.closest && ev.target.closest('.slcard')) return;
    slCommitOutside();
  });
}

    disarmAllIdle();

  beginStamReference(i);

function formatAbyssTabMinute(remainingMs){
  if (remainingMs == null) return '';
  if (remainingMs <= 0) return 'MAX';
  const totalMinutes = Math.max(1, Math.ceil(remainingMs / 60000));
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return hours + ':' + String(minutes).padStart(2, '0');
}

function gClearEdit(){

function gBeginEdit(i, mode){
  gClearEdit();
  const field = document.getElementById(mode === G_EDIT_MODE.MAX ? 'g-max-input-' + i : 'g-cur-' + i);
  const card = document.getElementById('gcard-' + i);
  const sub = document.getElementById('g-sub-' + i);
  if (!field || !card || !sub) return;
  gEdit = { index: i, mode };
  field.value = '';
  card.classList.add('g-inline-active');
  sub.classList.add('g-inline-editing', mode === G_EDIT_MODE.MAX ? 'g-inline-max' : 'g-inline-current');
  syncIdleConfirmBackdrop();
  field.focus({ preventScroll: true });
}

function gCommit(){
  if (!gEdit || gEdit.mode === G_EDIT_MODE.ARMED) return;
  const { index: i, mode } = gEdit;
  const s = state.g.slots[i];
  const field = document.getElementById(mode === G_EDIT_MODE.MAX ? 'g-max-input-' + i : 'g-cur-' + i);
  const text = field ? String(field.value || '').trim() : '';
  if (text !== '') {
    const n = mode === G_EDIT_MODE.CURRENT
      ? clampInt(text, 0, s.stamMax, null)
      : clampInt(text, 1, 999, null);
    if (n !== null) {
      if (mode === G_EDIT_MODE.CURRENT) {
        s.stamCurrent = n;
        s.stamStart = Date.now();
        s.stamRunning = true;
      } else {
        s.stamMax = n;
        if (s.stamCurrent > s.stamMax) s.stamCurrent = s.stamMax;
      }
      saveState();
    }
  }
  gClearEdit();
  renderG();
  startTicking();
}

function setupGDelegatedEvents(){
  const wrap = document.getElementById('gwrap');
  if (!wrap || wrap.dataset.gInlineReady) return;
  wrap.dataset.gInlineReady = '1';

  wrap.addEventListener('click', (ev) => {
    const target = ev.target;
    if (target.closest && target.closest('input')) return;
    const mark = target.closest && target.closest('.gmark');
    const name = target.closest && target.closest('.gname-lp-hit');
    // チェックと名前はそれぞれ長押し専用。通常タップをカード操作へ流さない。
    if (mark || name) return;
    const card = target.closest && target.closest('.gcard');
    if (!card) return;
    const i = Number(card.dataset.idx);
    if (gEdit && gEdit.index === i && gEdit.mode === G_EDIT_MODE.ARMED) { gBeginEdit(i, G_EDIT_MODE.CURRENT); return; }
    if (gEdit) return;
    gArm(i);
  });

  wrap.addEventListener('focusout', (ev) => {
    const t = ev.target;
    if (!t || !t.id) return;
    if (t.id.indexOf('g-cur-') === 0 || t.id.indexOf('g-max-input-') === 0) gCommit();
    else if (t.classList && t.classList.contains('gname-input')) onGNameBlur(Number(t.id.split('-').pop()));
  });

  wrap.addEventListener('keydown', (ev) => {
    const t = ev.target;
    if (!t || !t.id || (t.id.indexOf('g-cur-') !== 0 && t.id.indexOf('g-max-input-') !== 0)) return;
    if (ev.key === 'Enter') { ev.preventDefault(); t.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); t.value = ''; t.blur(); }
  });

  let timer = null, sx = 0, sy = 0;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const start = (ev) => {
    const target = ev.target;
    if (!target) return;
    const mark = target.closest && target.closest('.gmark');
    const name = target.closest && target.closest('.gname-lp-hit');
    const card = target.closest && target.closest('.gcard');
    if (!mark && !name && !card) return;
    const point = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    sx = point.clientX; sy = point.clientY;
    cancel();
    timer = setTimeout(() => {
      timer = null;
      if (mark) { toggleGMark(Number(mark.dataset.idx)); return; }
      if (name) { beginGNameEdit(Number(card.dataset.idx)); return; }
      gBeginEdit(Number(card.dataset.idx), G_EDIT_MODE.MAX);
    }, 500);
  };
  const move = (ev) => {
    if (!timer) return;
    const point = ev.touches && ev.touches[0] ? ev.touches[0] : ev;
    const dx = point.clientX - sx, dy = point.clientY - sy;
    if (dx * dx + dy * dy > 144) cancel();
  };
  wrap.addEventListener('touchstart', start, { passive:true });
  wrap.addEventListener('touchmove', move, { passive:true });
  wrap.addEventListener('touchend', cancel, { passive:true });
  wrap.addEventListener('touchcancel', cancel, { passive:true });
  wrap.addEventListener('mousedown', (ev) => { if (ev.button === 0) start(ev); });
  wrap.addEventListener('mousemove', move);
  wrap.addEventListener('mouseup', cancel);

  document.addEventListener('click', (ev) => {
    if (!gEdit) return;
    if (ev.target && ev.target.closest && ev.target.closest('.gcard')) return;
    gCommitOutside();
  });
}

function onRankBlur(i){

function onIdleTimerTap(i){

  const hasOtherArmedIdle = Object.keys(armedIdle).some((key) => Number(key) !== i);

function render(){
  try {
    ensureDailyDate();

    if (!refs.length) return;

    const abyssTabShortest = Object.create(null);
    const abyssTabStamUrgent = Object.create(null);
    const abyssTabIdleUrgent = Object.create(null);
    for (let i = 0; i < N; i++) {
      const s = state.slots[i];
      const r = refs[i];

      const stam = getStamInfo(s, now);

      const group = groupClass(i);
      // 2時間未満に入った後は、MAX到達後も同じ計測サイクル中はタブの注意表示を維持する。
      const stamUrgent = s.stamRunning && stam.fullAt != null && stam.fullAt <= now + URGENT_MS;
      if (stamUrgent) abyssTabStamUrgent[group] = true;

      if (s.stamRunning) {

          stamCurTxt = String(stam.current); stamMaxTxt = String(s.stamMax);
          stamClockTxt = ''; stamClockSuffix = '';
        } else {
          stamMain = formatTime(stam.fullIn);
          stamCls = 'tval stam' + (stamUrgent ? ' urgent' : '');
          stamCurTxt = String(stam.current); stamMaxTxt = String(s.stamMax);
          stamClockTxt = formatPlanClock(stam.fullAt); stamClockSuffix = '';
        }
      } else {
        stamMain = '—:—'; stamCls = 'tval stam';
        stamCurTxt = String(s.stamCurrent); stamMaxTxt = String(s.stamMax); stamClockTxt = ''; stamClockSuffix = '';
      }
      // 40消費後の仮値を表示中は、状態を確定せずに現在値の表示だけ差し替える。
      if (stamEdit && stamEdit.index === i) {
        stamCurTxt = String(stamEdit.value);
        if (stamEdit.phase === DOT_EDIT_PHASE.REFERENCE) {
          stamClockTxt = '長押しで確定';
          stamClockSuffix = '';
        }
      }
      // DOM更新は表示中の2枚だけに集中する。非表示カードはタブ切替時に即時追従する。
      if (renderVisibleCard) {
        setText(r.stamVal, stamMain); setClass(r.stamVal, stamCls);
        setText(r.stamSubCur, stamCurTxt);
        setText(r.stamSubMax, stamMaxTxt);
        setClockParts(r.stamSubClockTime, r.stamSubClockSuffix, stamClockTxt, stamClockSuffix);
        let idleCls = 'tval idle';
        if (idle.isFull) idleCls += ' reached';
        else if (idleAlertClass) idleCls += ' ' + idleAlertClass;
        const idleArmed = Object.prototype.hasOwnProperty.call(armedIdle, i);
        const idleMain = idle.isFull ? (idle.clockTxt ? (idle.clockTxt + ' 到達') : '到達') : idle.display;
        if (idleArmed) {
          // 受取待機中も残りタイマーを維持し、色と操作案内だけで受取待機を示す。
          setText(r.idleVal, idleMain);
          setClockParts(r.idleSubClockTime, r.idleSubClockSuffix, '', '長押しで受取');
        } else {
          setText(r.idleVal, idleMain);
          if (idle.isFull) {
            setClockParts(r.idleSubClockTime, r.idleSubClockSuffix, '', '');
          } else if (idle.clockTxt) {
            setClockParts(r.idleSubClockTime, r.idleSubClockSuffix, idle.clockTxt, '');
          } else {
            setClockParts(r.idleSubClockTime, r.idleSubClockSuffix, '', idle.meta);
          }

    }
    const minuteKey = String(Math.floor(now / 60000));
    const updateInactiveTabs = forceAbyssTabRefresh || minuteKey !== abyssTabMinuteKey;
    renderAbyssTabIdle(abyssTabShortest, abyssTabStamUrgent, abyssTabIdleUrgent, updateInactiveTabs);
    if (updateInactiveTabs) {
      abyssTabMinuteKey = minuteKey;
      forceAbyssTabRefresh = false;
    }
  } catch (e) { console.warn(e); }
  const gameMinuteKeyNow = String(Math.floor(Date.now() / 60000));
  const updateActiveGameTab = forceGameTabRefresh || gameMinuteKeyNow !== gameTabMinuteKey;
  if (updateActiveGameTab) {
    if (activeGameTab === 'g') renderG();
    else renderSL();
    gameTabMinuteKey = gameMinuteKeyNow;
    forceGameTabRefresh = false;

function renderG(){

    for (let i = 0; i < GN; i++) {

function needsTicking(){
  const now = Date.now();
  for (let i = 0; i < N; i++) {
    const s = state.slots[i];
    if (s.stamRunning && !getStamInfo(s, now).isFull) return true;
    if (s.idleRunning && !getIdleInfo(s, now).isFull) return true;
  }
  for (let i = 0; i < GN; i++) {
    const s = state.g.slots[i];
    if (s.stamRunning && !getGStamInfo(s, now).isFull) return true;
  }
  if (state.sl.stamina.running && !getSLTimerInfo(state.sl.stamina, SL_STAM_MAX, SL_STAM_INTERVAL, now).isFull) return true;
  if (state.sl.orb.running && !getSLTimerInfo(state.sl.orb, SL_ORB_MAX, SL_ORB_INTERVAL, now).isFull) return true;
  return false;
}

// 1回の描画完了後に次回だけを予約する。重複したループは世代番号で無効化する。
function needsSecondPrecision(){
  const now = Date.now();
  for (let i = 0; i < N; i++) {
    if (groupClass(i) !== activeAbyssGroup) continue;
    const s = state.slots[i];
    if (s.stamRunning && !getStamInfo(s, now).isFull) return true;
    if (s.idleRunning && !getIdleInfo(s, now).isFull) return true;
  }
  return false;
}
function scheduleNextTick(generation){
  if (generation !== tickGeneration || !needsTicking()) return;
  const unitMs = needsSecondPrecision() ? 1000 : 60000;
  const delay = Math.max(80, unitMs - (Date.now() % unitMs));
  tickId = setTimeout(() => {
    tickId = null;
    if (generation !== tickGeneration) return;
    if (!needsTicking()) { stopTicking(); return; }
    // 個別ゲームの描画例外が起きても、次回予約を失わないようにする。
    try { render(); } catch (e) { console.warn(e); }
    if (generation === tickGeneration && needsTicking()) scheduleNextTick(generation);
  }, delay);
}
function startTicking(forceRestart = false){
  if (!needsTicking()) {
    stopTicking();
    return;
  }
  // 復帰・ユーザー操作では古い予約を無効化し、新しい世代の単一ループへ即時接続する。
  if (forceRestart) {
    tickGeneration += 1;
    if (tickId) clearTimeout(tickId);
    tickId = null;
  }
  if (!tickId) scheduleNextTick(tickGeneration);
}
function stopTicking(){
  tickGeneration += 1;
  if (tickId) { clearTimeout(tickId); tickId = null; }
}
// 編集の開閉・タブ切替・確定待機への移行後に、次フレームで単一ループを再接続する。
function scheduleInteractionTickRecovery(){
  if (interactionTickRecoveryFrame) return;
  interactionTickRecoveryFrame = requestAnimationFrame(() => {
    interactionTickRecoveryFrame = 0;
    if (document.hidden || !needsTicking()) return;
    startTicking(true);
  });
}

function setupDelegatedEvents(){
  const grid = document.getElementById('grid');
  if (!grid || grid.dataset.delegated) return;
  grid.dataset.delegated = '1';

  const markManualStamTap = (ev) => {
    const target = ev.target;
    // カード内のどこを押しても、手入力を閉じるためのタップとして扱う。
    const card = target && target.closest && target.closest('.abyss-stam-card');
    const i = card ? Number(card.dataset.idx) : NaN;
    if (stamEdit && stamEdit.index === i && stamEdit.phase === DOT_EDIT_PHASE.MANUAL && document.activeElement === refs[i].directCurEl) {
      pendingManualStamTap = i;
    } else if (pendingManualStamTap >= 0) {
      pendingManualStamTap = -1;
    }
  };
  grid.addEventListener('touchstart', markManualStamTap, { passive: true });
  grid.addEventListener('mousedown', (ev) => { if (ev.button === 0) markManualStamTap(ev); });

  grid.addEventListener('click', (ev) => {
    const t = ev.target;
    const actionCard = t.closest && t.closest('[data-idx]');
    const actionIndex = actionCard ? Number(actionCard.dataset.idx) : NaN;
    if (pendingLongPressClick) {
      const sameCard = Number.isFinite(actionIndex) && actionIndex === pendingLongPressClick.index;
      pendingLongPressClick = null;
      if (sameCard) return;
    }
    const idleBlock = t.closest && t.closest('[data-idle-receive]');
    if (idleBlock) {
      const cardEl = idleBlock.closest('.card');
      const idx = cardEl ? Number(cardEl.dataset.idx) : NaN;
      if (Number.isFinite(idx)) {
        // 放置報酬を押したら、開いているスタミナ編集を静かに閉じて受取操作へ移る。
        closeAbyssEditForIdle();
        onIdleTimerTap(idx);
      }
      return;
    }
    const nameHit = t.closest && t.closest('.name-lp-hit');
    const rankHit = t.closest && t.closest('.rank-lp-hit');
    if (nameHit || rankHit) {
      // 名前・ランクは長押し専用。通常タップはカード操作へ流さない。
      return;
    }
    const el = t.closest('[data-action]');
    if (el) {
      const action = el.dataset.action;
      const i = Number(el.dataset.idx);
      if (action === 'card') onCardClick(i, ev);
      else if (action === 'mark') { /* 長押し判定で制御 */ }
      return;
    }
    if (t.closest && (t.closest('input') || t.closest('.edit-panel'))) return;
  });

  grid.addEventListener('focusout', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('stam-direct-cur-') === 0) commitStamEdit(t.value);
    else if (t.classList && t.classList.contains('name-input')) onNameBlur(Number(t.id.split('-').pop()));
    else if (t.classList && t.classList.contains('rank-input')) onRankBlur(Number(t.id.split('-').pop()));
  });

  grid.addEventListener('keydown', (ev) => {
    const t = ev.target;
    if (!t || !t.id || t.id.indexOf('stam-direct-cur-') !== 0) return;
    if (ev.key === 'Enter') {
      ev.preventDefault();
      t.blur();
    } else if (ev.key === 'Escape') {
      ev.preventDefault();
      t.value = '';
      t.blur();
    }
  });

  grid.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.classList && t.classList.contains('name-input')) {
      const idx = Number(t.id.split('-').pop());
      state.slots[idx].label = t.value;
      clearTimeout(labelSaveTimer);
      labelSaveTimer = setTimeout(saveState, 300);
    }
  });

  // 仮値中に編集カード以外を押したら、その仮値を確定または解除する。
  document.addEventListener('click', (ev) => {
    if (!stamEdit) return;
    const t = ev.target;
    const isInsideEditedCard = t && t.closest && t.closest('#card-' + stamEdit.index);
    if (isInsideEditedCard || (t && t.closest && t.closest('.tblock-stam'))) return;
    pendingManualStamTap = -1;
    resolveStamEditFromOutside();
  });

  let lpTimer = null;
  let lpX = 0, lpY = 0;
  const LP_MS = 500;
  const LP_MOVE2 = 12 * 12;
  const clearLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
  const lpStart = (ev) => {
    const el = ev.target;
    if (!el) return;
    // 直前の長押しにclickが続かなかった場合だけをここで失効させる。別操作は止めない。
    if (pendingLongPressClick) pendingLongPressClick = null;
    const idleBlock = el.closest && el.closest('[data-idle-receive]');
    const nameHit = el.closest && el.closest('.name-lp-hit');
    const rankHit = el.closest && el.closest('.rank-lp-hit');
    const stamBlock = el.closest && el.closest('.tblock-stam');
    const stamCard = (stamBlock && stamBlock.closest ? stamBlock.closest('.abyss-stam-card') : null) || (el.closest && el.closest('.abyss-stam-card'));
    let mode = null;
    if (nameHit) mode = 'name';
    else if (rankHit) mode = 'rank';
    else if (idleBlock) {
      const idleIndex = Number(idleBlock.dataset.idx);
      // 確認待ちの放置報酬は再タップ確定。長押し後のclickだけを抑止して何もしない。
      mode = Object.prototype.hasOwnProperty.call(armedIdle, idleIndex) ? 'idle-armed' : 'idle-mark';
    } else if (stamCard && !(el.closest && el.closest('input'))) {
      const stamIndex = stamCard ? Number(stamCard.dataset.idx) : NaN;
      const isReference = stamEdit && stamEdit.index === stamIndex && stamEdit.phase === DOT_EDIT_PHASE.REFERENCE;
      // 確認待ちは長押しで確定、通常時は従来どおり現在値の手入力を開く。
      mode = isReference ? 'stam-confirm' : 'stam-manual';
    } else return;
    const idEl = idleBlock || nameHit || rankHit || stamCard;
    const cardEl = idEl && idEl.closest ? idEl.closest('.card') : null;
    const i = Number((idEl.dataset && idEl.dataset.idx != null) ? idEl.dataset.idx : (cardEl && cardEl.dataset ? cardEl.dataset.idx : NaN));
    if (!Number.isFinite(i)) return;
    clearLp();
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    lpX = pt.clientX; lpY = pt.clientY;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (mode === 'idle-armed') {
        // 受取確認中の長押しは受取を確定し、直後のclickを抑止する。
        commitIdleReceive(i);
        pendingLongPressClick = { kind: 'idle-armed', index: i };
      } else if (mode === 'idle-mark') {
        toggleMissionMark(i);
        pendingLongPressClick = { kind: 'idle-mark', index: i };
      } else if (mode === 'name') beginNameEdit(i);
      else if (mode === 'rank') beginRankEdit(i);
      else if (mode === 'stam-confirm') {
        // 40基準の確認待ちは長押しで確定し、直後のclickを抑止する。
        commitStamEdit();
        pendingLongPressClick = { kind: 'stam-confirm', index: i };
      } else beginStamManualInput(i);
    }, LP_MS);
  };
  const lpMove = (ev) => {
    if (!lpTimer) return;
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const dx = pt.clientX - lpX, dy = pt.clientY - lpY;
    if (dx * dx + dy * dy > LP_MOVE2) clearLp();
  };
  grid.addEventListener('touchstart', lpStart, { passive: true });
  grid.addEventListener('touchmove', lpMove, { passive: true });
  grid.addEventListener('touchend', clearLp, { passive: true });
  grid.addEventListener('touchcancel', clearLp, { passive: true });
  grid.addEventListener('mouseleave', clearLp, { passive: true });
  grid.addEventListener('mousedown', (ev) => { if (ev.button === 0) lpStart(ev); });
  grid.addEventListener('mousemove', lpMove);
  grid.addEventListener('mouseup', clearLp);
}

document.addEventListener('contextmenu', (ev) => {
  // 入力欄を含む全画面で、スマホの長押しメニューを表示しない。
  ev.preventDefault();
}, { capture: true });

document.addEventListener('selectstart', (ev) => {
  // スタミナ、名前、ランクの長押し時に表示文字をハイライトさせない。
  const el = ev.target;
  if (el && el.closest && el.closest('.rank-lp-hit, .name-lp-hit, .tblock-stam')) ev.preventDefault();
}, { capture: true });


// 初期表示は同期的に完了させ、起動安定化は描画後に1回だけ実行する。
// これにより、初期画面を遅らせずに復帰直後の表示・タイマー・PWA登録を整える。
let startupStabilized = false;
function scheduleStartupStabilization(){
  const stabilize = () => {
    if (startupStabilized || document.hidden) return;
    startupStabilized = true;
    requestAnimationFrame(() => {
      if (document.hidden) return;
      // setText/setWidthの差分更新だけなので、不要な点滅を起こさず時刻表示を再同期する。
      render();
      startTicking();
      scheduleResetCheck();
      scheduleServiceWorkerRegistration();
    });
  };
  if ('requestIdleCallback' in window) requestIdleCallback(stabilize, { timeout: 600 });
  else setTimeout(stabilize, 50);
}

let resumeDebounceTimer = null;
let lastResumeAt = 0;
const RESUME_FORCE_COALESCE_MS = 180;
const RESUME_NORMAL_DEBOUNCE_MS = 320;

function resumeTicking(force){
  if (document.hidden) return;
  const now = Date.now();
  // visibilitychange・resume・pageshowが連続しても、最初の即時描画だけを採用する。
  const minGap = force ? RESUME_FORCE_COALESCE_MS : RESUME_NORMAL_DEBOUNCE_MS;
  if (now - lastResumeAt < minGap) return;
  lastResumeAt = now;

  if (resumeDebounceTimer) {
    clearTimeout(resumeDebounceTimer);
    resumeDebounceTimer = null;
  }

  const restart = () => {
    if (document.hidden) return;
    render();
    // 復帰時は、見かけ上のIDが残っていても実体を再生成して連続更新を保証する。
    startTicking(true);
    scheduleResetCheck();
  };

  // タスク復帰は即時同期する。通常の重複イベントだけ短くまとめる。
  if (force) {
    restart();
    return;
  }
  resumeDebounceTimer = setTimeout(() => {
    resumeDebounceTimer = null;
    restart();
  }, 48);
}

function scheduleResetCheck(){
  if (resetCheckTimer) clearTimeout(resetCheckTimer);

  const now = new Date();
  const next = new Date(now);
  next.setHours(1, 0, 1, 0);
  if (next <= now) next.setDate(next.getDate() + 1);

  const nextGameReset = new Date(now);
  nextGameReset.setHours(5, 0, 1, 0);
  if (nextGameReset <= now) nextGameReset.setDate(nextGameReset.getDate() + 1);
  if (nextGameReset < next) next.setTime(nextGameReset.getTime());

  resetCheckTimer = setTimeout(() => {
    resetCheckTimer = null;
    if (!document.hidden) {
      render();
      startTicking();
    }
    scheduleResetCheck();
  }, Math.max(1000, next.getTime() - now.getTime()));
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // 次の復帰を直前イベントの抑止対象にしない。
    lastResumeAt = 0;
    if (Date.now() < startupGraceUntil) return;
    // Android Chrome／PWAシェルでは復帰通知が欠ける場合があるため、
    // 進行中の描画ループはここで止めない。非表示中はブラウザ側が自然に抑制する。
    if (resumeDebounceTimer) {
      clearTimeout(resumeDebounceTimer);
      resumeDebounceTimer = null;
    }
  } else {
    // Androidのタスク復帰では最初の可視化を必ず同期する。
    resumeTicking(true);
  }
});

// 一部のWebView・PWAシェルが送る復帰通知も同じ経路で扱う。
document.addEventListener('resume', () => resumeTicking(true));

window.addEventListener('pageshow', () => resumeTicking(true));
// visibilitychangeが届かないPWAシェルでも、フォーカス復帰を保険として同期入口にする。
window.addEventListener('focus', () => resumeTicking(true));

function scheduleServiceWorkerRegistration(){
  if (swRegistrationScheduled) return;
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

  swRegistrationScheduled = true;
  const register = () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
  };

  // Service Workerの取得・インストールを初期描画と競合させない。
  if ('requestIdleCallback' in window) requestIdleCallback(register, { timeout: 8000 });
  else setTimeout(register, 2500);
}
