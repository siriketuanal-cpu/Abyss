<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深淵</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#000000; --bg-panel:#000000; --bg-card:#000000; --bg-inset:#111111;
  --line:#262f45; --ink:#e9e7e0; --ink-dim:#8b93a7;
  --amber:#ffab5c; --violet:#9c86ff; --ok:#8fd6a8; --danger:#ff6b6b;
  --stam-full-c:#ff3b3b;
  --g0:#7c5fd6; --g1:#5b9dff; --g2:#8fa3c4;
  --stam-cur-c:#6fe8ff; --idle-c:#ffd166;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overscroll-behavior:none;background-color:#000;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  min-height:100vh;
  padding:12px 10px 32px;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
input,textarea{
  -webkit-user-select:text;user-select:text;
  -webkit-touch-callout:none!important;
}
.wrap{max-width:820px;margin:0 auto;}
.bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--bg-panel);border:1px solid #3d4a62;border-radius:12px;
  padding:6px 12px;margin-bottom:8px;font-size:12px;color:var(--ink-dim);
  min-height:40px;
}
.bar-left{display:flex;align-items:center;gap:8px;justify-self:start;}
.bar-note{font-size:10px;color:var(--ink-dim);display:none;}
.daily-val{
  color:#9fd1f5;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px;
  justify-self:center;white-space:nowrap;line-height:1;
  height:28px;display:flex;align-items:center;
}
.daily-progress{
  justify-self:end;display:flex;align-items:center;justify-content:flex-end;gap:3px;
  min-height:28px;height:28px;min-width:90px;
}
.pdot{
  width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:transparent;
}
.pdot.d0,.pdot.d1{--dotcolor:var(--g0);}
.pdot.d2,.pdot.d3{--dotcolor:var(--g1);}
.pdot.d4,.pdot.d5{--dotcolor:var(--g2);}
.pdot.filled{background:var(--dotcolor);border-color:var(--dotcolor);color:#fff;}
.complete-badge{
  display:inline-flex;align-items:center;justify-content:center;
  height:20px;padding:0 6px;border-radius:4px;
  font-size:9px;font-weight:800;letter-spacing:.04em;
  line-height:1;white-space:nowrap;
  color:#1a1408;
  background:#ffc94a;
  border:1px solid #e0a82e;
}
/* テスト用: ドットアビスをグループカラーごとに切り替える。 */
.abyss-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
.abyss-tab{
  min-height:32px;border:1px solid #3d4a62;border-radius:8px;background:#0c111c;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;gap:5px;
  font:700 10.5px/1 inherit;letter-spacing:.02em;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.abyss-tab-name{font-size:12px;font-weight:800;white-space:nowrap;}
/* 時間はグループ色と分け、どのタブでも同じ淡いアンバーで読ませる。 */
.abyss-tab-idle{color:#ffd98f;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;opacity:1;text-shadow:0 0 4px rgba(255,217,143,.16);}
.abyss-tab.g0{color:#b9aaff;}.abyss-tab.g1{color:#a6ccff;}.abyss-tab.g2{color:#c2ccdf;}
.abyss-tab.active.g0{border-color:var(--g0);background:#1a1530;box-shadow:0 0 0 1px rgba(124,95,214,.25);}
.abyss-tab.active.g1{border-color:var(--g1);background:#10233c;box-shadow:0 0 0 1px rgba(91,157,255,.25);}
.abyss-tab.active.g2{border-color:var(--g2);background:#1c2330;box-shadow:0 0 0 1px rgba(143,163,196,.25);}
.grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:6px;}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr;}}
.grid[data-group] .card-row{display:none;margin-top:0!important;padding-top:0!important;border-top:none!important;}
.grid[data-group="g0"] .card-row[data-group="g0"],
.grid[data-group="g1"] .card-row[data-group="g1"],
.grid[data-group="g2"] .card-row[data-group="g2"]{display:flex;}
.card-row{display:flex;align-items:center;gap:11px;}
.card-row:nth-child(3),.card-row:nth-child(5){
  margin-top:2px;padding-top:8px;border-top:1px solid #5a6a88;
}
.card{
  background:var(--bg-card);border:1px solid #2c2c2c;border-radius:12px;padding:7px 11px;
  cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  flex:1 1 auto;min-width:0;
  transition:border-color .12s ease;
  contain:layout style;
}
.card.g0{border:1.5px solid var(--g0);}
.card.g1{border:1.5px solid var(--g1);}
.card.g2{border:1.5px solid var(--g2);}
.card.open{z-index:30;}

.card.g0.open{border-color:var(--g0);box-shadow:0 0 0 1.5px var(--g0);}
.card.g1.open{border-color:var(--g1);box-shadow:0 0 0 1.5px var(--g1);}
.card.g2.open{border-color:var(--g2);box-shadow:0 0 0 1.5px var(--g2);}
.row-top{display:flex;align-items:center;gap:7px;margin-bottom:3px;}
.rank-disp,.rank-input{
  margin-left:auto;flex-shrink:0;width:4.2em;max-width:38%;
  color:#f0a07a;font-size:12px;font-weight:800;
  font-family:inherit;line-height:1.2;text-align:right;
  font-variant-numeric:tabular-nums;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
  .rank-disp{
  display:inline-block;border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;-webkit-user-drag:none;touch-action:manipulation;
}
.rank-disp::selection{background:transparent;color:inherit;}
.rank-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed #f0a07a;
  outline:none;caret-color:#f0a07a;text-align:right;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.rank-input.editing{display:inline-block;}

.name-disp,.name-input{
  width:6em;max-width:38%;min-width:3.5em;
  color:var(--ink);font-size:13px;font-weight:700;
  font-family:inherit;line-height:1.2;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.name-disp{
  display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;touch-action:manipulation;
}
.name-disp.empty{color:var(--ink-dim);font-weight:500;}
.name-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed var(--violet);
  outline:none;caret-color:var(--ink);max-width:55%;width:8em;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.name-input.editing{display:inline-block;}
.name-input:focus{outline:none;}

.daily-mark{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:transparent;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;opacity:.4;outline:none;user-select:none;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  position:relative;z-index:26;transition:opacity .15s ease;
  appearance:none;-webkit-appearance:none;font-family:inherit;padding:0;
  margin-top:-2px;
}
.daily-mark.show{opacity:.85;font-weight:900;background:transparent;-webkit-font-smoothing:antialiased;}
.daily-mark.g0.show{border-color:var(--g0);color:var(--g0);}
.daily-mark.g1.show{border-color:var(--g1);color:var(--g1);}
.daily-mark.g2.show{border-color:var(--g2);color:var(--g2);}
.daily-mark.armed{animation:markShake .3s ease;}
.daily-mark.disabled-by-edit{pointer-events:none;opacity:.25;}

.mark-col{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:12px;flex-shrink:0;padding-top:0;
}

.weekly-mark{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:900;color:#3d485e;cursor:pointer;
  border:none;background:transparent;opacity:.5;outline:none;user-select:none;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  appearance:none;-webkit-appearance:none;font-family:inherit;padding:0;
  position:relative;z-index:26;transition:opacity .15s ease, color .15s ease, transform .15s ease;
}
.weekly-mark.show{
  opacity:1;color:#ffcc33;transform:scale(1.15);
  text-shadow:0 0 6px rgba(255,204,51,0.5);
}
.weekly-mark.disabled-by-edit{pointer-events:none;opacity:.25;}

@keyframes markShake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}
.timers-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;}
.tblock{min-width:0;}
.ttag{font-size:9px;font-weight:700;letter-spacing:.04em;}
.ttag.stam{color:var(--ok);}
.ttag.idle{color:var(--idle-c);}
.tval{
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  line-height:1.05;white-space:nowrap;overflow:hidden;min-width:7.2ch;display:inline-block;letter-spacing:.01em;
}
.tval.stam{color:var(--ok);}
.tval.idle{color:var(--idle-c);}
.tval.full{color:var(--stam-full-c)!important;}
.tval.urgent{color:var(--stam-full-c)!important;}
.tsub{font-size:10px;color:var(--ink);height:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.tsub-cur{font-weight:700;color:#ffb35e;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
.tsub-sep{font-weight:600;color:var(--ink-dim);margin:0 1px;}
.tsub-max{font-weight:700;color:var(--stam-cur-c);font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
.tsub-clock{margin-left:4px;font-weight:600;}
.idle-clock{color:#c9b8ff;font-weight:600;}
.idle-meta{color:#c9b8ff;font-weight:600;}
.pbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px;}
.pbar-fill{height:100%;border-radius:2px;transition:width .3s linear;}
.pbar-fill.stam{background:var(--ok);}
.pbar-fill.idle{background:var(--idle-c);}
.pbar-fill.stam.full{background:var(--stam-full-c)!important;}
.pbar-fill.idle.full{background:var(--stam-full-c)!important;}
.pbar-fill.idle.urgent{background:var(--stam-full-c)!important;}
.edit-panel{
  display:none;position:absolute;top:calc(100% + 6px);background:#000;
  border:1px solid var(--violet);border-radius:12px;padding:10px 12px;
  z-index:31;
  contain:layout style;
  box-sizing:border-box;
  width:calc(50% - 4px);
  left:0;right:auto;
}
.card.g0 .edit-panel{border-color:var(--g0);}
.card.g1 .edit-panel{border-color:var(--g1);}
.card.g2 .edit-panel{border-color:var(--g2);}
.card.open .edit-panel{display:block;}
.edit-panel-split{display:flex;align-items:center;gap:6px;width:100%;}
.edit-side{display:flex;align-items:center;width:100%;min-width:0;}
.edit-side-divider{display:none;}
.edit-side-stam{
  justify-content:flex-start;
  position:relative;
  gap:0;
  min-height:34px;
}
.edit-side-stam input[type="number"]{
  width:42px;
  flex:0 0 42px;
  background:var(--bg-inset);
  border:1px solid #4a5a78;
  border-radius:6px;
  color:var(--ink);
  padding:4px 5px;
  font-size:11.5px;
  font-family:inherit;
  text-align:center;
  box-sizing:border-box;
}
.edit-side-stam .ebtn.stam{
  position:absolute;
  left:58%;
  transform:translateX(-50%);
  padding:6px 12px;
  font-size:11.5px;
  border-radius:8px;
  white-space:nowrap;
}
.edit-side-idle{justify-content:center;}
.edit-side-idle .ebtn.idle{
  padding:6px 12px;
  font-size:11.5px;
  border-radius:8px;
  white-space:nowrap;
}
.card.open.mode-stam .edit-panel{
  left:0;right:auto;width:calc(50% - 4px);
  border-color:var(--ok);
}
.card.open.mode-idle .edit-panel{
  left:auto;right:0;width:calc(50% - 4px);
  border-color:var(--idle-c);
}
.card.open.mode-stam .edit-side-idle{display:none !important;}
.card.open.mode-idle .edit-side-stam{display:none !important;}
.row-top{position:relative;}
.row-hit{position:absolute;top:0;bottom:0;z-index:1;}
.row-hit-stam{left:0;width:50%;}
.row-hit-idle{right:0;width:50%;}
.row-top .name-disp,.row-top .name-input,
.row-top .rank-disp,.row-top .rank-input{position:relative;z-index:2;}

.backdrop{
  display:none;
  position:fixed;
  z-index:25;
  top:-30vh;
  left:0;
  right:0;
  height:160vh;
  width:100%;
  background:#000;
  opacity:.72;
  pointer-events:auto;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
.backdrop.show{display:block;}
.ebtn.idle.armed{background:linear-gradient(135deg,#ffb4b4,#ff6b6b);color:#2a0a0a;animation:armPulse .8s ease-in-out infinite;}
@keyframes armPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.edit-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.edit-row:last-child{margin-bottom:0;}
.edit-row input[type="number"]{
  width:56px;background:var(--bg-inset);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);padding:6px 7px;font-size:13px;font-family:inherit;
}
.edit-row-oneline{flex-wrap:wrap;row-gap:8px;}
.edit-row-oneline > input[type="number"]{width:52px;}
.ebtn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.03em;}
.ebtn.stam{background:linear-gradient(135deg,#8ec5ff,#5b9dff);color:#0b1220;}
.ebtn.idle{background:linear-gradient(135deg,#c4b5fd,#9c86ff);color:#1a1030;}
.ebtn-gap{flex:1;}
footer{text-align:center;color:var(--ink-dim);font-size:10.5px;margin-top:10px;display:none;}

	/* テスト用ゲームタブ */
	.game-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
	.game-tab{
	  min-height:34px;border:1px solid #3d4a62;border-radius:9px;background:#0c111c;color:var(--ink-dim);
	  font:700 11.5px/1 inherit;letter-spacing:.03em;cursor:pointer;
	  -webkit-tap-highlight-color:transparent;
	}
	.game-tab.active{border-color:#6fe8ff;background:#132b35;color:#dff9ff;box-shadow:0 0 0 1px rgba(111,232,255,.2);}
	.game-tab-panel{display:none;}
	.game-tab-panel.active{display:block;}
	.game-tab-panel .gsection,.game-tab-panel .slsection{margin-top:0;}
	
	.gsection{margin-top:14px;}
.gsection-title{
  font-size:11px;color:var(--ink-dim);font-weight:700;margin:0 0 6px 2px;
  display:flex;align-items:baseline;gap:6px;
}
.gsection-note{font-size:9.5px;font-weight:400;color:#5c6785;display:none;}
.gwrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .gcard{
  background:var(--bg-card);border:1.5px solid #3a3a3a;border-radius:12px;padding:7px 9px;
  cursor:pointer;position:relative;overflow:visible;-webkit-tap-highlight-color:transparent;
}
.gcard.open{border-color:var(--stam-cur-c);z-index:30;}
.grow-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.gname-disp,.gname-input{
  font-size:10.5px;font-weight:700;color:var(--ink);
  font-family:inherit;line-height:1.2;max-width:70%;min-width:2.5em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.gname-disp{
  display:inline-block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px dashed transparent;cursor:pointer;
  -webkit-user-select:none!important;user-select:none!important;
  -webkit-touch-callout:none!important;touch-action:manipulation;
}
.gname-disp.empty{color:var(--ink-dim);font-weight:500;}
.gname-input{
  display:none;background:transparent;border:none;border-bottom:1px dashed var(--violet);
  outline:none;caret-color:var(--ink);width:6em;max-width:75%;
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
.gname-input.editing{display:inline-block;}
.gedit-row-oneline{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;}
.gedit-row-oneline > input[type="number"]{width:42px;flex-shrink:0;text-align:center;}
.gedit-max{margin-left:auto;display:flex;align-items:center;gap:3px;flex-shrink:0;}
.gmax-btn{
  width:26px;height:26px;border:1px solid #5a6a8a;border-radius:6px;
  background:#1a2235;color:#9eb6ff;font-size:14px;font-weight:800;line-height:1;
  padding:0;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.gmax-btn:active{background:#2a3550;}
.gmax-val{
  min-width:2.2em;text-align:center;font-size:12px;font-weight:800;
  color:#9eb6ff;font-variant-numeric:tabular-nums;
}
.gval{
  font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  color:var(--ok);line-height:1.1;
}
.gval.full{color:var(--stam-full-c)!important;}
.gsub{font-size:10px;color:var(--ink);margin-top:1px;}
.gsub .gsub-cur{font-weight:700;color:#ffb35e;font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
.gsub .gsub-sep{font-weight:600;color:var(--ink-dim);margin:0 1px;}
.gsub .gsub-max{font-weight:700;color:var(--stam-cur-c);font-family:"Hiragino Sans","Hiragino Maru Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;}
.gsub .gsub-clock{color:#c9b8ff;font-weight:600;margin-left:3px;}
.gbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px;}
.gbar-fill{height:100%;border-radius:2px;background:var(--ok);transition:width .3s linear;}
.gbar-fill.full{background:var(--stam-full-c)!important;}
.gmark{
  width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;color:transparent;cursor:pointer;
  border:1.5px solid var(--line);background:transparent;opacity:.45;outline:none;user-select:none;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  appearance:none;-webkit-appearance:none;font-family:inherit;padding:0;
}
.gmark.show{opacity:1;color:#fff;border-color:var(--stam-cur-c);background:transparent;}
  .gedit{
    display:none;position:absolute;z-index:31;top:calc(100% + 6px);left:0;right:0;
    margin:0;padding:8px 9px;background:#000;border:1px solid var(--stam-cur-c);border-radius:12px;
    box-shadow:0 8px 18px rgba(0,0,0,.45);
  }
  .gcard.open .gedit{display:block;}
  .gedit-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.gedit-row label{font-size:9.5px;color:var(--ink-dim);}
.gedit-row input[type="number"]{
  width:42px;background:var(--bg-inset);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);padding:4px 5px;font-size:11.5px;font-family:inherit;text-align:center;
}
  .gedit-row .ebtn{padding:5px 8px;font-size:10.5px;}

<script>
const N = 6;
const STAM_INTERVAL = 3 * 60 * 1000;
const IDLE_DEFAULT_CAP_MS = 12 * 3600 * 1000;
const IDLE_LEAD_MS = 2 * 60 * 1000;
const URGENT_MS = 2 * 60 * 60 * 1000;
const STAM_MAX_BASE = 240;
const STAM_MAX_PER_LEVEL = 5;
const RANK_MIN = 1;
const RANK_MAX = 200;

const STORAGE_KEY = 'dotabyss:unified:v1';

const defaultSlot = () => ({
  label: '',
  rank: 1,
  stamCurrent: 0, stamMax: 240, stamStart: null, stamRunning: false,
  idleStart: null, idleCapMs: IDLE_DEFAULT_CAP_MS, idleRunning: false,
  missionDone: false,
  weeklyDone: false
});

function stamMaxFromRank(rank){
  const r = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(rank) || 1)));
  return Math.min(999, STAM_MAX_BASE + (r - 1) * STAM_MAX_PER_LEVEL);
}
function rankFromStamMax(max){
  const m = Math.max(STAM_MAX_BASE, safeNum(max, STAM_MAX_BASE));
  const r = 1 + Math.round((m - STAM_MAX_BASE) / STAM_MAX_PER_LEVEL);
  return Math.max(RANK_MIN, Math.min(RANK_MAX, r));
}

// ---- Gジェネ ----
const GN = 2;
const G_STAM_INTERVAL = 5 * 60 * 1000;
const G_RESET_HOUR = 1;
const defaultGSlot = () => ({
  label: '',
  stamCurrent: 0, stamMax: 130, stamStart: null, stamRunning: false, missionDone: false
});
let gOpenIdx = -1;
let gRefs = [];

// ---- 幻想水滸伝 STAR LEAP ----
const SL_STAM_MAX = 80;
const SL_STAM_INTERVAL = 12 * 60 * 1000;
const SL_ORB_MAX = 4;
const SL_ORB_INTERVAL = 6 * 60 * 60 * 1000;
const defaultSLTimer = () => ({ current: 0, start: null, running: false });
const defaultSLState = () => ({ stamina: defaultSLTimer(), orb: defaultSLTimer() });
let slOpenType = null;
let slRefs = {};

let state = { slots: Array.from({ length: N }, defaultSlot), dailyDate: '', weeklyWeekId: '', g: { slots: Array.from({ length: GN }, defaultGSlot), dailyDate: '' }, sl: defaultSLState() };

let openIdx = -1;
let openMode = null;
let storageOk = true;
let textEditIdx = -1;
let suppressOpenAllUntil = 0;
let refs = [];
let tickId = null;
let resetCheckTimer = null;
let swRegistrationScheduled = false;
let armedIdle = {};
let labelSaveTimer = null;
let lastProgressSig = '';
let lastDailyLabel = '';
let _lastOpenIdx = -1;

function groupClass(i){ return 'g' + (Math.floor(i / 2) % 3); }
function dayStrAt(resetHour){
  const d = new Date();
  if (d.getHours() < resetHour) d.setDate(d.getDate() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function gameDayStr(){ return dayStrAt(5); }
function formatDateJP(iso){
  if (!iso) return '—';
  const p = iso.split('-');
  if (p.length !== 3) return iso;
  return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日';
}
function safeNum(v, fb){ if (v === null || v === undefined || v === '') return fb; const n = Number(v); return Number.isFinite(n) ? n : fb; }
function formatTime(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const t = Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return m + ':' + String(s).padStart(2, '0');
}
function formatClock(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function formatFixedDuration(ms){
  ms = Math.max(0, safeNum(ms, 0));
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  return String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
}
function escapeHtml(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setText(el, text){ if (!el) return; if (el.dataset._h !== undefined) delete el.dataset._h; if (el.textContent !== text) el.textContent = text; }
function setHTML(el, html){ if (el && el.dataset._h !== html) { el.innerHTML = html; el.dataset._h = html; } }
function setClass(el, cls){ if (el && el.className !== cls) el.className = cls; }
function setWidth(el, pct){
  if (!el) return;
  const rounded = Math.round((pct || 0) * 10) / 10;
  const w = rounded + '%';
  if (el.style.width !== w) el.style.width = w;
}
function setSaveStamp(text){
  const el = document.getElementById('saveStamp');
  if (el) el.textContent = text;
}

function gameWeekId(){
  const now = new Date();
  const shifted = new Date(now.getTime() - 5 * 3600 * 1000);
  const day = shifted.getDay();
  const diffToMon = day === 0 ? -6 : 1 - day;
  const mon = new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate() + diffToMon);
  const y = mon.getFullYear();
  const m = String(mon.getMonth() + 1).padStart(2, '0');
  const d = String(mon.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + d;
}
function ensureWeeklyDate(){
  const wid = gameWeekId();
  if (state.weeklyWeekId !== wid) {
    state.weeklyWeekId = wid;
    state.slots.forEach(s => { s.weeklyDone = false; });
    for (let i = 0; i < refs.length; i++) {
      if (refs[i] && refs[i].weeklyMark) refs[i].weeklyMark.classList.remove('show');
    }
    saveState();
  }
}

function ensureDailyDate(){
  const today = gameDayStr();
  if (state.dailyDate !== today) {
    state.dailyDate = today;
    state.slots.forEach(s => { s.missionDone = false; });
    for (let i = 0; i < refs.length; i++) {
      if (refs[i] && refs[i].mark) { refs[i].mark.classList.remove('show'); refs[i].mark.setAttribute('aria-pressed', 'false'); }
    }
    lastProgressSig = '';
    saveState();
  }
  const label = formatDateJP(state.dailyDate);
  if (label !== lastDailyLabel) {
    lastDailyLabel = label;
    const el = document.getElementById('dailyDateDisplay');
    if (el) el.textContent = label;
  }
  renderDailyProgress();
}

function renderDailyProgress(){
  const el = document.getElementById('dailyProgress');
  if (!el) return;
  let sig = '', count = 0;
  for (let k = 0; k < N; k++) {
    const done = !!state.slots[k].missionDone;
    sig += done ? '1' : '0';
    if (done) count++;
  }
  if (sig === lastProgressSig) return;
  lastProgressSig = sig;
  if (count >= N) {
    el.innerHTML = '<span class="complete-badge">COMPLETE</span>';
    return;
  }
  let html = '';
  for (let k = 0; k < N; k++) {
    const done = sig[k] === '1';
    html += '<span class="pdot d' + k + (done ? ' filled' : '') + '">' + (done ? '✓' : '') + '</span>';
  }
  el.innerHTML = html;
}

function parseStoredState(){
  if (typeof localStorage === 'undefined') throw new Error('no localStorage');
  const raw = localStorage.getItem(STORAGE_KEY);
  const result = { slots: null, dailyDate: gameDayStr(), weeklyWeekId: '', g: { slots: null, dailyDate: dayStrAt(G_RESET_HOUR) }, sl: defaultSLState() };
  if (raw) {
    const parsed = JSON.parse(raw);
    if (parsed.slots && Array.isArray(parsed.slots) && parsed.slots.length === N) {
      const now = Date.now();
      result.slots = parsed.slots.map(s => {
        const o = defaultSlot();
        if (!s || typeof s !== 'object') return o;
        o.label = typeof s.label === 'string' ? s.label : '';
        if (s.rank != null && Number.isFinite(Number(s.rank))) {
          o.rank = Math.max(RANK_MIN, Math.min(RANK_MAX, Math.floor(Number(s.rank))));
          o.stamMax = stamMaxFromRank(o.rank);
        } else {
          o.stamMax = Math.max(1, Math.min(999, safeNum(s.stamMax, STAM_MAX_BASE)));
          o.rank = rankFromStamMax(o.stamMax);
          o.stamMax = stamMaxFromRank(o.rank);
        }
        o.stamCurrent = Math.max(0, Math.min(o.stamMax, safeNum(s.stamCurrent, 0)));
        const ss = safeNum(s.stamStart, null);
        if (ss && ss > 0 && ss < Date.now() + 60000 && s.stamRunning) {
          const elapsed = Math.max(0, now - ss);
          const recovered = Math.floor(elapsed / STAM_INTERVAL);
          o.stamCurrent = Math.min(o.stamMax, o.stamCurrent + recovered);
          o.stamStart = ss + recovered * STAM_INTERVAL;
          o.stamRunning = true;
          if (o.stamCurrent >= o.stamMax) {
            o.stamCurrent = o.stamMax;
            o.stamStart = ss;
          }
        }
        o.idleCapMs = safeNum(s.idleCapMs, IDLE_DEFAULT_CAP_MS);
        const is = safeNum(s.idleStart, null);
        if (is && is > 0 && is < Date.now() + 60000 && s.idleRunning) {
          o.idleStart = is;
          o.idleRunning = true;
        }
        o.missionDone = !!s.missionDone;
        o.weeklyDone = !!s.weeklyDone;
        return o;
      });
    }
    result.dailyDate = typeof parsed.dailyDate === 'string' ? parsed.dailyDate : gameDayStr();
    result.weeklyWeekId = typeof parsed.weeklyWeekId === 'string' ? parsed.weeklyWeekId : '';

    result.g = result.g || { slots: null, dailyDate: dayStrAt(G_RESET_HOUR) };
    if (parsed.g && Array.isArray(parsed.g.slots) && parsed.g.slots.length === GN) {
      const now2 = Date.now();
      result.g.slots = parsed.g.slots.map(s => {
        const o = defaultGSlot();
        if (!s || typeof s !== 'object') return o;
        o.label = typeof s.label === 'string' ? s.label : '';
        o.stamMax = Math.max(1, Math.min(999, safeNum(s.stamMax, 130)));
        o.stamCurrent = Math.max(0, Math.min(o.stamMax, safeNum(s.stamCurrent, 0)));
        const ss = safeNum(s.stamStart, null);
        if (ss && ss > 0 && ss < Date.now() + 60000 && s.stamRunning) {
          const elapsed = Math.max(0, now2 - ss);
          const recovered = Math.floor(elapsed / G_STAM_INTERVAL);
          o.stamCurrent = Math.min(o.stamMax, o.stamCurrent + recovered);
          o.stamStart = ss + recovered * G_STAM_INTERVAL;
          o.stamRunning = true;
          if (o.stamCurrent >= o.stamMax) { o.stamCurrent = o.stamMax; o.stamStart = ss; }
        }
        o.missionDone = !!s.missionDone;
        return o;
      });
      result.g.dailyDate = typeof parsed.g.dailyDate === 'string' ? parsed.g.dailyDate : dayStrAt(G_RESET_HOUR);
    }

    if (parsed.sl && typeof parsed.sl === 'object') {
      const readSLTimer = (source, max) => {
        const out = defaultSLTimer();
        if (!source || typeof source !== 'object') return out;
        out.current = Math.max(0, Math.min(max, safeNum(source.current, 0)));
        const start = safeNum(source.start, null);
        if (source.running && start && start > 0 && start < Date.now() + 60000) {
          out.start = start;
          out.running = true;
        }
        return out;
      };
      result.sl.stamina = readSLTimer(parsed.sl.stamina, SL_STAM_MAX);
      result.sl.orb = readSLTimer(parsed.sl.orb, SL_ORB_MAX);
    }
  }
  return result;
}

function loadState(){
  try {
    const parsed = parseStoredState();
    if (parsed.slots) state.slots = parsed.slots;
    state.dailyDate = parsed.dailyDate;
    state.weeklyWeekId = parsed.weeklyWeekId || '';
    if (parsed.g && parsed.g.slots) state.g.slots = parsed.g.slots;
    if (parsed.g) state.g.dailyDate = parsed.g.dailyDate;
    if (parsed.sl) state.sl = parsed.sl;
  } catch (e) {
    storageOk = false;
    setSaveStamp('このブラウザでは保存機能が使えません');
    state.dailyDate = gameDayStr();
  }
  build();
  render();
  // 進行中のタイマーがある場合だけ、毎秒描画を開始する。
  startTicking();
  scheduleResetCheck();
  if (storageOk) setSaveStamp('読み込み完了');
}

function saveState(){
  if (!storageOk) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const now = new Date();
    const p = n => String(n).padStart(2, '0');
    setSaveStamp('保存済み ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds()));
  } catch (e) {
    setSaveStamp('保存に失敗しました');
  }
}

function getStamInfo(s, now){
  if (!s.stamRunning || !s.stamStart) {
    const cur = s.stamCurrent;
    return { current: cur, fullIn: null, fullAt: null, isFull: cur >= s.stamMax, pct: s.stamMax ? (cur / s.stamMax) * 100 : 0 };
  }
  const elapsed = Math.max(0, now - s.stamStart);
  const recovered = Math.floor(elapsed / STAM_INTERVAL);
  const current = Math.min(s.stamMax, s.stamCurrent + recovered);
  if (current >= s.stamMax) {
    const need = Math.max(0, s.stamMax - s.stamCurrent);
    const fullAt = s.stamStart + need * STAM_INTERVAL;
    return { current: s.stamMax, fullIn: 0, fullAt: fullAt, isFull: true, pct: 100 };
  }
  const nextIn = STAM_INTERVAL - (elapsed % STAM_INTERVAL);
  const need = s.stamMax - current;
  const fullIn = (need - 1) * STAM_INTERVAL + nextIn;
  return { current, fullIn, fullAt: now + fullIn, isFull: false, pct: s.stamMax ? Math.min(100, (current / s.stamMax) * 100) : 0 };
}

function getGStamInfo(s, now){
  if (!s.stamRunning || !s.stamStart) {
    const cur = s.stamCurrent;
    return { current: cur, fullIn: null, fullAt: null, isFull: cur >= s.stamMax, pct: s.stamMax ? (cur / s.stamMax) * 100 : 0 };
  }
  const elapsed = Math.max(0, now - s.stamStart);
  const recovered = Math.floor(elapsed / G_STAM_INTERVAL);
  const current = Math.min(s.stamMax, s.stamCurrent + recovered);
  if (current >= s.stamMax) {
    const need = Math.max(0, s.stamMax - s.stamCurrent);
    const fullAt = s.stamStart + need * G_STAM_INTERVAL;
    return { current: s.stamMax, fullIn: 0, fullAt: fullAt, isFull: true, pct: 100 };
  }
  const nextIn = G_STAM_INTERVAL - (elapsed % G_STAM_INTERVAL);
  const need = s.stamMax - current;
  const fullIn = (need - 1) * G_STAM_INTERVAL + nextIn;
  return { current, fullIn, fullAt: now + fullIn, isFull: false, pct: s.stamMax ? Math.min(100, (current / s.stamMax) * 100) : 0 };
}

function getSLTimerInfo(timer, max, interval, now){
  if (!timer.running || !timer.start) {
    const current = timer.current;
    return { current, nextIn: null, fullIn: null, fullAt: null, isFull: current >= max, pct: max ? (current / max) * 100 : 0 };
  }
  const elapsed = Math.max(0, now - timer.start);
  const recovered = Math.floor(elapsed / interval);
  const current = Math.min(max, timer.current + recovered);
  if (current >= max) {
    const need = Math.max(0, max - timer.current);
    const fullAt = timer.start + need * interval;
    return { current: max, nextIn: 0, fullIn: 0, fullAt, isFull: true, pct: 100 };
  }
  const nextIn = interval - (elapsed % interval);
  const need = max - current;
  const fullIn = (need - 1) * interval + nextIn;
  return { current, nextIn, fullIn, fullAt: now + fullIn, isFull: false, pct: Math.min(100, (current / max) * 100) };
}

function getIdleInfo(s, now){
  if (!s.idleRunning || !s.idleStart) return { display: '—:—', meta: '未開始', pct: 0, isFull: false, remainingMs: null };
  const cap = s.idleCapMs || IDLE_DEFAULT_CAP_MS;
  const elapsed = Math.max(0, now - s.idleStart);
  const remaining = Math.max(0, cap - elapsed);
  const isFull = remaining <= 0;
  const fullAt = s.idleStart + cap;
  return {
    display: isFull ? 'MAX' : formatTime(remaining),
    meta: isFull ? formatClock(fullAt) + ' 到達' : formatClock(fullAt) + ' 満タン',
    clockTxt: formatClock(fullAt),
    suffix: isFull ? ' 到達' : ' 満タン',
    pct: Math.min(100, (elapsed / cap) * 100),
    isFull,
    remainingMs: remaining
  };
}

function stamRemainderAfter40s(current){
  const c = Math.max(0, Math.floor(Number(current) || 0));
  return c % 40;
}

function getSLConfig(type){
  return type === 'orb'
    ? { timer: state.sl.orb, max: SL_ORB_MAX, interval: SL_ORB_INTERVAL }
    : { timer: state.sl.stamina, max: SL_STAM_MAX, interval: SL_STAM_INTERVAL };
}

function normalizeSLTimer(type, now){
  const cfg = getSLConfig(type);
  const timer = cfg.timer;
  if (!timer.running || !timer.start) return getSLTimerInfo(timer, cfg.max, cfg.interval, now);
  const elapsed = Math.max(0, now - timer.start);
  const recovered = Math.floor(elapsed / cfg.interval);
  if (recovered > 0) {
    timer.current = Math.min(cfg.max, timer.current + recovered);
    timer.start += recovered * cfg.interval;
  }
  if (timer.current >= cfg.max) {
    timer.current = cfg.max;
    timer.running = false;
    timer.start = null;
  }
  return getSLTimerInfo(timer, cfg.max, cfg.interval, now);
}

function formatSLRemainingInput(ms){
  const totalMinutes = Math.max(0, Math.floor(ms / 60000));
  return Math.floor(totalMinutes / 60) + ':' + String(totalMinutes % 60).padStart(2, '0');
}

function parseSLRemainingInput(value){
  const raw = String(value || '').trim().replace(/：/g, ':');
  let hours, minutes;

  if (raw.includes(':')) {
    const parts = raw.split(':');
    if (parts.length !== 2) return null;
    hours = Number(parts[0]);
    minutes = Number(parts[1]);
  } else if (/^\d{1,4}$/.test(raw)) {
    // 数字のみは末尾2桁を分として扱う。例: 342 → 3時間42分、240 → 2時間40分。
    if (raw.length <= 2) {
      hours = 0;
      minutes = Number(raw);
    } else {
      hours = Number(raw.slice(0, -2));
      minutes = Number(raw.slice(-2));
    }
  } else {
    return null;
  }

  if (!Number.isInteger(hours) || !Number.isInteger(minutes) || hours < 0 || minutes < 0 || minutes > 59) return null;
  const ms = (hours * 60 + minutes) * 60 * 1000;
  if (ms <= 0 || ms > SL_ORB_INTERVAL) return null;
  return ms;
}

function placeCaretAtEnd(el){
  requestAnimationFrame(() => {
    try {
      const end = el.value.length;
      el.setSelectionRange(end, end);
    } catch (e) {}
  });
}

function closeSLCard(){
  slOpenType = null;
  Object.keys(slRefs).forEach(key => {
    if (slRefs[key] && slRefs[key].card) slRefs[key].card.classList.remove('open');
  });
  const bd = document.getElementById('backdrop');
  if (bd) bd.classList.toggle('show', openIdx >= 0 || gOpenIdx >= 0);
}

function toggleSLCard(type){
  if (slOpenType === type) {
    closeSLCard();
    return;
  }
  slOpenType = type;
  const cfg = getSLConfig(type);
  const live = normalizeSLTimer(type, Date.now());
  if (slRefs[type] && slRefs[type].input) {
    const input = slRefs[type].input;
    input.dataset.prev = String(live.current);
    input.value = String(live.current); // Gジェネと同じく、開いた直後は現在値を表示する。
  }
  if (type === 'orb' && slRefs.orb && slRefs.orb.nextInput) {
    slRefs.orb.nextInput.value = cfg.timer.running && !live.isFull ? formatSLRemainingInput(live.nextIn) : '';
  }
  Object.keys(slRefs).forEach(key => {
    if (slRefs[key] && slRefs[key].card) slRefs[key].card.classList.toggle('open', slOpenType === key);
  });
  const bd = document.getElementById('backdrop');
  if (bd) bd.classList.add('show');
}

function syncSL(type){
  const cfg = getSLConfig(type);
  const input = slRefs[type] && slRefs[type].input;
  const raw = (input && input.value != null) ? String(input.value).trim() : '';
  let parsed;
  if (raw === '') {
    const prev = parseInt(input && input.dataset.prev, 10);
    parsed = Number.isFinite(prev) ? prev : cfg.timer.current;
  } else {
    parsed = parseInt(raw, 10);
  }
  if (!Number.isFinite(parsed)) parsed = cfg.timer.current;
  const value = Math.max(0, Math.min(cfg.max, parsed));
  cfg.timer.current = value;
  cfg.timer.running = value < cfg.max;
  cfg.timer.start = cfg.timer.running ? Date.now() : null;
  saveState();
  renderSL();
  if (input) input.value = String(value);
  if (type === 'orb' && slRefs.orb && slRefs.orb.nextInput) slRefs.orb.nextInput.value = formatSLRemainingInput(SL_ORB_INTERVAL);
  closeSLCard();
  startTicking();
}

function adjustSLOrbNext(){
  const cfg = getSLConfig('orb');
  const input = slRefs.orb && slRefs.orb.nextInput;
  const remaining = parseSLRemainingInput(input && input.value);
  if (remaining === null || cfg.timer.current >= SL_ORB_MAX) return;

  const now = Date.now();
  normalizeSLTimer('orb', now);
  if (cfg.timer.current >= SL_ORB_MAX) return;

  cfg.timer.running = true;
  cfg.timer.start = now - (SL_ORB_INTERVAL - remaining);
  saveState();
  renderSL();
  if (input) input.value = formatSLRemainingInput(remaining);
  startTicking();
}

function addSLOrb(){
  const now = Date.now();
  const cfg = getSLConfig('orb');
  normalizeSLTimer('orb', now);
  if (cfg.timer.current >= cfg.max) return;
  cfg.timer.current += 1;
  if (cfg.timer.current >= cfg.max) {
    cfg.timer.running = false;
    cfg.timer.start = null;
  } else if (!cfg.timer.running) {
    cfg.timer.running = true;
    cfg.timer.start = now;
  }
  saveState();
  renderSL();
  startTicking();
}

function consumeSLOrb(){
  const now = Date.now();
  const cfg = getSLConfig('orb');
  normalizeSLTimer('orb', now);
  if (cfg.timer.current <= 0) return;
  cfg.timer.current -= 1;
  if (!cfg.timer.running) {
    cfg.timer.running = true;
    cfg.timer.start = now;
  }
  saveState();
  renderSL();
  startTicking();
}

function renderSL(){
  if (!slRefs.stamina || !slRefs.orb) return;
  const now = Date.now();
  const stamCfg = getSLConfig('stamina');
  const orbCfg = getSLConfig('orb');
  const stamina = getSLTimerInfo(stamCfg.timer, stamCfg.max, stamCfg.interval, now);
  const orb = getSLTimerInfo(orbCfg.timer, orbCfg.max, orbCfg.interval, now);

  setText(slRefs.stamina.main, stamina.isFull ? 'MAX' : (stamCfg.timer.running ? formatTime(stamina.fullIn) : '—:—'));
  setClass(slRefs.stamina.main, 'slmain' + (stamina.isFull ? ' full' : ''));
  setText(slRefs.stamina.sub, stamina.current + '/' + SL_STAM_MAX + (stamina.fullAt ? '　' + formatClock(stamina.fullAt) + (stamina.isFull ? ' 到達' : '') : ''));
  setWidth(slRefs.stamina.bar, stamina.pct);
  setClass(slRefs.stamina.bar, 'slbar-fill' + (stamina.isFull ? ' full' : ''));

  const filled = '●'.repeat(orb.current) + '○'.repeat(SL_ORB_MAX - orb.current);
  setText(slRefs.orb.main, filled);
  setClass(slRefs.orb.main, 'slmain slorbs' + (orb.isFull ? ' full' : ''));
  const orbText = orb.isFull ? '4/4　満タン' : (orbCfg.timer.running ? '次 ' + formatFixedDuration(orb.nextIn) + '　全 ' + formatFixedDuration(orb.fullIn) : orb.current + '/4　未開始');
  setText(slRefs.orb.sub, orbText);
  setWidth(slRefs.orb.bar, orb.pct);
  setClass(slRefs.orb.bar, 'slbar-fill orb' + (orb.isFull ? ' full' : ''));
}

function setupSLDelegatedEvents(){
  const wrap = document.getElementById('slwrap');
  if (!wrap || wrap.dataset.delegated) return;
  wrap.dataset.delegated = '1';
  wrap.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-slaction]');
    if (!el) return;
    const action = el.dataset.slaction;
    const type = el.dataset.sltype;
    if (action === 'card') {
      // 編集パネル内部の余白・入力欄は、カードを閉じる対象にしない。
      if (ev.target.closest('.sledit')) return;
      toggleSLCard(type);
    } else if (action === 'sync') {
      syncSL(type);
    } else if (action === 'restore') {
      addSLOrb();
    } else if (action === 'consume') {
      consumeSLOrb();
    } else if (action === 'adjust-next') {
      adjustSLOrbNext();
    }
  });
  wrap.addEventListener('change', (ev) => {
    if (ev.target && ev.target.id === 'sl-orb-next') adjustSLOrbNext();
  });
  wrap.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'sl-orb-next') {
      ev.preventDefault();
      ev.target.blur();
    }
  });
  wrap.addEventListener('focusin', (ev) => {
    const input = ev.target;
    if (!input || input.tagName !== 'INPUT') return;
    // 現在値欄・オーブの時間欄はフォーカスでブランク（入力しやすく）。
    if (input.classList && (input.classList.contains('sledit-current') || input.id === 'sl-orb-next')) {
      if (input.value !== '') input.dataset.prev = input.value;
      input.value = '';
      return;
    }
    placeCaretAtEnd(input);
  });
  wrap.addEventListener('focusout', (ev) => {
    const input = ev.target;
    if (!input || !input.classList || !input.classList.contains('sledit-current')) return;
    if (String(input.value).trim() === '' && input.dataset.prev != null) {
      input.value = input.dataset.prev;
    }
  });
}

function softBlur(){

  if (!ae || ae === document.body || !ae.blur) return;

}

function onCardClick(i, ev){
  const t = ev.target;
  if (t.closest && (t.closest('input') || t.closest('button') || t.closest('.name-input') || t.closest('.rank-input'))) return;
  if (textEditIdx >= 0) {
    softBlur();
    textEditIdx = -1;
    suppressOpenAllUntil = Date.now() + 150;
    return;
  }
  if (Date.now() < suppressOpenAllUntil) return;
  disarmAllIdle();

  let side = null;
  if (t.closest && (t.closest('.tblock-stam') || t.closest('.row-hit-stam'))) side = 'stam';
  else if (t.closest && (t.closest('.tblock-idle') || t.closest('.row-hit-idle'))) side = 'idle';
  else {
    const cardEl = (refs[i] && refs[i].card) || (t.closest && t.closest('.card'));
    const x = (ev.clientX != null) ? ev.clientX
      : (ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0].clientX : null);
    if (cardEl && x != null) {
      const r = cardEl.getBoundingClientRect();
      side = (x - r.left) >= r.width * 0.5 ? 'idle' : 'stam';
    } else {
      side = 'stam';
    }
  }

  if (openIdx === i) {
    if (t.closest && t.closest('.edit-panel')) return;
    if (side && side !== openMode) {
      openMode = side;
      updateOpenState();
      if (side === 'stam') prefillsStamCur(i);
      softBlur();
      return;
    }
    restoreEditInputs(i);
    openIdx = -1;
    openMode = null;
    updateOpenState();
    softBlur();
    return;
  }
  const prevOpen = openIdx;
  openIdx = i;
  openMode = side || 'stam';
  updateOpenState();
  if (prevOpen >= 0) restoreEditInputs(prevOpen);
  if (openMode === 'stam') prefillsStamCur(i);
  softBlur();
}

function updateOpenState(){
  const editing = openIdx >= 0;
  const prev = _lastOpenIdx;
  if (prev >= 0 && prev !== openIdx && refs[prev] && refs[prev].card) {
    refs[prev].card.classList.remove('open');
    refs[prev].card.setAttribute('aria-expanded', 'false');
  }
  if (prev >= 0 && refs[prev] && refs[prev].card) {
    refs[prev].card.classList.remove('mode-stam', 'mode-idle');
  }
  if (openIdx >= 0 && refs[openIdx] && refs[openIdx].card) {
    refs[openIdx].card.classList.add('open');
    refs[openIdx].card.classList.remove('mode-stam', 'mode-idle');
    if (openMode === 'stam') refs[openIdx].card.classList.add('mode-stam');
    else if (openMode === 'idle') refs[openIdx].card.classList.add('mode-idle');
    refs[openIdx].card.setAttribute('aria-expanded', 'true');
  }
  if ((prev >= 0) !== editing) {
    for (let i = 0; i < N; i++) {
      if (refs[i] && refs[i].mark) {
        refs[i].mark.classList.toggle('disabled-by-edit', editing);
      }
      if (refs[i] && refs[i].weeklyMark) {
        refs[i].weeklyMark.classList.toggle('disabled-by-edit', editing);
      }
    }
  }
  const anyOpen = editing || gOpenIdx >= 0;
  const bd = document.getElementById('backdrop');
  if (bd) bd.classList.toggle('show', anyOpen);
  _lastOpenIdx = openIdx;
}

function render(){
  try {
    ensureDailyDate();
    ensureWeeklyDate();
    const now = Date.now();
    if (!refs.length) return;
    // カード描画で求めた放置報酬情報を再利用し、タブ用の二重計算を避ける。
    const abyssTabShortest = Object.create(null);
    for (let i = 0; i < N; i++) {
      const s = state.slots[i];
      const r = refs[i];
      if (!r || !r.stamVal) continue;
      const stam = getStamInfo(s, now);
      const idle = getIdleInfo(s, now);
      if (idle.remainingMs != null) {
        const group = groupClass(i);
        if (abyssTabShortest[group] === undefined || idle.remainingMs < abyssTabShortest[group]) {
          abyssTabShortest[group] = idle.remainingMs;
        }
      }
      let stamMain, stamCls, stamCurTxt, stamMaxTxt, stamClockTxt, stamClockSuffix, stamBarCls;
      if (s.stamRunning) {
        if (stam.isFull) {
          stamMain = 'MAX'; stamCls = 'tval stam full';
          stamCurTxt = String(stam.current); stamMaxTxt = String(s.stamMax);
          stamClockTxt = stam.fullAt ? formatClock(stam.fullAt) : ''; stamClockSuffix = stam.fullAt ? ' 到達' : '';
          stamBarCls = 'pbar-fill stam full';
        } else {
          stamMain = formatTime(stam.fullIn);
          const stamUrgent = stam.fullIn != null && stam.fullIn < URGENT_MS;
          stamCls = 'tval stam' + (stamUrgent ? ' urgent' : '');
          stamCurTxt = String(stam.current); stamMaxTxt = String(s.stamMax);
          stamClockTxt = stam.fullAt ? formatClock(stam.fullAt) : ''; stamClockSuffix = '';
          stamBarCls = 'pbar-fill stam';
        }
      } else {
        stamMain = '—:—'; stamCls = 'tval stam';
        stamCurTxt = String(s.stamCurrent); stamMaxTxt = String(s.stamMax); stamClockTxt = ''; stamClockSuffix = '';
        stamBarCls = 'pbar-fill stam';
      }
      setText(r.stamVal, stamMain); setClass(r.stamVal, stamCls);
      setText(r.stamSubCur, stamCurTxt);
      setText(r.stamSubMax, stamMaxTxt);
      if (stamClockTxt) {
        setHTML(r.stamSubClock, '<span class="idle-clock">' + stamClockTxt + '</span>' + stamClockSuffix);
      } else {
        setText(r.stamSubClock, '');
      }
      setWidth(r.stamBar, stam.pct); setClass(r.stamBar, stamBarCls);
      setText(r.idleVal, idle.display);
      let idleCls = 'tval idle';
      if (idle.isFull) idleCls += ' full';
      else if (s.idleRunning && idle.remainingMs != null && idle.remainingMs < URGENT_MS) idleCls += ' urgent';
      setClass(r.idleVal, idleCls);
      if (idle.clockTxt) {
        setHTML(r.idleSub, '<span class="idle-clock">' + idle.clockTxt + '</span>' + idle.suffix);
      } else {
        setText(r.idleSub, idle.meta);
      }
      setWidth(r.idleBar, idle.pct);
      setClass(r.idleBar, 'pbar-fill idle' + (idle.isFull ? ' full' : (idleCls.indexOf('urgent') >= 0 ? ' urgent' : '')));
    }
    renderAbyssTabIdle(abyssTabShortest);
  } catch (e) { console.warn(e); }
  renderG();
  renderSL();
  // すべて満タン・未開始なら、不要な毎秒描画を停止する。
  if (tickId && !needsTicking()) stopTicking();
}

function renderG(){
  try {
    ensureGDailyDate();
    const now = Date.now();
    if (!gRefs.length) return;
    for (let i = 0; i < GN; i++) {
      const s = state.g.slots[i];
      const r = gRefs[i];
      if (!r || !r.val) continue;
      const stam = getGStamInfo(s, now);
      let main, cls, curTxt, maxTxt, clockTxt, barCls;
      if (s.stamRunning) {
        if (stam.isFull) {
          main = 'MAX'; cls = 'gval full';
          curTxt = String(stam.current); maxTxt = String(s.stamMax);
          clockTxt = stam.fullAt ? (formatClock(stam.fullAt) + ' 到達') : '';
          barCls = 'gbar-fill full';
        } else {
          main = formatTime(stam.fullIn);
          cls = 'gval';
          curTxt = String(stam.current); maxTxt = String(s.stamMax);
          clockTxt = stam.fullAt ? formatClock(stam.fullAt) : '';
          barCls = 'gbar-fill';
        }
      } else {
        main = '—:—'; cls = 'gval';
        curTxt = String(s.stamCurrent); maxTxt = String(s.stamMax); clockTxt = '';
        barCls = 'gbar-fill';
      }
      setText(r.val, main); setClass(r.val, cls);
      setText(r.subCur, curTxt); setText(r.subMax, maxTxt); setText(r.subClock, clockTxt);
      setWidth(r.bar, stam.pct); setClass(r.bar, barCls);
    }
  } catch (e) { console.warn(e); }
}

function needsTicking(){
  const now = Date.now();
  for (let i = 0; i < N; i++) {
    const s = state.slots[i];
    if (s.stamRunning && !getStamInfo(s, now).isFull) return true;
    if (s.idleRunning && !getIdleInfo(s, now).isFull) return true;
  }
  for (let i = 0; i < GN; i++) {
    const s = state.g.slots[i];
    if (s.stamRunning && !getGStamInfo(s, now).isFull) return true;
  }
  if (state.sl.stamina.running && !getSLTimerInfo(state.sl.stamina, SL_STAM_MAX, SL_STAM_INTERVAL, now).isFull) return true;
  if (state.sl.orb.running && !getSLTimerInfo(state.sl.orb, SL_ORB_MAX, SL_ORB_INTERVAL, now).isFull) return true;
  return false;
}

function startTicking(){
  if (!needsTicking()) {
    stopTicking();
    return;
  }
  if (!tickId) tickId = setInterval(render, 1000);
}
function stopTicking(){
  if (tickId) { clearInterval(tickId); tickId = null; }
}

function setupDelegatedEvents(){
  const grid = document.getElementById('grid');
  if (!grid || grid.dataset.delegated) return;
  grid.dataset.delegated = '1';

  grid.addEventListener('click', (ev) => {
    const t = ev.target;
    if (t.classList && (t.classList.contains('name-disp') || t.classList.contains('rank-disp'))) {
      if (lpFired) { lpFired = false; return; }
      const cardEl = t.closest('.card');
      const idx = cardEl ? Number(cardEl.dataset.idx) : NaN;
      if (Number.isFinite(idx)) onCardClick(idx, ev);
      return;
    }
    if (t.closest && t.closest('input')) return;
    const el = t.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const i = Number(el.dataset.idx);
    if (action === 'card') onCardClick(i, ev);
    else if (action === 'update') applyStam(i);
    else if (action === 'receive') onReceiveClick(i, el);
    else if (action === 'mark' || action === 'weekly') { /* 長押し判定で制御 */ }
  });

  grid.addEventListener('focusin', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('stam-cur-') === 0) onCurFocus(t);
  });

  grid.addEventListener('focusout', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('stam-cur-') === 0) onCurBlur(Number(t.id.split('-').pop()), t);
    else if (t.classList && t.classList.contains('name-input')) onNameBlur(Number(t.id.split('-').pop()));
    else if (t.classList && t.classList.contains('rank-input')) onRankBlur(Number(t.id.split('-').pop()));
  });

  grid.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.classList && t.classList.contains('name-input')) {
      const idx = Number(t.id.split('-').pop());
      state.slots[idx].label = t.value;
      clearTimeout(labelSaveTimer);
      labelSaveTimer = setTimeout(saveState, 300);
    }
  });

  let lpTimer = null;
  let lpFired = false;
  let lpX = 0, lpY = 0;
  const LP_MS = 500;
  const LP_MOVE2 = 12 * 12;
  const clearLp = () => { if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; } };
  const lpStart = (ev) => {
    const el = ev.target;
    if (!el) return;
    const weeklyEl = el.closest && el.closest('.weekly-mark');
    const markEl = el.closest && el.closest('.daily-mark');
    let mode = null;
    if (weeklyEl) mode = 'weekly';
    else if (markEl) mode = 'mark';
    else if (el.classList && el.classList.contains('name-disp')) mode = 'name';
    else if (el.classList && el.classList.contains('rank-disp')) mode = 'rank';
    else return;
    const idEl = weeklyEl || markEl || el;
    const i = Number((idEl.dataset && idEl.dataset.idx != null) ? idEl.dataset.idx : (idEl.id || '').split('-').pop());
    if (!Number.isFinite(i)) return;
    clearLp();
    lpFired = false;
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    lpX = pt.clientX; lpY = pt.clientY;
    lpTimer = setTimeout(() => {
      lpTimer = null;
      lpFired = true;
      if (mode === 'weekly') toggleWeeklyMark(i);
      else if (mode === 'mark') toggleMissionMark(i);
      else if (mode === 'name') beginNameEdit(i);
      else beginRankEdit(i);
    }, LP_MS);
  };
  const lpMove = (ev) => {
    if (!lpTimer) return;
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const dx = pt.clientX - lpX, dy = pt.clientY - lpY;
    if (dx * dx + dy * dy > LP_MOVE2) clearLp();
  };
  grid.addEventListener('touchstart', lpStart, { passive: true });
  grid.addEventListener('touchmove', lpMove, { passive: true });
  grid.addEventListener('touchend', clearLp, { passive: true });
  grid.addEventListener('touchcancel', clearLp, { passive: true });
  grid.addEventListener('mouseleave', clearLp, { passive: true });
  grid.addEventListener('mousedown', (ev) => { if (ev.button === 0) lpStart(ev); });
  grid.addEventListener('mousemove', lpMove);
  grid.addEventListener('mouseup', clearLp);
}

document.addEventListener('contextmenu', (ev) => {
  // 入力欄を含む全画面で、スマホの長押しメニューを表示しない。
  ev.preventDefault();
}, { capture: true });

document.addEventListener('selectstart', (ev) => {
  // ランク表示を長押しして編集へ入る際に、表示文字をハイライトさせない。
  const el = ev.target;
  if (el && el.closest && el.closest('.rank-disp')) ev.preventDefault();
}, { capture: true });

function setupGDelegatedEvents(){
  const wrap = document.getElementById('gwrap');
  if (!wrap || wrap.dataset.delegated) return;

  wrap.addEventListener('click', (ev) => {

    else if (action === 'max-down') adjustGMax(i, -1);

  wrap.addEventListener('focusin', (ev) => {

    if (t.id.indexOf('g-cur-') === 0) onGCurFocus(t);
  });

  wrap.addEventListener('focusout', (ev) => {
    const t = ev.target;
    if (!t.id) return;
    if (t.id.indexOf('g-cur-') === 0) onGCurBlur(Number(t.id.split('-').pop()), t);
    else if (t.classList && t.classList.contains('gname-input')) onGNameBlur(Number(t.id.split('-').pop()));
  });

  let glpTimer = null;
  let glpX = 0, glpY = 0;
  const GLP_MS = 500;
  const GLP_MOVE2 = 12 * 12;
  const clearGLp = () => { if (glpTimer) { clearTimeout(glpTimer); glpTimer = null; } };
  const glpStart = (ev) => {
    const el = ev.target;
    if (!el) return;
    const markEl = el.closest && el.closest('.gmark');
    let mode = null;
    if (markEl) mode = 'mark';
    else if (el.classList && el.classList.contains('gname-disp')) mode = 'name';
    else return;
    const idEl = markEl || el;
    const i = Number((idEl.dataset && idEl.dataset.idx != null) ? idEl.dataset.idx : (idEl.id || '').split('-').pop());
    if (!Number.isFinite(i)) return;
    clearGLp();
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    glpX = pt.clientX; glpY = pt.clientY;
    glpTimer = setTimeout(() => {
      glpTimer = null;
      if (mode === 'mark') toggleGMark(i);
      else beginGNameEdit(i);
    }, GLP_MS);
  };
  const glpMove = (ev) => {
    if (!glpTimer) return;
    const pt = (ev.touches && ev.touches[0]) ? ev.touches[0] : ev;
    const dx = pt.clientX - glpX, dy = pt.clientY - glpY;
    if (dx * dx + dy * dy > GLP_MOVE2) clearGLp();
  };
  wrap.addEventListener('touchstart', glpStart, { passive: true });
  wrap.addEventListener('touchmove', glpMove, { passive: true });
  wrap.addEventListener('touchend', clearGLp, { passive: true });
  wrap.addEventListener('touchcancel', clearGLp, { passive: true });
  wrap.addEventListener('mouseleave', clearGLp, { passive: true });
  wrap.addEventListener('mousedown', (ev) => { if (ev.button === 0) glpStart(ev); });
  wrap.addEventListener('mousemove', glpMove);
  wrap.addEventListener('mouseup', clearGLp);
}

loadState();
setupDelegatedEvents();
setupGDelegatedEvents();
setupSLDelegatedEvents();
setupGameTabs();
setupAbyssTabs();
// 初期描画を優先し、Service Workerの登録はアイドル時へ退避する。
scheduleServiceWorkerRegistration();
const startupGraceUntil = Date.now() + 3000;

// ---- 画面復帰時のタイマー同期処理 ----
// focus/pageshow は visibilitychange と二重発火しやすいので使わない。
// 連続復帰イベントは短い debounce で1回にまとめる。
let resumeDebounceTimer = null;
let lastResumeAt = 0;
const RESUME_FORCE_COALESCE_MS = 180;
const RESUME_NORMAL_DEBOUNCE_MS = 320;

function resumeTicking(force){
  if (document.hidden) return;
  const now = Date.now();
  // visibilitychange・resume・pageshowが連続しても、最初の即時描画だけを採用する。
  const minGap = force ? RESUME_FORCE_COALESCE_MS : RESUME_NORMAL_DEBOUNCE_MS;
  if (now - lastResumeAt < minGap) return;
  lastResumeAt = now;

  if (resumeDebounceTimer) {
    clearTimeout(resumeDebounceTimer);
    resumeDebounceTimer = null;
  }

  const restart = () => {
    if (document.hidden) return;
    render();
    startTicking();
    scheduleResetCheck();
  };

  // タスク復帰は即時同期する。通常の重複イベントだけ短くまとめる。
  if (force) {
    restart();
    return;
  }
  resumeDebounceTimer = setTimeout(() => {
    resumeDebounceTimer = null;
    restart();
  }, 48);
}

function scheduleResetCheck(){
  if (resetCheckTimer) clearTimeout(resetCheckTimer);

  const now = new Date();
  const next = new Date(now);
  next.setHours(1, 0, 1, 0);
  if (next <= now) next.setDate(next.getDate() + 1);

  const nextGameReset = new Date(now);
  nextGameReset.setHours(5, 0, 1, 0);
  if (nextGameReset <= now) nextGameReset.setDate(nextGameReset.getDate() + 1);
  if (nextGameReset < next) next.setTime(nextGameReset.getTime());

  resetCheckTimer = setTimeout(() => {
    resetCheckTimer = null;
    if (!document.hidden) {
      render();
      startTicking();
    }
    scheduleResetCheck();
  }, Math.max(1000, next.getTime() - now.getTime()));
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // 次の復帰を直前イベントの抑止対象にしない。
    lastResumeAt = 0;
    if (Date.now() < startupGraceUntil) return;
    stopTicking();
    if (resumeDebounceTimer) {
      clearTimeout(resumeDebounceTimer);
      resumeDebounceTimer = null;
    }
  } else {
    // Androidのタスク復帰では最初の可視化を必ず同期する。
    resumeTicking(true);
  }
});

// 一部のWebView・PWAシェルが送る復帰通知も同じ経路で扱う。
document.addEventListener('resume', () => resumeTicking(true));

window.addEventListener('pageshow', (ev) => {
  if (ev.persisted) resumeTicking(true);
});

function scheduleServiceWorkerRegistration(){
  if (swRegistrationScheduled) return;
  if (!('serviceWorker' in navigator)) return;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

  swRegistrationScheduled = true;
  const register = () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
  };

  // Service Workerの取得・インストールを初期描画と競合させない。
  if ('requestIdleCallback' in window) requestIdleCallback(register, { timeout: 8000 });
  else setTimeout(register, 2500);
}
