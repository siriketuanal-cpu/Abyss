<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>タイマー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0b14; --card:#15151f; --card2:#1b1b28; --line:#2a2a3a;
    --text:#eceef2; --sub:#8a8ea3; --accent:#9b8bff; --blue:#4fa3ff; --orange:#ffab5c;
    --danger:#ff6b6b; --ok:#5cd68a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none; overscroll-behavior:none;
  }
  input{ caret-color:transparent; }
  header{
    display:flex; align-items:center; gap:8px; padding:10px 12px 6px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header .spacer{flex:1; min-width:0;}
  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #cards{padding:6px 6px 20px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:7px 7px; position:relative; min-width:0;
  }
  .card.claim{border-color:var(--ok);}
  .card.full{border-color:var(--orange);}
  .row{display:flex; align-items:center; gap:3px; min-width:0;}
  .row + .row{margin-top:3px;}
  .namerow{margin-bottom:5px; padding-right:20px;}
  .name{
    width:100%; background:transparent; border:none; color:var(--text);
    font-size:11px; font-weight:600; padding:2px 0; min-width:0;
  }
  .name::placeholder{color:var(--sub);}
  .del{
    position:absolute; top:3px; right:3px; width:16px; height:16px; border-radius:5px;
    border:none; background:none; color:var(--sub);
    font-size:12px; line-height:1; padding:0; z-index:2;
  }
  .del.pending{background:var(--danger); color:#fff;}
  .main{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  .valrow-stam{ margin-top:7px !important; }
  .stamval{
    width:26px; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--text); font-size:15px; font-weight:700; text-align:center; padding:0 0 1px;
    font-variant-numeric:tabular-nums;
  }
  .slash{color:var(--sub); font-size:13px;}
  .clockstack{
    margin-left:auto; display:flex; flex-direction:column; align-items:center;
    font-size:9px; font-weight:700; line-height:1.05; color:var(--accent);
  }
  .clockstack .ok{color:var(--ok); font-size:13px; line-height:1;}
  .valrow-idle{ justify-content:center; gap:10px; }
  .valrow-idle .clockstack{ margin-left:0; }
  .divider{
    grid-column:1 / -1; display:flex; align-items:center; gap:6px;
    padding:8px 2px 2px; border-bottom:1px solid var(--line); position:relative;
  }
  .divider .name{
    width:auto; flex:1; font-size:13px; font-weight:700; color:var(--accent); padding:0 0 4px;
  }
  .divider .del{ position:static; margin-left:auto; }
  /* ルナビィ下線と同系の太い仕切り。色は item.color */
  .rule-line{
    grid-column:1 / -1; position:relative;
    height:0; margin:8px 2px 4px; padding:0;
    border:0; border-top:2px solid #52617a;
  }
  .rule-line .del{
    position:absolute; top:-10px; right:0; width:16px; height:16px;
  }
  #empty{color:var(--sub); font-size:13px; text-align:center; padding:40px 0;}
  #addPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; gap:10px; z-index:10;
  }
  #addPanel.show{display:flex; flex-wrap:wrap;}
  #addPanel button{
    flex:1 1 calc(50% - 5px); min-width:calc(40% - 5px); padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:600;
  }
  #setupPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:16px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; flex-direction:column; gap:12px; z-index:11;
  }
  #setupPanel.show{display:flex;}
  #setupPanel .setupLabel{font-size:13px; color:var(--sub); text-align:center;}
  #setupFields{display:flex; align-items:center; justify-content:center; gap:6px;}
  #setupFields input{
    width:60px; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:16px; text-align:center; padding:8px 4px;
  }
  #setupFields span{color:var(--sub); font-size:13px;}
  #setupConfirm{
    padding:12px; border-radius:12px; border:none;
    background:var(--accent); color:#100c26; font-size:14px; font-weight:700;
  }
  #saveStamp{font-size:10px; color:var(--sub); text-align:center; padding-bottom:6px;}
</style>
</head>
<body>
<header>
  <button class="iconbtn" id="updateBtn" title="アプリを更新" aria-label="アプリを更新">↻</button>
  <span class="spacer" aria-hidden="true"></span>
  <button class="iconbtn" id="addBtn">＋</button>
</header>
<div id="cards"></div>
<div id="empty">＋ でタイマーを追加</div>
<div id="saveStamp"></div>

<div id="addPanel">
  <button data-type="stam">スタミナ</button>
  <button data-type="abyss">Abyssスタミナ</button>
  <button data-type="idle">放置報酬</button>
  <button data-type="header">見出し</button>
  <button data-type="rule">仕切り線</button>
</div>
<div id="setupPanel">
  <div class="setupLabel" id="setupLabel"></div>
  <div id="setupFields"></div>
  <button id="setupConfirm">追加</button>
</div>

<script>
const STORAGE_KEY = 'freetimer:v1';
let state = load();
let refs = {};
let tickId = null;
let tickGen = 0;

// DOM参照は一度だけ取得して使い回す(毎分ティックや毎クリックで検索し直さない)。
const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('empty');
const saveStampEl = document.getElementById('saveStamp');
const addPanelEl = document.getElementById('addPanel');
const addBtnEl = document.getElementById('addBtn');
const setupPanelEl = document.getElementById('setupPanel');
const setupLabelEl = document.getElementById('setupLabel');
const setupFieldsEl = document.getElementById('setupFields');
const setupConfirmEl = document.getElementById('setupConfirm');

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return { items: [] };
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    saveStampEl.textContent = '保存済み ' + p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){
    saveStampEl.textContent = '保存に失敗しました';
  }
}
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// 入力欄フォーカス時は常に末尾へカーソルを固定する。
function forceCursorToEnd(input){
  const place = () => { try{ input.setSelectionRange(input.value.length, input.value.length); }catch(e){} };
  input.addEventListener('focus', () => { place(); setTimeout(place, 0); });
  input.addEventListener('click', place);
}
// スタミナ現在値/上限値はフォーカス時に空にして、そのまま打ち直せるようにする。
function clearOnFocus(input){
  input.addEventListener('focus', () => { input.value = ''; });
}

function newStamItem(intervalMin){
  return { id: uid(), type:'stam', name:'', current:0, max:100, intervalMin, start: Date.now() };
}
function newAbyssItem(intervalMin){
  // Dot Abyss 風: 回復は通常スタミナと同じ。カードタップで40使い切り(余り残し)。
  return { id: uid(), type:'abyss', name:'', current:0, max:240, intervalMin, start: Date.now() };
}
function newIdleItem(durationMin){
  return { id: uid(), type:'idle', name:'', durationMin, state:'running', start: Date.now() };
}
function newHeaderItem(){
  return { id: uid(), type:'header', name:'' };
}
function newRuleItem(color){
  return { id: uid(), type:'rule', color: color || '#52617a' };
}

// 残り時間ではなく「何時何分に完了するか」を時刻表記で返す(スタミナ用)。
function fmtClockAt(remainMs){
  const d = new Date(Date.now() + Math.max(0, remainMs));
  const p = n => String(n).padStart(2,'0');
  return { h: p(d.getHours()), m: p(d.getMinutes()) };
}
// 残り時間を「あと◯:◯◯」のカウントダウン表記で返す(放置報酬用)。
function fmtCountdown(ms){
  ms = Math.max(0, ms);
  const totalMin = Math.ceil(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h + ':' + String(m).padStart(2,'0');
}

function stamInfo(it, now){
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const recovered = Math.floor(elapsed / intervalMs);
  const cur = Math.min(it.max, it.current + recovered);
  const isFull = cur >= it.max;
  if (isFull) return { cur, remainMs:0, isFull };
  const nextIn = intervalMs - (elapsed % intervalMs);
  const need = it.max - cur;
  const remainMs = (need-1)*intervalMs + nextIn;
  return { cur, remainMs, isFull };
}
// 現在値/上限値を書き換えても「次の1回復までの残り時間」がリセットされないよう、
// サイクルの位相(既にどれだけ経過しているか)を維持したまま基準時刻だけを進める。
function remainingAfter40(cur){
  cur = Math.max(0, Math.floor(Number(cur) || 0));
  return cur % 40; // 例: 220→20, 40→0, 39→39
}
function preserveCycle(it, now){
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const phase = ((now - it.start) % intervalMs + intervalMs) % intervalMs;
  it.start = now - phase;
}
function idleInfo(it, now){
  const durMs = Math.max(1, it.durationMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const remainMs = Math.max(0, durMs - elapsed);
  return { remainMs, isFull: remainMs<=0 };
}

function needsTicking(now){
  now = now || Date.now();
  return state.items.some(it=>{
    if (it.type==='stam' || it.type==='abyss') return !stamInfo(it, now).isFull;
    if (it.type==='idle') return !idleInfo(it, now).isFull;
    return false;
  });
}
function scheduleTick(gen){
  if (gen !== tickGen || !needsTicking()) return;
  const unit = 60000;
  const delay = Math.max(200, unit - (Date.now() % unit));
  tickId = setTimeout(()=>{
    tickId = null;
    if (gen !== tickGen) return;
    render();
    if (needsTicking()) scheduleTick(gen);
  }, delay);
}
function startTicking(force){
  if (force){ tickGen++; if (tickId) clearTimeout(tickId); tickId=null; }
  if (!tickId && needsTicking()) scheduleTick(tickGen);
}

function buildStamCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row namerow">
      <input class="name" placeholder="アカウント名" value="${esc(it.name)}">
      <button class="del">×</button>
    </div>
    <div class="row valrow-stam">
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="curInput">
      <span class="slash">/</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="maxInput">
      <div class="clockstack" data-role="clock"></div>
    </div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  const delBtn = wrap.querySelector('.del');
  delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleDeleteTap(it.id); });
  const curInput = wrap.querySelector('[data-role="curInput"]');
  const maxInput = wrap.querySelector('[data-role="maxInput"]');
  forceCursorToEnd(nameEl);
  [curInput, maxInput].forEach(clearOnFocus);
  curInput.addEventListener('blur', ()=>{
    const now = Date.now();
    const info = stamInfo(it, now);
    const newCur = clampInt(curInput.value, 0, it.max, info.cur);
    preserveCycle(it, now);
    it.current = newCur;
    save(); render();
  });
  maxInput.addEventListener('blur', ()=>{
    const now = Date.now();
    const curNow = stamInfo(it, now).cur;
    const newMax = clampInt(maxInput.value,1,999,it.max);
    preserveCycle(it, now);
    it.max = newMax;
    it.current = Math.min(curNow, newMax);
    save(); render();
  });
  refs[it.id] = { el: wrap, nameEl, curInput, maxInput, delBtn,
    clockEl: wrap.querySelector('[data-role="clock"]') };
  return wrap;
}


function buildAbyssCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row namerow">
      <input class="name" placeholder="Abyssアカウント" value="${esc(it.name)}">
      <button class="del">×</button>
    </div>
    <div class="row valrow-stam">
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="curInput">
      <span class="slash">/</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="maxInput">
      <div class="clockstack" data-role="clock"></div>
    </div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  const delBtn = wrap.querySelector('.del');
  delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleDeleteTap(it.id); });
  const curInput = wrap.querySelector('[data-role="curInput"]');
  const maxInput = wrap.querySelector('[data-role="maxInput"]');
  forceCursorToEnd(nameEl);
  [curInput, maxInput].forEach(clearOnFocus);
  curInput.addEventListener('blur', ()=>{
    const now = Date.now();
    const info = stamInfo(it, now);
    const newCur = clampInt(curInput.value, 0, it.max, info.cur);
    preserveCycle(it, now);
    it.current = newCur;
    pending40Id = null;
    save(); render();
  });
  maxInput.addEventListener('blur', ()=>{
    const now = Date.now();
    const curNow = stamInfo(it, now).cur;
    const newMax = clampInt(maxInput.value,1,999,it.max);
    preserveCycle(it, now);
    it.max = newMax;
    it.current = Math.min(curNow, newMax);
    pending40Id = null;
    save(); render();
  });
  refs[it.id] = { el: wrap, nameEl, curInput, maxInput, delBtn,
    clockEl: wrap.querySelector('[data-role="clock"]') };
  // 1回目: 40使い切り後の余りをプレビュー / 2回目: 確定。入力・×は除外。
  wrap.addEventListener('click', (e)=>{
    if (e.target.closest('input') || e.target === delBtn) return;
    const now = Date.now();
    const info = stamInfo(it, now);
    if (pending40Id === it.id){
      preserveCycle(it, now);
      it.current = remainingAfter40(info.cur);
      pending40Id = null;
      save(); render(); startTicking(true);
    } else {
      pending40Id = it.id;
      if (pendingDeleteId) pendingDeleteId = null;
      render();
    }
  });
  return wrap;
}

function buildIdleCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row namerow">
      <input class="name" placeholder="アカウント名" value="${esc(it.name)}">
      <button class="del">×</button>
    </div>
    <div class="row valrow-idle">
      <div class="main" data-role="cur"></div>
      <div class="clockstack" data-role="clock"></div>
    </div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  const delBtn = wrap.querySelector('.del');
  delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleDeleteTap(it.id); });
  forceCursorToEnd(nameEl);
  wrap.addEventListener('click', (e)=>{
    if (e.target === nameEl || e.target===delBtn) return;
    toggleIdle(it);
  });
  refs[it.id] = { el: wrap, nameEl, delBtn,
    curEl: wrap.querySelector('[data-role="cur"]'), clockEl: wrap.querySelector('[data-role="clock"]') };
  return wrap;
}


function buildRuleCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'rule-line';
  wrap.style.borderTopColor = it.color || '#52617a';
  wrap.innerHTML = `<button class="del">×</button>`;
  const delBtn = wrap.querySelector('.del');
  delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleDeleteTap(it.id); });
  refs[it.id] = { el: wrap, delBtn };
  return wrap;
}
function buildHeaderCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'divider';
  wrap.innerHTML = `
    <input class="name" placeholder="見出し(ゲーム名など)" value="${esc(it.name)}">
    <button class="del">×</button>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('blur', ()=>{ it.name = nameEl.value; save(); });
  const delBtn = wrap.querySelector('.del');
  delBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleDeleteTap(it.id); });
  forceCursorToEnd(nameEl);
  refs[it.id] = { el: wrap, nameEl, delBtn };
  return wrap;
}

// タップで「受取」表示に切替。内部の実時間は止めない(表示だけの上書き)。
// もう一度タップ＝受取確定→フル時間で再開。
function toggleIdle(it){
  if (it.state === 'claim'){
    it.state = 'running';
    it.start = Date.now();
  } else {
    it.state = 'claim';
  }
  save(); render(); startTicking(true);
}
// 受取待機中に枠外をタップ＝キャンセル。内部時間は動き続けていたのでそのまま表示に戻すだけ。
function cancelClaim(it){
  it.state = 'running';
  save(); render(); startTicking(true);
}

// ×タップ→確認状態(赤)→もう一度タップで削除。ネイティブconfirm()はPWA環境で
// 動作しないことがあるため使わない。
let pendingDeleteId = null;
let pending40Id = null; // 40消費の確認待ち
function handleDeleteTap(id){
  if (pendingDeleteId === id){
    removeItem(id);
    pendingDeleteId = null;
  } else {
    pendingDeleteId = id;
    render();
  }
}

document.addEventListener('click', (e) => {
  for (const it of state.items){
    if (it.type === 'idle' && it.state === 'claim'){
      const r = refs[it.id];
      if (r && !r.el.contains(e.target)) cancelClaim(it);
    }
  }
  if (pending40Id != null){
    const r = refs[pending40Id];
    if (!r || !r.el.contains(e.target)){
      pending40Id = null;
      render();
    }
  }
  if (pendingDeleteId != null){
    const r = refs[pendingDeleteId];
    if (!r || e.target !== r.delBtn){
      pendingDeleteId = null;
      render();
    }
  }
  if (addPanelEl.classList.contains('show') && !addPanelEl.contains(e.target) && e.target !== addBtnEl){
    addPanelEl.classList.remove('show');
  }
  if (setupPanelEl.classList.contains('show') && !setupPanelEl.contains(e.target)){
    closeSetup();
  }
}, true);

function clampInt(v, min, max, fb){
  const n = parseInt(v,10);
  return Number.isFinite(n) ? Math.max(min, Math.min(max,n)) : fb;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function removeItem(id){
  if (refs[id]) refs[id].el.remove();
  state.items = state.items.filter(i=>i.id!==id);
  delete refs[id];
  save(); render(); startTicking(true);
}

// 04/20のようなデジタル時計表示を組み立てる共通処理(スタミナ・放置報酬で共用)。
function renderClock(el, remainMs, isFull){
  if (isFull){
    el.innerHTML = '<span class="ok">✓</span>';
  } else {
    const c = fmtClockAt(remainMs);
    el.innerHTML = `<span>${c.h}</span><span>${c.m}</span>`;
  }
}

function render(){
  const now = Date.now();
  emptyEl.style.display = state.items.length ? 'none' : 'block';

  const existingIds = new Set(state.items.map(i=>i.id));
  Object.keys(refs).forEach(id=>{ if(!existingIds.has(id)) delete refs[id]; });

  for (const it of state.items){
    if (!refs[it.id]){
      const el = it.type==='stam' ? buildStamCard(it) : it.type==='abyss' ? buildAbyssCard(it) : it.type==='idle' ? buildIdleCard(it) : it.type==='rule' ? buildRuleCard(it) : buildHeaderCard(it);
      cardsEl.appendChild(el);
    }
  }
  // reorder to match state order
  for (const it of state.items){
    cardsEl.appendChild(refs[it.id].el);
  }

  for (const it of state.items){
    const r = refs[it.id];
    if (r.nameEl && document.activeElement !== r.nameEl) r.nameEl.value = it.name;
    r.delBtn.classList.toggle('pending', pendingDeleteId === it.id);
    r.delBtn.textContent = pendingDeleteId === it.id ? '✓' : '×';
    if (it.type==='rule') r.el.style.borderTopColor = it.color || '#52617a';
    if (it.type==='stam' || it.type==='abyss'){
      const info = stamInfo(it, now);
      const wait40 = it.type==='abyss' && pending40Id === it.id;
      r.el.classList.toggle('full', info.isFull);
      r.el.classList.toggle('claim', wait40);
      renderClock(r.clockEl, info.remainMs, info.isFull);
      if (document.activeElement !== r.curInput){
        r.curInput.value = wait40 ? remainingAfter40(info.cur) : info.cur;
      }
      if (document.activeElement !== r.maxInput) r.maxInput.value = it.max;
    } else if (it.type==='idle'){
      const info = idleInfo(it, now);
      r.el.classList.toggle('claim', it.state==='claim');
      r.el.classList.toggle('full', info.isFull && it.state!=='claim');
      r.curEl.textContent = it.state==='claim' ? '受取' : (info.isFull ? 'MAX' : fmtCountdown(info.remainMs));
      renderClock(r.clockEl, info.remainMs, info.isFull);
    }
  }
}

addBtnEl.addEventListener('click', ()=>{
  addPanelEl.classList.toggle('show');
});
addPanelEl.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  const type = btn.dataset.type;
  if (type === 'header'){
    state.items.push(newHeaderItem());
    addPanelEl.classList.remove('show');
    save(); render(); startTicking(true);
    return;
  }
  if (type === 'rule'){
    openSetup('rule');
    return;
  }
  openSetup(type);
});

// 追加種別ごとの設定ダイアログ(回復間隔 / 満タンまでの時間をここで固定する)。
let setupType = null;
function openSetup(type){
  setupType = type;
  addPanelEl.classList.remove('show');
  if (type === 'stam' || type === 'abyss'){
    setupLabelEl.textContent = type === 'abyss' ? 'Abyssスタミナ回復間隔' : 'スタミナ回復間隔';
    setupFieldsEl.innerHTML = `<input type="text" inputmode="numeric" pattern="[0-9]*" id="setupInterval" value="${type==='abyss'?'3':'5'}"><span>分で1回復</span>`;
  } else if (type === 'rule'){
    setupLabelEl.textContent = '仕切り線の色（#RRGGBB）';
    setupFieldsEl.innerHTML = `<input type="color" id="setupColorPick" value="#52617a" style="width:42px;height:36px;padding:0;border:1px solid var(--line);background:transparent;">
      <input type="text" id="setupColor" value="#52617a" maxlength="7" style="width:7em;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:14px;padding:8px;">`;
  } else {
    setupLabelEl.textContent = '満タンまでの時間';
    setupFieldsEl.innerHTML = `<input type="text" inputmode="numeric" pattern="[0-9]*" id="setupH" value="12"><span>h</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupM" value="0"><span>m</span>`;
  }
  setupFieldsEl.querySelectorAll('input').forEach(el=>{ if (el.type!=='color') forceCursorToEnd(el); });
  if (type === 'rule'){
    const pick = setupFieldsEl.querySelector('#setupColorPick');
    const text = setupFieldsEl.querySelector('#setupColor');
    if (pick && text){
      pick.addEventListener('input', ()=>{ text.value = pick.value; });
      text.addEventListener('input', ()=>{
        const v = text.value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) pick.value = v;
      });
    }
  }
  setupPanelEl.classList.add('show');
}
function closeSetup(){
  setupType = null;
  setupPanelEl.classList.remove('show');
}
setupConfirmEl.addEventListener('click', (e)=>{
  e.stopPropagation();
  if (setupType === 'stam'){
    const interval = clampInt(setupFieldsEl.querySelector('#setupInterval').value, 1, 999, 5);
    state.items.push(newStamItem(interval));
  } else if (setupType === 'abyss'){
    const interval = clampInt(setupFieldsEl.querySelector('#setupInterval').value, 1, 999, 3);
    state.items.push(newAbyssItem(interval));
  } else if (setupType === 'rule'){
    let color = (setupFieldsEl.querySelector('#setupColor')||{}).value || '#52617a';
    color = String(color).trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(color)) color = '#52617a';
    state.items.push(newRuleItem(color));
  } else if (setupType === 'idle'){
    const h = clampInt(setupFieldsEl.querySelector('#setupH').value, 0, 999, 12);
    const m = clampInt(setupFieldsEl.querySelector('#setupM').value, 0, 59, 0);
    state.items.push(newIdleItem(h*60+m));
  }
  closeSetup();
  save(); render(); startTicking(true);
});

document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden){ render(); startTicking(true); }
});

render();
startTicking(true);

// 長押しメニュー(コピー等)やドラッグ選択を出さない。
document.addEventListener('contextmenu', (e)=> e.preventDefault());
document.addEventListener('dragstart', (e)=> e.preventDefault());

document.getElementById('updateBtn').addEventListener('click', ()=>{
  location.href = 'update.html';
});

// Service worker: register once, never poll for updates automatically.
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
