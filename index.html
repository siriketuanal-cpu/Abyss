<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0b14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>タイマー</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0b0b14; --card:#15151f; --card2:#1b1b28; --line:#2a2a3a;
    --text:#eceef2; --sub:#8a8ea3; --accent:#9b8bff; --blue:#4fa3ff; --orange:#ffab5c;
    --danger:#ff6b6b; --ok:#5cd68a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select:none;
  }
  header{
    display:flex; align-items:center; gap:8px; padding:14px 12px 8px;
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  header h1{font-size:16px; margin:0; flex:1; color:var(--sub); font-weight:600; letter-spacing:.02em;}
  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #cards{padding:8px 8px 24px; display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:11px;
    padding:7px 8px; position:relative; min-width:0;
  }
  .card.claim{border-color:var(--ok);}
  .card.full{border-color:var(--orange);}
  .row{display:flex; align-items:center; gap:4px; min-width:0;}
  .row + .row{margin-top:4px;}
  .name{
    width:50%; background:transparent; border:none; color:var(--text);
    font-size:12px; font-weight:600; padding:2px 0; min-width:0;
  }
  .name::placeholder{color:var(--sub);}
  .del{
    width:20px; height:20px; border:none; background:none; color:var(--sub);
    font-size:14px; flex-shrink:0; padding:0; margin-left:auto;
  }
  .main{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  .meta{font-size:10px; color:var(--sub); flex:1; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stamval{
    width:30px; background:transparent; border:none; border-bottom:1px solid var(--line);
    color:var(--text); font-size:17px; font-weight:700; text-align:center; padding:0 0 1px;
    font-variant-numeric:tabular-nums;
  }
  .slash{color:var(--sub); font-size:15px;}
  .recoverrow{justify-content:flex-end; font-size:10px; color:var(--sub);}
  .recoverrow input{
    width:26px; background:var(--card2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:11px; text-align:center; padding:3px 2px;
  }
  .idle-set{display:flex; align-items:center; gap:3px; font-size:10px; color:var(--sub); flex-wrap:wrap;}
  .idle-set input{
    width:28px; background:var(--card2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:11px; text-align:center; padding:3px 2px;
  }
  .typebadge{font-size:9px; color:var(--sub); border:1px solid var(--line); border-radius:6px; padding:1px 4px; flex-shrink:0; display:none;}
  @media (min-width:420px){ .typebadge{display:inline-block;} }
  #empty{color:var(--sub); font-size:13px; text-align:center; padding:40px 0;}
  #addPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; gap:10px; z-index:10;
  }
  #addPanel.show{display:flex;}
  #addPanel button{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:600;
  }
  #saveStamp{font-size:10px; color:var(--sub); text-align:center; padding-bottom:6px;}
</style>
</head>
<body>
<header>
  <h1 id="title">タイマー</h1>
  <button class="iconbtn" id="refreshBtn">⟳</button>
  <button class="iconbtn" id="addBtn">＋</button>
</header>
<div id="cards"></div>
<div id="empty">＋ でタイマーを追加</div>
<div id="saveStamp"></div>

<div id="addPanel">
  <button data-type="stam">スタミナ</button>
  <button data-type="idle">放置報酬</button>
</div>

<script>
const STORAGE_KEY = 'freetimer:v1';
let state = load();
let refs = {};
let tickId = null;
let tickGen = 0;

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return { items: [] };
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    document.getElementById('saveStamp').textContent = '保存済み ' + p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){
    document.getElementById('saveStamp').textContent = '保存に失敗しました';
  }
}
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// 入力欄フォーカス時は常に末尾へカーソルを固定する。
function forceCursorToEnd(input){
  const place = () => { try{ input.setSelectionRange(input.value.length, input.value.length); }catch(e){} };
  input.addEventListener('focus', () => { place(); setTimeout(place, 0); });
  input.addEventListener('click', place);
}

function newStamItem(){
  return { id: uid(), type:'stam', name:'', current:0, max:100, intervalMin:5, start: Date.now() };
}
function newIdleItem(){
  return { id: uid(), type:'idle', name:'', durationMin: 720, state:'running', start: Date.now() };
}

function fmtHM(ms){
  ms = Math.max(0, ms);
  const totalMin = Math.ceil(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h + ':' + String(m).padStart(2,'0');
}

function stamInfo(it, now){
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const recovered = Math.floor(elapsed / intervalMs);
  const cur = Math.min(it.max, it.current + recovered);
  const isFull = cur >= it.max;
  if (isFull) return { cur, remainMs:0, isFull };
  const nextIn = intervalMs - (elapsed % intervalMs);
  const need = it.max - cur;
  const remainMs = (need-1)*intervalMs + nextIn;
  return { cur, remainMs, isFull };
}
function idleInfo(it, now){
  if (it.state === 'claim') return { remainMs: it.pausedRemainMs||0, isFull:true, waiting:true };
  const durMs = Math.max(1, it.durationMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const remainMs = Math.max(0, durMs - elapsed);
  return { remainMs, isFull: remainMs<=0, waiting:false };
}

function needsTicking(now){
  now = now || Date.now();
  return state.items.some(it=>{
    if (it.type==='stam') return !stamInfo(it, now).isFull;
    if (it.type==='idle') return !idleInfo(it, now).isFull;
    return false;
  });
}
function scheduleTick(gen){
  if (gen !== tickGen || !needsTicking()) return;
  const unit = 60000;
  const delay = Math.max(200, unit - (Date.now() % unit));
  tickId = setTimeout(()=>{
    tickId = null;
    if (gen !== tickGen) return;
    render();
    if (needsTicking()) scheduleTick(gen);
  }, delay);
}
function startTicking(force){
  if (force){ tickGen++; if (tickId) clearTimeout(tickId); tickId=null; }
  if (!tickId && needsTicking()) scheduleTick(tickGen);
}

function buildStamCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row">
      <input class="name" placeholder="アカウント名" value="${esc(it.name)}">
      <span class="typebadge">スタミナ</span>
      <button class="del">×</button>
    </div>
    <div class="row">
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="curInput">
      <span class="slash">/</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" class="stamval" data-role="maxInput">
      <div class="meta" data-role="meta"></div>
    </div>
    <div class="row recoverrow">
      <span>回復</span><input type="text" inputmode="numeric" pattern="[0-9]*" data-role="intervalInput"><span>分</span>
    </div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('input', ()=>{ it.name = nameEl.value; save(); });
  wrap.querySelector('.del').addEventListener('click', (e)=>{ e.stopPropagation(); removeItem(it.id); });
  const curInput = wrap.querySelector('[data-role="curInput"]');
  const maxInput = wrap.querySelector('[data-role="maxInput"]');
  const intInput = wrap.querySelector('[data-role="intervalInput"]');
  [nameEl, curInput, maxInput, intInput].forEach(forceCursorToEnd);
  curInput.addEventListener('change', ()=>{
    const now = Date.now();
    const info = stamInfo(it, now);
    it.current = clampInt(curInput.value, 0, it.max, info.cur);
    it.start = now;
    save(); render();
  });
  maxInput.addEventListener('change', ()=>{
    const now = Date.now();
    it.current = Math.min(stamInfo(it, now).cur, clampInt(maxInput.value,1,999,it.max));
    it.max = clampInt(maxInput.value,1,999,it.max);
    it.start = now;
    save(); render();
  });
  intInput.addEventListener('change', ()=>{
    const now = Date.now();
    it.current = stamInfo(it, now).cur;
    it.intervalMin = clampInt(intInput.value,1,999,it.intervalMin);
    it.start = now;
    save(); render();
  });
  refs[it.id] = { el: wrap, curInput, maxInput, intInput,
    metaEl: wrap.querySelector('[data-role="meta"]') };
  return wrap;
}

function buildIdleCard(it){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <div class="row">
      <input class="name" placeholder="アカウント名" value="${esc(it.name)}">
      <span class="typebadge">放置報酬</span>
      <button class="del">×</button>
    </div>
    <div class="row">
      <div class="main" data-role="cur"></div>
      <div class="meta" data-role="meta"></div>
    </div>
    <div class="row idle-set">
      <span>満タン</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" data-role="hInput"><span>h</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" data-role="mInput"><span>m</span>
    </div>
  `;
  const nameEl = wrap.querySelector('.name');
  nameEl.addEventListener('input', ()=>{ it.name = nameEl.value; save(); });
  wrap.querySelector('.del').addEventListener('click', (e)=>{ e.stopPropagation(); removeItem(it.id); });
  const hInput = wrap.querySelector('[data-role="hInput"]');
  const mInput = wrap.querySelector('[data-role="mInput"]');
  [nameEl, hInput, mInput].forEach(forceCursorToEnd);
  function applyDuration(){
    const h = clampInt(hInput.value,0,999,Math.floor(it.durationMin/60));
    const m = clampInt(mInput.value,0,59,it.durationMin%60);
    it.durationMin = h*60+m;
    it.start = Date.now();
    it.state = 'running';
    save(); render();
  }
  hInput.addEventListener('change', applyDuration);
  mInput.addEventListener('change', applyDuration);
  wrap.addEventListener('click', (e)=>{
    if (e.target === nameEl || e.target===hInput || e.target===mInput) return;
    toggleIdle(it);
  });
  refs[it.id] = { el: wrap, hInput, mInput,
    curEl: wrap.querySelector('[data-role="cur"]'), metaEl: wrap.querySelector('[data-role="meta"]') };
  return wrap;
}

// タップで受取待機へ。受取待機中に再タップ＝受取確定→フル時間で再開。
function toggleIdle(it){
  if (it.state === 'claim'){
    it.state = 'running';
    it.start = Date.now();
    delete it.pausedRemainMs;
  } else {
    const info = idleInfo(it, Date.now());
    it.pausedRemainMs = info.remainMs;
    it.state = 'claim';
  }
  save(); render(); startTicking(true);
}
// 受取待機中に枠外をタップ＝キャンセルし、止めた時点の残り時間から再開する。
function cancelClaim(it){
  const durMs = Math.max(1, it.durationMin) * 60000;
  const remain = it.pausedRemainMs != null ? it.pausedRemainMs : durMs;
  it.start = Date.now() - (durMs - remain);
  it.state = 'running';
  delete it.pausedRemainMs;
  save(); render(); startTicking(true);
}
document.addEventListener('click', (e) => {
  for (const it of state.items){
    if (it.type === 'idle' && it.state === 'claim'){
      const r = refs[it.id];
      if (r && !r.el.contains(e.target)) cancelClaim(it);
    }
  }
}, true);

function clampInt(v, min, max, fb){
  const n = parseInt(v,10);
  return Number.isFinite(n) ? Math.max(min, Math.min(max,n)) : fb;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function removeItem(id){
  state.items = state.items.filter(i=>i.id!==id);
  delete refs[id];
  save(); render(); startTicking(true);
}

function render(){
  const now = Date.now();
  const cardsEl = document.getElementById('cards');
  const emptyEl = document.getElementById('empty');
  emptyEl.style.display = state.items.length ? 'none' : 'block';

  const existingIds = new Set(state.items.map(i=>i.id));
  Object.keys(refs).forEach(id=>{ if(!existingIds.has(id)) delete refs[id]; });

  for (const it of state.items){
    if (!refs[it.id]){
      const el = it.type==='stam' ? buildStamCard(it) : buildIdleCard(it);
      cardsEl.appendChild(el);
    }
  }
  // reorder to match state order
  for (const it of state.items){
    cardsEl.appendChild(refs[it.id].el);
  }

  for (const it of state.items){
    const r = refs[it.id];
    if (document.activeElement !== r.el.querySelector('.name')) r.el.querySelector('.name').value = it.name;
    if (it.type==='stam'){
      const info = stamInfo(it, now);
      r.metaEl.textContent = info.isFull ? '満タン' : (fmtHM(info.remainMs) + '後');
      r.el.classList.toggle('full', info.isFull);
      if (document.activeElement !== r.curInput) r.curInput.value = info.cur;
      if (document.activeElement !== r.maxInput) r.maxInput.value = it.max;
      if (document.activeElement !== r.intInput) r.intInput.value = it.intervalMin;
    } else {
      const info = idleInfo(it, now);
      r.el.classList.toggle('claim', it.state==='claim');
      r.el.classList.toggle('full', info.isFull && it.state!=='claim');
      if (it.state === 'claim'){
        r.curEl.textContent = '受取済';
        r.metaEl.textContent = '枠外タップで再開';
      } else if (info.isFull){
        r.curEl.textContent = 'MAX';
        r.metaEl.textContent = 'タップで受取';
      } else {
        r.curEl.textContent = fmtHM(info.remainMs);
        r.metaEl.textContent = '満タンまで';
      }
      if (document.activeElement !== r.hInput) r.hInput.value = Math.floor(it.durationMin/60);
      if (document.activeElement !== r.mInput) r.mInput.value = it.durationMin%60;
    }
  }
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  document.getElementById('addPanel').classList.toggle('show');
});
document.getElementById('addPanel').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  const type = btn.dataset.type;
  state.items.push(type==='stam' ? newStamItem() : newIdleItem());
  document.getElementById('addPanel').classList.remove('show');
  save(); render(); startTicking(true);
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  render(); startTicking(true);
});
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden){ render(); startTicking(true); }
});

render();
startTicking(true);

// Service worker: register once, never poll for updates automatically.
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
