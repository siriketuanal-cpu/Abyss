<!DOCTYPE html>
<html lang="ja" style="background-color:#0b0b14">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=overlays-content" name="viewport"/>
<meta content="#0b0b14" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/>
<meta content="タイマー" name="apple-mobile-web-app-title"/>
<title>タイマー</title>
<link href="manifest.json" rel="manifest"/>
<link href="icon-192.png" rel="icon"/>
<link href="icon-192.png" rel="apple-touch-icon"/>
<link href="styles.css" rel="stylesheet"/>
</head>
<body>
<header>
<button type="button" aria-label="アプリを更新" class="iconbtn" id="updateBtn" title="アプリを更新">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
    <path d="M21 3v5h-5"/>
  </svg>
</button>
<span aria-hidden="true" class="spacer"></span>
<button type="button" class="iconbtn" id="addBtn" aria-label="タイマーを追加" title="タイマーを追加">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>
</header>
<div id="cards"></div>
<div id="empty">＋ でタイマーを追加</div>
<div id="toast" role="status"></div>
<div id="addPanel">
<div class="addPanelLabel" id="addPanelLabel">追加</div>
<div class="addPanelGrid">
<button type="button" class="timerType" data-type="stam">スタミナ</button>
<button type="button" class="timerType" data-type="orb">オーブ</button>
<button type="button" class="timerType" data-type="idle">放置報酬</button>
<button type="button" class="timerType" data-type="exped">遠征</button>
<button type="button" class="onlyTop" data-type="group">アカウント枠</button>
<button type="button" class="onlyTop" data-type="header">見出し</button>
<button type="button" class="onlyTop" data-type="rule">仕切り線</button>
</div>
</div>
<div id="setupPanel">
<div class="setupLabel" id="setupLabel"></div>
<div id="setupFields"></div>
<div id="setupActions">
<button type="button" id="setupCancel">やめる</button>
<button type="button" id="setupConfirm">追加</button>
</div>
</div>
<div id="nameEditOverlay" aria-hidden="true">
  <div id="nameEditPanel" role="dialog" aria-modal="true">
    <div id="nameEditLabel">名前を編集</div>
    <input type="text" id="nameEditInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
    <div id="nameEditActions">
      <button type="button" id="nameEditCancel">やめる</button>
      <button type="button" id="nameEditOk">OK</button>
    </div>
  </div>
</div>
<div id="colorPickerOverlay" aria-hidden="true">
  <div id="colorPickerPanel" role="dialog" aria-modal="true">
    <div id="colorPickerLabel">色を選択</div>
    <div class="color-palette-container">
      <div class="color-palette-row" id="colorPresetRow1"></div>
      <div class="color-palette-row" id="colorPresetRow2"></div>
      <div class="color-custom-section">
        <div class="color-custom-header">
          <span>カスタム保存枠 (6枠)</span>
          <span class="color-custom-hint">＋で色作成</span>
        </div>
        <div class="color-custom-row">
          <div class="color-custom-slots" id="colorCustomSlots"></div>
          <label class="color-custom-add-btn" title="新しい色を作成して保存">
            <span>＋</span>
            <input type="color" id="nativeColorInput" aria-label="自由な色を選択"/>
          </label>
        </div>
      </div>
    </div>
    <div id="colorPickerActions">
      <button type="button" id="colorPickerClose">閉じる</button>
    </div>
  </div>
</div>
<!-- 開発中はこの並び順のまま分割。APK化前に単一app.jsへ結合予定（順番はこの通りに保つこと）
     並び替え注意: card-builders.js の MENU_BTN_SEL を card-logic.js / resume-fit.js が参照しているので、
     card-builders.js は必ずその2つより前に読み込むこと。
     単一化するとき: build.html を開くと、この8ファイルを結合したapp.jsを作れる。
     結合後、この<script>群を <script src="app.js"></script> 1行に戻し、
     sw.js・update.html のファイル一覧も app.js 1つに戻すこと。 -->
<script src="state.js"></script>
<script src="engine.js"></script>
<script src="toast-core.js"></script>
<script src="toast-fields.js"></script>
<script src="card-builders.js"></script>
<script src="card-logic.js"></script>
<script src="panels.js"></script>
<script src="resume-fit.js"></script>
</body>
</html>
