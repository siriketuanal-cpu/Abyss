<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=overlays-content" name="viewport"/>
<meta content="#0b0b14" name="theme-color"/>
<meta content="yes" name="mobile-web-app-capable"/>
<title>タイマー</title>
<link href="manifest.json" rel="manifest"/>
<link href="icon-192.png" rel="icon"/>
<style>
  :root{
    --bg:#0b0b14; --card:#15151f; --card2:#1b1b28; --line:#2a2a3a;
    --text:#eceef2; --sub:#8a8ea3; --accent:#9b8bff; --blue:#4fa3ff; --orange:#ffab5c;
    --danger:#ff6b6b; --ok:#5cd68a;
    /* タイマー・数字部分で共通使用するフォント指定 */
    --timer-number-font: Roboto, system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
    -webkit-user-select:none; user-select:none;}
  /* タイマー内の数字表示はすべてこのフォントで統一 */
  .stamval, .stammax, .inline-number-text, .main, .clockstack, .rank{
    font-family:var(--timer-number-font);
  }
  /* body は固定。スクロールは #cards のみ → キーボード開閉の黒残り・二重描画を防ぐ */
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:Roboto,"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    user-select:none;
    display:flex; flex-direction:column;
  }
  /* キャレットは通常表示。スタミナ系インライン数字編集だけ非表示。 */
  .inline-edit-input{ caret-color:transparent; }
  /* インライン数字：親スロット幅いっぱいに置き、編集欄もその上に重ねる。
     「/」位置は valrow の左右均等フレックスで固定するため、幅ロックはしない。 */
  .inline-number{position:relative;display:block;width:100%;min-width:0;height:22px;line-height:22px;overflow:visible;}
  .inline-number-text{ display:block; width:100%; height:22px; line-height:22px; overflow:visible; font-variant-numeric:tabular-nums; }
  .stamval .inline-number-text{ text-align:right; }
  .stammax .inline-number-text{ text-align:left; }
  .inline-number.editing .inline-number-text{visibility:hidden;}
  .rank.editing .rank-text{visibility:hidden;}
  .inline-edit-input{
    position:absolute; top:0; left:0; width:100%; height:100%; box-sizing:border-box;
    border:0; outline:0; background:transparent; color:inherit;
    font:inherit; font-variant-numeric:tabular-nums; text-align:inherit;
    padding:0; margin:0; border-radius:0; appearance:none; -webkit-appearance:none;
    -webkit-user-select:text; user-select:text; overflow:visible;
    z-index:3; caret-color:transparent;
  }
  .stamval .inline-edit-input{ text-align:right; }
  /* 名前・見出し：表示専用（編集はポップアップ） */
  .name{
    position:relative; display:inline-block; min-width:0;
    -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  .name-text{
    display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  .name-text.is-placeholder{ color:var(--sub); font-weight:600; }
  /* TWA復帰時の一瞬の再構築を視覚的に隠す。通常起動・通常操作では非表示。 */
  #resumeVeil{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:100;transition:opacity 90ms linear;}
  #resumeVeil.show{opacity:1;}
  header{
    display:flex; align-items:center; gap:8px; padding:10px 12px 6px;
    flex:0 0 auto; background:var(--bg); z-index:5;
  }
  header .spacer{flex:1; min-width:0;}
  .iconbtn{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #cards{
    flex:1 1 auto; min-height:0; overflow-x:hidden; overflow-y:auto;
    overscroll-behavior:none; -webkit-overflow-scrolling:touch;
    padding:6px 6px calc(20px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    align-items:start; align-content:start; /* 余白を行間に配らない＝コンパクト維持 */
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:6px 6px; position:relative; min-width:0;
    touch-action:pan-y; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  /* タイマー枠：種類ごとに細線で色分け。放置の通常色は受取待機の緑と非重複。 */
  .card.stam{border:1px solid #5aa9ff;}
  .card.idle{border:1px solid #f0a85a;}
  /* タイマーメニュー用の付箋タブ：ベタ塗りなし、太線だけで背景を透かす。 */
  .timer-menu-tab{
    position:absolute;
    top:-13px;
    right:12px;
    width:22px;
    height:13px;
    box-sizing:border-box;
    padding:0;
    margin:0;
    border:2px solid var(--line);
    border-bottom:0;
    border-radius:6px 6px 0 0;
    background:transparent;
    color:inherit;
    appearance:none;
    -webkit-appearance:none;
    outline:none;
    box-shadow:none;
    z-index:5;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .card.stam .timer-menu-tab{border-color:#5aa9ff;}
  .card.idle .timer-menu-tab{border-color:#f0a85a;}
  .timer-menu-tab:active{background:transparent;}
  /* 長押しで削除確認中の対象を赤い破線で囲む。 */
  .longpress-target{
    outline:2px dashed var(--danger);
    outline-offset:3px;
  }
  .rule-line.longpress-target{
    outline:none;
    border-top-color:var(--danger) !important;
  }

  .row{display:flex; align-items:center; gap:3px; min-width:0;}
  .row + .row{margin-top:3px;}
  .namerow{margin-bottom:4px;}
  /* タイマーカードは種類に関係なく同じ外寸に揃える。中身だけ配置を変える。 */
  .card.stam, .card.idle{height:56px; min-height:56px;} 
  /* claim / full は種類別 border より後に書き、特異性を上げて破線・色が消えないようにする。
     （長押し削除の破線は共通 .longpress-target で表示） */
  .card.claim,
  .card.stam.claim,
  .card.idle.claim{
    border-style:dashed !important;
    border-color:var(--ok) !important;
  }
  .card.full,
  .card.stam.full,
  .card.idle.full{
    border-color:var(--orange) !important;
  }
  .card.stam .clockstack, .card.stam .stammax, .card.stam .slash{pointer-events:none;}
  .card.stam, .card.idle{
    padding:6px; display:flex; flex-direction:column; justify-content:center;
  }
  .name{
    width:100%; background:transparent; border:none; color:var(--text);
    font-size:11px; font-weight:600; padding:2px 0; min-width:0;
  }
  /* ランク：普段は span、編集時だけ input（名前と同じ方式） */
  .rank{
    position:absolute; top:2px; right:2px; width:4.5em; max-width:45%;
    height:18px; line-height:18px; min-height:0; max-height:18px;
    margin:0; padding:0 2px; box-sizing:border-box;
    background:transparent; border:none; outline:none;
    color:var(--orange);
    font-size:10px; font-weight:800; text-align:left;
    font-variant-numeric:tabular-nums;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:manipulation; z-index:2; display:block;
  }
  .rank-text{ display:block; overflow:hidden; white-space:nowrap; }
  .rank-edit-input{
    position:absolute; inset:0; width:100%; height:100%; box-sizing:border-box;
    background:transparent; border:none; outline:none; color:inherit;
    font:inherit; font-weight:inherit; font-variant-numeric:tabular-nums;
    text-align:left; padding:0; margin:0; caret-color:transparent;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:none;
    appearance:none; -webkit-appearance:none; z-index:3;
  }
  /* アカウント枠：通常カード2枚分の横幅。名前は上端に被せて行高を消す */
  .card.group{
    grid-column:span 2; position:relative;
    padding:16px 4px 4px; border:1px solid #555b68; box-shadow:none; border-radius:8px;
  }
  .card.group.single{grid-column:span 1;}
  .group-namerow{
    position:absolute; top:2px; left:4px; right:4px;
    margin:0; padding:0; gap:0; z-index:3;
    min-height:0; height:14px; line-height:14px;
    display:flex; align-items:center;
  }
  .group-namerow .name{
    font-size:11px; padding:0; font-weight:700; color:var(--accent);
    flex:0 1 auto; width:auto; max-width:70%; box-sizing:border-box;
    line-height:14px; height:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .group-body{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; min-height:1px; align-items:end;}
  .group-body.one{grid-template-columns:1fr;}
  .group-body:empty{display:none;}
  .group-empty-slot{height:56px; min-height:56px; box-sizing:border-box; border:1px dashed var(--line); border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--card); touch-action:pan-y; -webkit-tap-highlight-color:transparent;}
  .group-empty-add{border:0; background:transparent; color:var(--muted); font-size:22px; line-height:1; width:100%; height:100%; padding:0; touch-action:pan-y; -webkit-tap-highlight-color:transparent;}
  .main{font-size:16px; line-height:1.1; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em;}
  /* 左右を均等フレックスにし「/」を中央固定。桁数が変わってもスラッシュは動かない。 */
  .valrow-stam{
    margin-top:0 !important; align-items:center; min-height:22px; height:22px;
    position:absolute; left:6px; right:6px; bottom:5px;
    display:flex; justify-content:center; gap:0;
  }
  .stamval{
    color:var(--text); font-size:18px; font-weight:700; text-align:right;
    font-variant-numeric:tabular-nums; min-width:0;
    overflow:visible; height:22px; line-height:22px;
    flex:1 1 0; display:block;
  }
  /* 最大値は左寄せにして、現在値(右寄せ)と対称。「/」が中央に見える */
  .stammax{
    color:var(--blue); font-size:18px; font-weight:700; text-align:left;
    font-variant-numeric:tabular-nums; height:22px; line-height:22px;
    flex:1 1 0; min-width:0; display:block;
  }
  .slash{
    position:relative; flex:0 0 auto; width:auto; height:22px;
    margin:0 4px; color:#7f8da3;
    font-size:15px; font-weight:700; line-height:20px;
    text-align:center; top:-1px;
    overflow:visible; pointer-events:none;
  }
  .clockstack{
    margin-left:0; margin-right:auto; display:flex; flex-direction:row; align-items:center; justify-content:flex-start;
    gap:0; font-size:9.5px; font-weight:700; line-height:18px; color:var(--accent);
    transform:none; white-space:nowrap;
  }
  .clockstack .ok{color:var(--ok); font-size:14px; line-height:18px;}
  .clockstack .full-at{color:var(--danger); font-size:9.5px; font-weight:800; line-height:18px;}
  /* 満タンまで2時間未満：現在スタミナ・放置数字を赤（予定時刻は触らない） */
  [data-role="curWrap"].near,
  [data-role="curWrap"].near .inline-number-text{color:var(--danger) !important;}
  .main.near{color:var(--danger) !important;}
  .card.stam > .stam-clock,
  .card.idle > .idle-clock{
    position:absolute; right:6px; left:auto; top:0; margin:0; transform:none; height:18px; line-height:18px;
  }
    margin:0; min-width:0; flex-direction:row; align-items:center; justify-content:flex-start;
    gap:0; font-size:9.5px; line-height:18px; letter-spacing:.01em; transform:none;
    position:absolute; right:6px; left:auto; top:0; height:18px;
  }
  /* 放置タイマー本体も下段中央。予定時刻だけ左上へ配置。 */
  .valrow-idle{
    margin-top:0 !important; align-items:center; min-height:22px; height:22px;
    justify-content:center; gap:6px; position:absolute; left:6px; right:6px; bottom:5px;
  }
  .valrow-idle .main{min-width:2.6em; text-align:center; padding-left:0; font-size:19px; line-height:1.1;}
  .valrow-idle .clockstack{margin:0; position:absolute; left:0; top:auto;}
  .card.idle .valrow-idle .clockstack{position:absolute; left:0; bottom:22px; top:auto;}
  /* 数字の操作は透明な ::before ヒットボックスを使わず、実際の数字要素で受ける。 */
  [data-role="curWrap"], [data-role="maxWrap"]{ position:relative; }
  .divider{
    grid-column:1 / -1; display:flex; align-items:center; gap:6px;
    padding:0 2px; border-bottom:1px solid var(--line); position:relative;
    touch-action:pan-y; -webkit-touch-callout:none;
  }
  .divider .name{
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    width:65%; max-width:260px; flex:0 1 auto; font-size:13px; font-weight:700; color:var(--accent);
    padding:0; line-height:1.25; min-height:0;
  }
  .header-menu-button{
    margin-left:auto; flex:0 0 22px; width:22px; height:22px;
    padding:0; border:1px solid var(--line); border-radius:50%;
    background:var(--card2); color:var(--sub); font-size:14px; line-height:20px;
    display:flex; align-items:center; justify-content:center;
    appearance:none; -webkit-appearance:none; outline:none; box-shadow:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .header-menu-button:active{background:var(--card2); color:var(--text);}
  .header-palette{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin:4px 0 2px;}
  .header-swatch{width:26px; height:26px; padding:0; border-radius:50%; border:2px solid var(--line); box-shadow:none;}
  .header-swatch.selected{border-color:#fff; outline:1px solid var(--accent);}

  /* ルナビィ下線と同系の太い仕切り。色は item.color */
  .rule-line{
    grid-column:1 / -1; position:relative;
    height:0; margin:3px 2px; padding:0;
    border:0; border-top:2px solid #52617a;
    touch-action:pan-y; -webkit-touch-callout:none;
  }
  .rule-line::before{
    /* レイアウトを押し広げずに長押し判定だけ広げる透明ヒットエリア */
    content:''; position:absolute; left:0; right:0; top:-10px; bottom:-10px;
  }
  #toast{
    /* 画面中央。必要な設定だけを横並びにして、従来よりかなり小さく。 */
    position:fixed; left:50%; top:50%; bottom:auto;
    transform:translate(-50%, -50%); width:min(72vw, 250px); max-width:72%;
    background:#26272d; color:var(--text); border:1px solid var(--line);
    border-radius:9px; padding:8px; font-size:12px; z-index:30;
    display:none; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  #toast.show{display:block;}
  #toast .toast-fields{
    display:grid; grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:5px; width:100%;
  }
  #toast .toast-field{
    min-width:0; min-height:36px; padding:5px 6px;
    display:flex; align-items:center; justify-content:space-between; gap:5px;
    border:1px solid var(--line); border-radius:7px; background:var(--card2);
  }
  #toast .toast-field.wide{grid-column:1 / -1;}
  #toast .toast-label{
    min-width:0; color:var(--sub); font-size:11px; line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast button{
    border:1px solid var(--line); background:var(--card2); color:var(--text);
    border-radius:8px; padding:7px 10px; font-size:12px; font-weight:600;
  }
  #toast .toast-actions{
    display:grid; grid-template-columns:1fr 1fr; gap:5px;
    margin-top:6px; padding-top:6px; border-top:1px solid var(--line);
  }
  #toast .toast-actions button{width:100%; min-height:28px; padding:5px 7px;}
  #toast button.ok{background:var(--danger); border-color:transparent; color:#fff;}
  /* 1回目タップで破線（確定待ち）。2回目で実行 */
  #toast button.armed{outline:2px dashed #fff; outline-offset:2px;}
  #toast .toast-color{
    display:flex; align-items:center; justify-content:space-between; gap:5px;
    min-width:0; width:100%; height:100%; color:var(--text); font-size:12px;
  }
  #toast .toast-color input[type="color"]{width:24px;height:21px;padding:1px;border:1px solid var(--line);border-radius:5px;background:transparent;}
  #toast .toast-color input[type="text"]{
    width:2.8em; height:24px; padding:1px 3px; border:1px solid var(--line); border-radius:5px;
    background:var(--card2); color:var(--text) !important; font-size:13px; font-weight:700;
    text-align:center; caret-color:var(--text); -webkit-text-fill-color:var(--text);
  }
  #empty{color:var(--sub); font-size:13px; text-align:center; padding:40px 0;}
  #addPanel{
    position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:none; gap:10px; z-index:10;
  }
  #addPanel.show{display:flex; flex-wrap:wrap;}
  #addPanel .timerType{display:none;}
  #addPanel.group-mode .timerType{display:block;}
  #addPanel.group-mode .onlyTop{display:none;}
  #addPanel button{
    flex:1 1 calc(50% - 5px); min-width:calc(40% - 5px); padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:600;
  }
  #setupPanel{
    position:fixed; left:50%; top:50%; bottom:auto; right:auto;
    transform:translate(-50%, -50%); width:min(92vw, 340px);
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; display:none; flex-direction:column; gap:12px; z-index:25;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
  }
  #setupPanel.show{display:flex;}
  #setupPanel .setupLabel{font-size:13px; color:var(--sub); text-align:center;}
  #setupFields{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px;}
  #setupFields input{
    width:60px; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:16px; text-align:center; padding:8px 4px;
  }
  #setupFields span{color:var(--sub); font-size:13px;}
  #setupActions{display:flex; gap:8px;}
  #setupActions button{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700;
  }
  #setupConfirm{
    background:var(--accent) !important; color:#100c26 !important; border-color:transparent !important;
  }
  /* 名前・見出し用の軽量ポップアップ（全画面dimなし＝下のカードを再合成しにくい） */
  #nameEditOverlay{
    display:none; position:fixed; left:50%; top:50%; z-index:40;
    transform:translate(-50%, -50%); width:min(92vw, 340px);
    pointer-events:none;
  }
  #nameEditOverlay.show{display:block; pointer-events:auto;}
  #nameEditPanel{
    width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px;
    box-shadow:0 12px 32px rgba(0,0,0,.45);
    pointer-events:auto;
  }
  #nameEditLabel{font-size:13px; color:var(--sub); text-align:center;}
  #nameEditInput{
    width:100%; box-sizing:border-box; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:16px; padding:12px 10px;
    caret-color:var(--text);
  }
  #nameEditActions{display:flex; gap:8px;}
  #nameEditActions button{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:14px; font-weight:700;
  }
  #nameEditOk{background:var(--accent) !important; color:#100c26 !important; border-color:transparent !important;}
</style>
</head>
<body>
<div id="resumeVeil" aria-hidden="true"></div>
<header>
<button aria-label="アプリを更新" class="iconbtn" id="updateBtn" title="アプリを更新">↻</button>
<span aria-hidden="true" class="spacer"></span>
<button class="iconbtn" id="addBtn">＋</button>
</header>
<div id="cards"></div>
<div id="empty">＋ でタイマーを追加</div>
<div id="toast" role="status"></div>
<div id="addPanel">
<button class="timerType" data-type="stam">スタミナ</button>
<button class="timerType" data-type="orb">オーブ</button>
<button class="timerType" data-type="idle">放置報酬</button>
<button class="onlyTop" data-type="group">アカウント枠</button>
<button class="onlyTop" data-type="header">見出し</button>

  <div id="nameEditPanel" role="dialog" aria-modal="true">

<script>
const STORAGE_KEY = 'freetimer:v1';
let state = load();
// 旧版で存在し得た「アカウント外タイマー」を起動時にアカウントへ移行。
// 現行UIではタイマーはアカウント枠の子としてのみ作成する。
function migrateOrphanTimers(){
  if (!state || !Array.isArray(state.items)) return false;
  const orphan = state.items.filter(it => it && (it.type==='stam' || it.type==='idle'));
  if (!orphan.length) return false;
  const keep = state.items.filter(it => !orphan.includes(it));
  const groups = [];
  for (let i=0; i<orphan.length; i+=2){
    groups.push({ id:'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,7), type:'group', name:'', children:orphan.slice(i,i+2) });
  }
  // 最初の孤立タイマーがあった位置に移行後のアカウント枠を挿入し、
  // それ以外の既存項目の順序はなるべく維持する。
  const firstIndex = state.items.findIndex(it => orphan.includes(it));
  const beforeCount = state.items.slice(0, firstIndex).filter(it => !orphan.includes(it)).length;
  state.items = keep.slice(0,beforeCount).concat(groups, keep.slice(beforeCount));
  saveNow();
  return true;
}
if (migrateOrphanTimers()) { /* 旧データの一度きりの移行 */ }
let refs = {};
let tickId = null;
let tickGen = 0;
let pending40Id = null;
let claimId = null;
// インライン数字編集中の対象。null | `${itemId}:cur` | `${itemId}:max`
let editingId = null;

// DOM参照は一度だけ取得して使い回す(毎分ティックや毎クリックで検索し直さない)。
const cardsEl = document.getElementById('cards');
const emptyEl = document.getElementById('empty');
const addPanelEl = document.getElementById('addPanel');
const addBtnEl = document.getElementById('addBtn');
const setupPanelEl = document.getElementById('setupPanel');
const setupLabelEl = document.getElementById('setupLabel');
const setupFieldsEl = document.getElementById('setupFields');
const setupConfirmEl = document.getElementById('setupConfirm');
const setupCancelEl = document.getElementById('setupCancel');
const toastEl = document.getElementById('toast');
const nameEditOverlayEl = document.getElementById('nameEditOverlay');
const nameEditLabelEl = document.getElementById('nameEditLabel');
const nameEditInputEl = document.getElementById('nameEditInput');
const nameEditOkEl = document.getElementById('nameEditOk');
const nameEditCancelEl = document.getElementById('nameEditCancel');
let nameEditOnOk = null;
let nameEditFocusTimer = null;

function closeNameEditPopup(){
  if (!nameEditOverlayEl) return;
  if (nameEditFocusTimer){ clearTimeout(nameEditFocusTimer); nameEditFocusTimer = null; }
  nameEditOverlayEl.classList.remove('show');
  nameEditOverlayEl.setAttribute('aria-hidden', 'true');
  nameEditOnOk = null;
  try { nameEditInputEl && nameEditInputEl.blur(); } catch (e) {}
}
function openNameEditPopup(opts){
  opts = opts || {};
  if (!nameEditOverlayEl || !nameEditInputEl) return;
  if (nameEditFocusTimer){ clearTimeout(nameEditFocusTimer); nameEditFocusTimer = null; }
  // トースト由来の pointer が残っていると focus 直後に blur されることがある
  closeToast();
  nameEditLabelEl.textContent = opts.label || '名前を編集';
  nameEditInputEl.value = opts.value != null ? String(opts.value) : '';
  nameEditInputEl.placeholder = opts.placeholder || '';
  nameEditOnOk = typeof opts.onOk === 'function' ? opts.onOk : null;
  nameEditOverlayEl.classList.add('show');
  nameEditOverlayEl.setAttribute('aria-hidden', 'false');
  // トースト閉鎖・前の pointer が落ち着いてから focus（初回キーボード落ち対策）
  nameEditFocusTimer = setTimeout(()=>{
    nameEditFocusTimer = null;
    if (!nameEditOverlayEl.classList.contains('show')) return;
    try {
      nameEditInputEl.focus({preventScroll:true});
      const len = String(nameEditInputEl.value || '').length;
      nameEditInputEl.setSelectionRange(len, len);
    } catch (e) {}
  }, 120);
}
function confirmNameEdit(){
  const v = nameEditInputEl ? nameEditInputEl.value : '';
  const cb = nameEditOnOk;
  closeNameEditPopup();
  if (cb) cb(v);
}
if (nameEditOkEl){
  // pointerdown だと focus を奪ってキーボードが先に閉じることがある → click で確定
  nameEditOkEl.addEventListener('click', e=>{
    e.preventDefault();
    e.stopPropagation();
    confirmNameEdit();
  });
}
if (nameEditCancelEl){
  nameEditCancelEl.addEventListener('click', e=>{
    e.preventDefault();
    e.stopPropagation();
    closeNameEditPopup();
  });
}
if (nameEditInputEl){
  nameEditInputEl.addEventListener('keydown', e=>{
    if (e.key === 'Enter'){
      e.preventDefault();
      confirmNameEdit();
    } else if (e.key === 'Escape'){
      e.preventDefault();
      closeNameEditPopup();
    }
  });
}

function normalizeIdleClaim(it){
  // 「受取」は一時的なUI状態。永続化されると claimId（メモリのみ）とズレて
  // 再起動後も「受取」のまま固まる。読み込み時は必ず running に戻す。
  if (it && it.type === 'idle' && it.state === 'claim') it.state = 'running';
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.items)){
        data.items.forEach(it=>{
          if (!it) return;
          normalizeIdleClaim(it);
          if (it.type === 'group' && Array.isArray(it.children)){
            it.children.forEach(ch=>{
              normalizeIdleClaim(ch);
            });
          }
        });
      }
      return data;
    }
  }catch(e){}
  return { items: [] };
}
// 同期localStorageは描画を止めることがある → 既定は次タスクに遅延。
// 即時が必要なときだけ save(true)
let saveTimer = null;
function saveNow(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
  }
}
function save(immediate){
  if (immediate){
    if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    saveNow();
    return;
  }
  if (saveTimer) return; // 連続操作は1回にまとめる
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    saveNow();
  }, 0);
}
// 描画を先にコミットしてから保存（確定タップ用）
function saveAfterPaint(){
  requestAnimationFrame(()=>{
    setTimeout(()=> saveNow(), 0);
  });
}
function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// アプリ内のタップ操作は pointerdown に統一。ネイティブ入力の編集開始だけは、
// 長押しでキーボードを出さないため短い指離し時にfocusする。
function bindTapDown(el, handler){
  el.addEventListener('pointerdown', (e)=>{
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    handler(e);
  });
}

function clearOnFocus(input){
  input.addEventListener('focus', () => { input.value = ''; });
}
// 数字・ランク用インライン編集（短押しfocus / 長押しは破棄して雫抑制）
function createPersistentInlineEditor(opts){
  const {
    initialValue = '',
    wrapClass = 'inline-number',
    textClass = 'inline-number-text',
    inputClass = 'inline-edit-input',
    placeholder = '',
    format = v => String(v == null ? '' : v),
    sanitize = v => String(v == null ? '' : v),
    normalize = v => v,
    emptyKeepsValue = true,
    clearOnFocus = false,
    maxLength = null,
    inputMode = null,
    editKey = null,
    onOpen = null,
    onCommit = null,
    usePlaceholderClass = false,
  } = opts || {};

  const wrap = document.createElement('span');
  wrap.className = wrapClass;
  const text = document.createElement('span');
  text.className = textClass;
  let shownValue = normalize(initialValue);

  const paint = ()=>{
    const display = format(shownValue);
    if (usePlaceholderClass){
      if (String(shownValue)){
        if (text.textContent !== display) text.textContent = display;
        text.classList.remove('is-placeholder');
      } else {
        const ph = placeholder || '';
        if (text.textContent !== ph) text.textContent = ph;
        text.classList.add('is-placeholder');
      }
    } else if (text.textContent !== display){
      text.textContent = display;
    }
  };
  paint();
  wrap.appendChild(text);

  // input は常設。通常時は操作対象外。
  const input = document.createElement('input');
  input.type = 'text';
  if (inputMode) input.inputMode = inputMode;
  input.className = inputClass;
  input.placeholder = placeholder || '';
  input.autocomplete = 'off';
  input.autocapitalize = 'off';
  input.autocorrect = 'off';
  input.spellcheck = false;
  if (maxLength != null) input.maxLength = maxLength;
  input.tabIndex = -1;
  input.setAttribute('aria-hidden','true');
  input.style.visibility = 'hidden';
  input.style.pointerEvents = 'none';
  wrap.appendChild(input);

  let editor = null;
  let guardBlur = false;
  let originalValue = shownValue;

  const setValue = v => {
    shownValue = normalize(v);
    if (!editor) paint();
  };
  const isEditing = () => editor !== null || (editKey != null && editingId === editKey);

  const closeInput = ()=>{
    input.style.visibility = 'hidden';
    input.style.pointerEvents = 'none';
    input.tabIndex = -1;
    input.setAttribute('aria-hidden','true');
  };
  const focusInput = ()=>{
    if (editor !== input) return;
    input.style.visibility = 'visible';
    input.style.pointerEvents = 'auto';
    input.tabIndex = 0;
    input.removeAttribute('aria-hidden');
    if (clearOnFocus) input.value = '';
    // テキスト非表示はフォーカス直前にずらす（タップ瞬間の点滅を軽減）
    wrap.classList.add('editing');
    // removeAllRanges は一部Androidで focus 直後にキーボードを閉じるので使わない
    const placeCaret = ()=>{
      try {
        const len = String(input.value || '').length;
        if (typeof input.setSelectionRange === 'function') input.setSelectionRange(len, len);
      } catch (err) {}
    };
    try { input.focus({preventScroll:true}); } catch (e) {}
    placeCaret();
    // ジェスチャ外 focus でキーボードが出ない端末向けの再試行
    setTimeout(()=>{
      if (editor !== input) return;
      try {
        if (document.activeElement !== input) input.focus({preventScroll:true});
        placeCaret();
      } catch (e) {}
    }, 30);
  };

  const finish = (commit=true)=>{
    if (editor !== input) return;
    if (guardBlur && commit){
      try { input.focus({preventScroll:true}); } catch (e) {}
      return;
    }
    // キャンセル時は必ず元値に戻す（長押し破棄でブランクが残るのを防ぐ）
    let next;
    if (!commit){
      next = originalValue;
    } else {
      const raw = sanitize(input.value);
      next = (emptyKeepsValue && raw === '') ? originalValue : normalize(raw);
    }
    editor = null;
    wrap.classList.remove('editing');
    if (editKey != null && editingId === editKey) editingId = null;
    try { window.getSelection()?.removeAllRanges(); } catch (e) {}
    closeInput();
    clearWrapHold();
    shownValue = next;
    paint();
    if (commit && typeof onCommit === 'function') onCommit(next);
  };

  const open = ()=>{
    if (editor) return;
    originalValue = shownValue;
    if (typeof onOpen === 'function') onOpen();
    if (editKey != null) editingId = editKey;
    input.value = clearOnFocus ? '' : String(shownValue ?? '');
    editor = input;
    guardBlur = true;
    // focus は pointerup 側。editing クラスは focusInput で付与
    setTimeout(()=>{ guardBlur = false; }, 350);
  };

  input.addEventListener('input', ()=>{
    const v = sanitize(input.value);
    if (input.value !== v) input.value = v;
  });
  input.addEventListener('blur', ()=> finish(true));
  input.addEventListener('keydown', e=>{
    if (e.key === 'Enter'){ e.preventDefault(); guardBlur = false; input.blur(); }
    else if (e.key === 'Escape'){ e.preventDefault(); input.value = ''; guardBlur = false; finish(false); }
  });
  input.addEventListener('pointerdown', e=>{
    if (e.isPrimary === false) return;
    e.preventDefault();
    e.stopPropagation();
    try {
      window.getSelection()?.removeAllRanges();
      // 編集中の長押しで全選択・雫が残らないよう、押下時点で末尾に寄せる
      const len = String(input.value || '').length;
      input.setSelectionRange(len, len);
    } catch (err) {}
  }, {capture:true, passive:false});
  input.addEventListener('selectstart', e=>{
    e.preventDefault();
    try { window.getSelection()?.removeAllRanges(); } catch (err) {}
  }, {capture:true});
  input.addEventListener('contextmenu', e=>{
    e.preventDefault();
    e.stopPropagation();
  }, {capture:true});

  // 数字・ランク用：短押しでfocus / 長押しでfocusせず破棄（雫ハンドル抑制）
  let wrapHoldTimer = null;
  let wrapPointerId = null;
  let wrapHoldX = 0, wrapHoldY = 0;
  const clearWrapHold = ()=>{
    if (wrapHoldTimer !== null){ clearTimeout(wrapHoldTimer); wrapHoldTimer = null; }
    wrapPointerId = null;
  };

  wrap.addEventListener('pointerdown', e=>{
    if (e.isPrimary === false) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    clearWrapHold();
    wrapPointerId = e.pointerId;
    wrapHoldX = e.clientX; wrapHoldY = e.clientY;
    if (!editor) open();
    if (!editor) return;
    wrapHoldTimer = setTimeout(()=>{
      wrapHoldTimer = null;
      wrapPointerId = null;
      if (editor === input){
        guardBlur = false;
        finish(false);
      }
    }, 450);
  }, {capture:true, passive:false});

  wrap.addEventListener('pointermove', e=>{
    if (e.pointerId !== wrapPointerId) return;
    if (Math.hypot(e.clientX-wrapHoldX, e.clientY-wrapHoldY) > 14){
      if (wrapHoldTimer !== null){ clearTimeout(wrapHoldTimer); wrapHoldTimer = null; }
    }
  }, {capture:true, passive:true});

  wrap.addEventListener('pointerup', e=>{
    if (e.pointerId !== wrapPointerId) return;
    clearWrapHold();
    focusInput();
  }, {capture:true, passive:false});

  wrap.addEventListener('pointercancel', ()=>{
    clearWrapHold();
    if (editor === input && input.style.visibility === 'hidden'){
      guardBlur = false;
      finish(false);
    }
  }, {capture:true, passive:true});

  return {
    wrap, text, input, open,
    setText: setValue,
    setValue,
    setRank: setValue,
    setColor: c => { wrap.style.color = c || ''; },
    isEditing
  };
}

// 名前・見出しは表示専用（編集はポップアップ）。input も雫対策も持たない。
function createInlineText(initialValue, placeholder, _onCommit){
  const wrap = document.createElement('span');
  wrap.className = 'name';
  const text = document.createElement('span');
  text.className = 'name-text';
  wrap.appendChild(text);
  let shownValue = String(initialValue == null ? '' : initialValue);
  const paint = ()=>{
    if (shownValue){
      if (text.textContent !== shownValue) text.textContent = shownValue;
      text.classList.remove('is-placeholder');
    } else {
      const ph = placeholder || '';
      if (text.textContent !== ph) text.textContent = ph;
      text.classList.add('is-placeholder');
    }
  };
  paint();
  const setValue = v => {
    shownValue = String(v == null ? '' : v);
    paint();
  };
  return {
    wrap, text, input: null,
    open: ()=>{},
    setText: setValue,
    setValue,
    setColor: c => { wrap.style.color = c || ''; },
    isEditing: () => false
  };
}

function createInlineRank(initialRank, onOpen, onCommit){
  const clampRank = v => Math.max(1, Math.min(200, Math.floor(Number(String(v).replace(/\D/g, '')) || Number(v) || 1)));
  return createPersistentInlineEditor({
    initialValue: clampRank(initialRank),
    wrapClass: 'rank',
    textClass: 'rank-text',
    inputClass: 'rank-edit-input',
    format: v => 'Lv.' + clampRank(v),
    normalize: v => clampRank(v),
    sanitize: v => String(v).replace(/\D/g, '').slice(0, 3),
    emptyKeepsValue: true,
    clearOnFocus: true,
    maxLength: 3,
    inputMode: 'numeric',
    onOpen,
    onCommit: v => onCommit(clampRank(v))
  });
}

function createInlineNumber(initialValue, onCommit, editKey, onOpen){
  const normalizeNumber = v => String(Math.max(0, Math.floor(Number(String(v).replace(/\D/g, '')) || Number(v) || 0)));
  return createPersistentInlineEditor({
    initialValue: String(initialValue),
    wrapClass: 'inline-number',
    textClass: 'inline-number-text',
    inputClass: 'inline-edit-input',
    normalize: normalizeNumber,
    sanitize: v => String(v).replace(/\D/g, '').slice(0, 3),
    format: v => String(v),
    emptyKeepsValue: true,
    clearOnFocus: true,
    maxLength: 3,
    inputMode: 'numeric',
    editKey,
    onOpen,
    onCommit
  });
}

function newStamItem(intervalMin, max, useChunk){
  const m = clampInt(max, 1, 999, 100);
  const item = {
    id: uid(), type:'stam', name:'',
    current: m, max: m,
    intervalMin: clampInt(intervalMin, 1, 99999, 5),
    start: Date.now()
  };
  // useChunk あり → カード短押しで使い切りプレビュー/確定
  if (useChunk != null && Number(useChunk) > 0) item.useChunk = clampUseChunk(useChunk);
  return item;
}
// 実験：既存スタミナ計算のまま、最大少なめ・1個使い切りのプリセット
function newOrbItem(intervalMin, max){
  const item = newStamItem(intervalMin, max != null ? max : 4, 1);
  item.lockedMax = true; // カード上で最大編集しない
  item.useMode = 'sub';   // 1タップで1個減らす（modだと %1 で常に0になる）
  return item;
}
function hasUseChunk(it){
  return !!(it && it.type === 'stam' && it.useChunk != null && Number(it.useChunk) > 0);
}
function newIdleItem(durationMin){
  return { id: uid(), type:'idle', name:'', durationMin, state:'running', start: Date.now() };
}
function newHeaderItem(){
  return { id: uid(), type:'header', name:'', color:'#9b8bff' };
}
function newRuleItem(color){
  return { id: uid(), type:'rule', color: color || '#52617a' };
}
function newGroupItem(){
  return { id: uid(), type:'group', name:'', children: [] };
}

// 残り時間ではなく「何時何分に完了するか」を時刻表記で返す(スタミナ用)。
function fmtClockAt(remainMs, now){
  const d = new Date((now || Date.now()) + Math.max(0, remainMs));
  const p = n => String(n).padStart(2,'0');
  return { h: p(d.getHours()), m: p(d.getMinutes()) };
}
// 残り時間を「あと◯:◯◯」のカウントダウン表記で返す(放置報酬用)。
function fmtCountdown(ms){
  ms = Math.max(0, ms);
  const totalMin = Math.ceil(ms/60000);
  const h = Math.floor(totalMin/60), m = totalMin%60;
  return h + ':' + String(m).padStart(2,'0');
}

function stamInfo(it, now){
  // ベースが既に満タンなら回復計算しない（満タン時刻は start に固定）
  if (it.current >= it.max){
    return { cur: it.max, remainMs:0, isFull:true, fullAt: it.start };
  }
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const recovered = Math.floor(elapsed / intervalMs);
  const cur = Math.min(it.max, it.current + recovered);
  if (cur >= it.max){
    const fullAt = it.start + Math.max(0, it.max - it.current) * intervalMs;
    return { cur: it.max, remainMs:0, isFull:true, fullAt: Math.min(now, fullAt) };
  }
  const nextIn = intervalMs - (elapsed % intervalMs);
  const need = it.max - cur;
  const remainMs = (need - 1) * intervalMs + nextIn;
  return { cur, remainMs, isFull:false };
}
// 満タンにしたら start を今に固定して、以降の回復計算を止める
function freezeIfFull(it, now){
  if (it.current >= it.max){
    it.current = it.max;
    it.start = now;
  }
}
// 現在値/上限値を書き換えても「次の1回復までの残り時間」がリセットされないよう、
// サイクルの位相(既にどれだけ経過しているか)を維持したまま基準時刻だけを進める。
function clampUseChunk(v){
  const n = Math.floor(Number(v) || 0);
  return Math.max(1, Math.min(100, n || 40));
}
// 使い切り後の残り。mod: 220→20 / sub（オーブ）: 4→3
function remainingAfterUse(cur, it){
  cur = Math.max(0, Math.floor(Number(cur) || 0));
  const fallback = 1;
  const c = clampUseChunk(it && it.useChunk != null ? it.useChunk : fallback);
  if (it && (it.useMode === 'sub' || it.lockedMax)) return Math.max(0, cur - c);
  return cur % c;
}
function preserveCycle(it, now){
  const intervalMs = Math.max(1, it.intervalMin) * 60000;
  const phase = ((now - it.start) % intervalMs + intervalMs) % intervalMs;
  it.start = now - phase;
}
function idleInfo(it, now){
  const durMs = Math.max(1, it.durationMin) * 60000;
  const elapsed = Math.max(0, now - it.start);
  const remainMs = Math.max(0, durMs - elapsed);
  return { remainMs, isFull: remainMs<=0, fullAt: it.start + durMs };
}
function fmtHM(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
// 満タン、または満タンまで2時間未満 → 赤
function isNearFull(remainMs, isFull){
  return !!isFull || (remainMs > 0 && remainMs < 7200000);
}
// 現在値の赤表示（文字に1回だけ当てる）
function setNearOnCurrent(editor, near){
  if (!editor || !editor.text) return;
  if (near) editor.text.style.setProperty('color', 'var(--danger)', 'important');
  else editor.text.style.removeProperty('color');
}

function timerNeedsTick(it, now){
  if (it.type==='stam') return !stamInfo(it, now).isFull;
  // 受取待機中は表示が固定なので、毎分tickを止めて無駄なDOM更新をしない。

    const r = refs[it.id];
    if (!r) continue;
    if (it.type==='group'){
      for (const child of it.children) updateTimerCard(child, r.childRefs[child.id], now);
    } else if (it.type==='stam' || it.type==='idle'){

    tickId = null;
    if (gen !== tickGen) return;
    // 毎分はDOM構造を再構築せず、既存ノードの表示だけ差分更新。
    tickRender(Date.now());
    if (needsTicking()) scheduleTick(gen);

// 長押し削除＋短押しアクション（使い切り・受取など）
function bindLongPressDelete(el, id, shortAction){
  const HOLD_MS = 520, MOVE_PX = 24;
  let timer = null, active = false, moved = false, longFired = false;
  let sx = 0, sy = 0, pid = null;

  const isPrimary = e => e.isPrimary !== false && !(e.pointerType==='mouse' && e.button!==0);
  const clearSelection = ()=>{ try{ window.getSelection()?.removeAllRanges(); }catch(e){} };
  const cleanup = ()=>{
    if (timer !== null){ clearTimeout(timer); timer = null; }
    active = false; moved = false; longFired = false; pid = null;
  };

  // 現在値・ランク編集中は長押し削除／使い切りと分離
  const isEditTarget = (target)=>{
    if (!target || !target.closest) return false;
    return !!(
      target.closest('.inline-edit-input') ||
      target.closest('.rank-edit-input') ||
      target.closest('.rank-text') ||
      target.closest('[data-role="curWrap"]') ||
      target.closest('.rank') ||
      target.closest('.timer-menu-tab') ||
      target.closest('.header-menu-button')
    );
  };

  el.addEventListener('pointerdown', e=>{
    if (!isPrimary(e) || active) return;
    if (isEditTarget(e.target)) return;
    if (editingId != null) return;

    active = true; moved = false; longFired = false;
    sx = e.clientX; sy = e.clientY; pid = e.pointerId;

    timer = setTimeout(()=>{
      if (!active || moved) return;
      timer = null;
      longFired = true;
      clearSelection();
      try {
        const ae = document.activeElement;
        if (ae && el.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
          ae.blur();
        }
      } catch (err) {}
      askRemoveItem(id);
    }, HOLD_MS);
  }, {capture:true, passive:false});

  el.addEventListener('pointermove', e=>{
    if (!active || e.pointerId !== pid) return;
    if (Math.hypot(e.clientX-sx, e.clientY-sy) > MOVE_PX){
      moved = true;
      if (timer !== null){ clearTimeout(timer); timer = null; }
    }
  }, {capture:true, passive:true});

  el.addEventListener('pointerup', e=>{
    if (!active || e.pointerId !== pid) return;
    const wasLong = longFired, wasMoved = moved;
    if (timer !== null){ clearTimeout(timer); timer = null; }

    if (wasLong){
      e.preventDefault();
      e.stopPropagation();
    } else if (!wasMoved && typeof shortAction === 'function'){
      if (!isEditTarget(e.target)) shortAction(e);
    }
    cleanup();
  }, {capture:true, passive:false});

  el.addEventListener('pointercancel', e=>{
    if (!active || e.pointerId !== pid) return;
    cleanup();
  }, {capture:true, passive:true});

  el.addEventListener('contextmenu', e=>{
    if (targetInGroupName(e.target, el)){
      e.preventDefault(); e.stopPropagation(); clearSelection();
    }
  });
}
function targetInGroupName(target, el){
  const n = target && target.closest ? target.closest('.group .name') : null;
  return !!n && el.contains(n);
}

// タイマーカード用の通常タップだけを処理。長押しでメニューは開かない。
// メニューは右上の timer-menu-tab からのみ開く。
function bindTimerShortAction(el, shortAction){
  let active = false, moved = false, pid = null;
  let sx = 0, sy = 0;
  const MOVE_PX = 24;
  const isPrimary = e => e.isPrimary !== false && !(e.pointerType==='mouse' && e.button!==0);
  const isEditTarget = (target)=>{
    if (!target || !target.closest) return false;
    return !!(
      target.closest('.inline-edit-input') ||
      target.closest('.rank-edit-input') ||
      target.closest('.rank-text') ||
      target.closest('[data-role="curWrap"]') ||
      target.closest('.rank') ||
      target.closest('.timer-menu-tab') ||
      target.closest('.header-menu-button')
    );
  };
  const cleanup = ()=>{ active=false; moved=false; pid=null; };

  el.addEventListener('pointerdown', e=>{
    if (!isPrimary(e) || active || editingId != null || isEditTarget(e.target)) return;
    active = true; moved = false; pid = e.pointerId;
    sx = e.clientX; sy = e.clientY;
  }, {capture:true, passive:true});

  el.addEventListener('pointermove', e=>{
    if (!active || e.pointerId !== pid) return;
    if (Math.hypot(e.clientX-sx, e.clientY-sy) > MOVE_PX) moved = true;
  }, {capture:true, passive:true});

  el.addEventListener('pointerup', e=>{
    if (!active || e.pointerId !== pid) return;
    const shouldAct = !moved && !isEditTarget(e.target) && typeof shortAction === 'function';
    cleanup();
    if (shouldAct) shortAction(e);
  }, {capture:true, passive:false});

  el.addEventListener('pointercancel', e=>{
    if (!active || e.pointerId !== pid) return;
    cleanup();
  }, {capture:true, passive:true});
}

// トースト＝確認UI専用。開く/閉じる/2段階確定をここに集約。
function closeToast(){

    toastEl.removeEventListener('pointerdown', toastTapDownHandler);

function showConfirmToast(html, onAct){

  closeToast();
  toastEl.innerHTML = html;
  toastEl.classList.add('show');
  const onClick = (e)=>{
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    // 即閉じ（やめる）
    if (act === 'no' || act === 'cancel'){
      closeToast();
      if (typeof onAct === 'function') onAct(act, btn);
      return;
    }
    // 削除だけ2回タップ確定。編集・追加などは1回で実行
    if (act === 'yes' && !btn.classList.contains('armed')){
      toastEl.querySelectorAll('button.armed').forEach(b => b.classList.remove('armed'));
      btn.classList.add('armed');
      return;
    }
    closeToast();
    if (typeof onAct === 'function') onAct(act, btn);
  };
  toastTapDownHandler = onClick;
  toastEl.addEventListener('pointerdown', onClick);
}
function askRemoveItem(id){
  const it = findItemById(id);
  if (!toastEl){ removeItem(id); return; }
  const canAdd = it && it.type === 'group' && it.children.length < 2;
  const isHeader = it && it.type === 'header';
  const isGroup = it && it.type === 'group';
  const isRule = it && it.type === 'rule';
  const isStam = it && it.type === 'stam';
  const canEditName = isHeader || isGroup;
  const colorDefault = isHeader ? (it.color || '#9b8bff') : (isRule ? (it.color || '#52617a') : null);
  // スタミナは設定済み or 後から付けられるよう空欄でも出す
  const showChunk = isStam;
  const chunkVal = isStam ? (it.useChunk != null ? clampUseChunk(it.useChunk) : '') : null;
  const showStamMax = isStam && !it.lockedMax;
  const stamMaxRow = showStamMax
    ? `<label class="toast-color toast-max-row"><span class="toast-label">最大</span><input type="text" inputmode="numeric" pattern="[0-9]*" value="${it.max}" maxlength="3" data-role="stamMax" aria-label="最大スタミナ" style="width:3.2em;text-align:center;"></label>`
    : '';
  const fields =
    (colorDefault ? `<label class="toast-field"><span class="toast-color"><span class="toast-label">色</span><input type="color" value="${colorDefault}" aria-label="色"></span></label>` : '')
    + (showChunk ? `<label class="toast-field"><span class="toast-color"><span class="toast-label">使い切り</span><input type="text" inputmode="numeric" pattern="[0-9]*" value="${chunkVal}" maxlength="3" data-role="useChunk" aria-label="使い切り数" placeholder="なし"></span></label>` : '')
    + (stamMaxRow ? `<label class="toast-field">${stamMaxRow}</label>` : '')
    + (canEditName ? `<button type="button" data-act="editName">${isHeader ? '見出し編集' : '名前編集'}</button>` : '')
    + (canAdd ? '<button type="button" data-act="add">タイマー追加</button>' : '');
  const extra = fields ? `<div class="toast-fields">${fields}</div>` : '';
  showConfirmToast(
    extra
    + `<div class="toast-actions">`
    + '<button type="button" class="ok" data-act="yes">削除</button>'
    + '<button type="button" data-act="no">やめる</button>'
    + '</div>',
    (act)=>{
      if (act === 'yes') removeItem(id);
      else if (act === 'add') openAddPanel({ groupId: id });
      else if (act === 'editName'){
        const ed = refs[id]?.nameEditor;
        openNameEditPopup({
          label: isHeader ? '見出し（ゲーム名など）' : 'アカウント名',
          value: it.name || '',
          placeholder: isHeader ? '見出し(ゲーム名など)' : 'アカウント',
          onOk: (v)=>{
            const next = String(v == null ? '' : v);
            if (it.name === next) return; // 変更なし＝DOMも触らない
            it.name = next;
            if (ed && typeof ed.setText === 'function') ed.setText(next);
            else if (ed && typeof ed.setValue === 'function') ed.setValue(next);
            save();
          }
        });
      }
    }
  );
  // closeToast の後にハイライトを付け直す
  const targetRef = refs[id];
  if (targetRef && targetRef.el){
    targetRef.el.classList.add('longpress-target');
    longPressTargetEl = targetRef.el;
  }
  if (colorDefault){
    const colorEl = toastEl.querySelector('.toast-color input[type="color"]');
    if (colorEl){
      colorEl.addEventListener('input', ()=>{
        it.color = colorEl.value;
        if (isHeader){
          if (refs[id]?.nameEditor) refs[id].nameEditor.setColor(it.color);
          else if (refs[id]?.nameEl) refs[id].nameEl.style.color = it.color;
        } else if (isRule && refs[id]?.el){
          refs[id].el.style.borderTopColor = it.color;
        }
        save();
      });
      colorEl.addEventListener('pointerdown', e=>e.stopPropagation());
    }
  }
  if (showChunk){
    const chunkEl = toastEl.querySelector('input[data-role="useChunk"]');
    if (chunkEl){
      const origChunk = it.useChunk != null ? clampUseChunk(it.useChunk) : null;
      chunkEl.addEventListener('focus', ()=>{ chunkEl.value = ''; });
      const applyChunk = ()=>{
        const raw = String(chunkEl.value || '').replace(/\D/g, '');
        if (raw === ''){
          // スタミナは空で「使い切りなし」
          if (isStam){
            delete it.useChunk;
            chunkEl.value = '';
            if (pending40Id === it.id){ pending40Id = null; paintUseChunkPreview(it.id); }
          }
        } else {
          it.useChunk = clampUseChunk(raw);
          chunkEl.value = String(it.useChunk);
          if (pending40Id === it.id) paintUseChunkPreview(it.id);
        }
        // カードの短押しバインドは再renderが必要なので、スタミナは軽く再構築

      };
      chunkEl.addEventListener('change', applyChunk);
      chunkEl.addEventListener('blur', applyChunk);
      chunkEl.addEventListener('keydown', e=>{
        if (e.key === 'Enter'){ e.preventDefault(); chunkEl.blur(); }
      });
      chunkEl.addEventListener('pointerdown', e=>e.stopPropagation());
    }
  }
  if (showStamMax){
    const maxEl = toastEl.querySelector('input[data-role="stamMax"]');
    if (maxEl){
      const origMax = it.max;
      maxEl.addEventListener('focus', ()=>{ maxEl.value = ''; });
      const applyMax = ()=>{
        const raw = String(maxEl.value || '').replace(/\D/g, '');
        const newMax = raw === '' ? origMax : clampInt(raw, 1, 999, origMax);
        maxEl.value = String(newMax);
        if (newMax === it.max) return;
        const now = Date.now();
        const curNow = stamInfo(it, now).cur;
        preserveCycle(it, now);
        it.max = newMax;
        it.current = Math.min(curNow, newMax);
        freezeIfFull(it, now);
        if (pending40Id === it.id) pending40Id = null;
        updateOneTimer(it);
        startTicking(true);
        save();
      };
      maxEl.addEventListener('change', applyMax);
      maxEl.addEventListener('blur', applyMax);
      maxEl.addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); maxEl.blur(); } });
      maxEl.addEventListener('pointerdown', e=>e.stopPropagation());
    }
  }
}

function attachCurrentEditor(curWrap, it, extraCommit){
  const clearFortyPreview = ()=>{
    if (hasUseChunk(it) && pending40Id === it.id){
      pending40Id = null;
      paintUseChunkPreview(it.id);
    }
  };
  const curEditor = createInlineNumber(stamInfo(it, Date.now()).cur, value => {
    const now = Date.now();
    const info = stamInfo(it, now);
    const newCur = clampInt(value, 0, it.max, info.cur);
    preserveCycle(it, now);
    it.current = newCur;
    freezeIfFull(it, now);
    if (typeof extraCommit === 'function') extraCommit();
    updateOneTimer(it);
    startTicking(true);
    saveAfterPaint();
  }, it.id + ':cur', clearFortyPreview);
  curWrap.appendChild(curEditor.wrap);
  return curEditor;

function onUseChunkTap(it, e){
  if (e){ e.stopPropagation(); e.preventDefault(); }
  if (!hasUseChunk(it)) return;
  const now = Date.now();
  const info = stamInfo(it, now);
  if (pending40Id === it.id){
    preserveCycle(it, now);
    it.current = remainingAfterUse(info.cur, it);
    freezeIfFull(it, now);
    pending40Id = null;
    paintUseChunkPreview(it.id);
    startTicking(true);
    saveAfterPaint();
  } else {
    if (pending40Id && pending40Id !== it.id){
      const prev = pending40Id;
      pending40Id = null;
      paintUseChunkPreview(prev);
    }
    pending40Id = it.id;
    paintUseChunkPreview(it.id);
  }
}

  for (const id of Object.keys(r.childRefs)){
    if (!ids.has(id)) delete r.childRefs[id];
  }
  const single = it.children.length <= 1;
  r.el.classList.toggle('single', single);
  r.bodyEl.classList.toggle('one', single);

  // タイマーが1個もないアカウントは、タイマー1枚分ぴったりの空き枠を表示。

  wrap.dataset.id = it.id;
  const menuBtn = document.createElement('button');
  menuBtn.type = 'button';
  menuBtn.className = 'header-menu-button';
  menuBtn.setAttribute('aria-label', '見出しメニュー');
  menuBtn.title = '見出しメニュー';
  menuBtn.textContent = '⋮';
  wrap.appendChild(menuBtn);
  refs[it.id] = { el: wrap, nameEl: nameEditor.wrap, nameEditor };
  // 既存のヘッダー長押しは残す。丸型ボタンだけは別経路でトーストを開く。
  bindLongPressDelete(wrap, it.id);
  return wrap;
}

// 構造を変えない操作は対象カードだけを更新する。
function getTimerRef(id){
  const direct = refs[id];
  if (direct) return direct;
  for (const it of state.items){
    if (it.type==='group' && it.children.some(c=>c.id===id)) return refs[it.id]?.childRefs[id] || null;
  }
  return null;
}
function updateOneTimer(it){
  updateTimerCard(it, getTimerRef(it.id), Date.now());
}
// タップで「受取」表示に切替。内部の実時間は止めない(表示だけの上書き)。
// もう一度タップ＝受取確定→フル時間で再開。
function toggleIdle(it){
  if (it.state === 'claim'){
    // 確定時だけtickを再開。待機中に止めていたタイマーをここで1回だけ再始動する。
    it.state = 'running';
    it.start = Date.now();
    if (claimId === it.id) claimId = null;
    updateOneTimer(it);
    startTicking(true);
  } else {
    // 「受取」待機中は表示が固定なので、tick自体を止める。
    it.state = 'claim';
    claimId = it.id;
    updateOneTimer(it);
    tickGen++;
    if (tickId){ clearTimeout(tickId); tickId = null; }
  }
  saveAfterPaint();
}
function cancelClaim(it){
  it.state = 'running';
  if (claimId === it.id) claimId = null;
  updateOneTimer(it);
  startTicking(true);
  saveAfterPaint();
}

// ×タップ→確認状態(赤)→もう一度タップで削除。ネイティブconfirm()はPWA環境で
// 動作しないことがあるため使わない。

document.addEventListener('pointerdown', (e) => {
  // 実際に選択状態があるときだけ解除する。通常のカードタップでは不要な処理を省く。
  try {
    if (document.activeElement !== e.target && window.getSelection){
      const sel = window.getSelection();
      if (sel && sel.rangeCount) sel.removeAllRanges();
    }
  } catch(err){}
  if (claimId != null){
    const claimed = findItemById(claimId);
    const r = claimed ? getTimerRef(claimId) : null;
    if (!claimed || !r || !r.el.contains(e.target)) cancelClaim(claimed || {id:claimId});
  }
  if (pending40Id != null){
    const r = getTimerRef(pending40Id);
    if (!r || !r.el.contains(e.target)){
      const id = pending40Id;
      pending40Id = null;
      paintUseChunkPreview(id);
    }
  }
  if (addPanelEl.classList.contains('show') && !addPanelEl.contains(e.target) && e.target !== addBtnEl){
    closeAddPanel();
    pendingAddGroupId = null;
  }
  if (toastEl && toastEl.classList.contains('show') && !toastEl.contains(e.target)){
    // トースト内inputフォーカス中の枠外タップはキーボード閉じだけ（メニューは残す）
    const ae = document.activeElement;
    if (ae && toastEl.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')){
      try { ae.blur(); } catch (err) {}
    } else {
      closeToast();
    }
  }
  // 作成パネルは基本、枠外タップで閉じない（数字入力中にキーボードを閉じただけで
  // 誤キャンセルされるのを防ぐため）。ただし仕切り線の色選択にはキャンセル手段が
  // 他に無いので、そこだけ枠外タップで閉じられるようにする。
  if (setupType === 'rule' && setupPanelEl.classList.contains('show') && !setupPanelEl.contains(e.target)){
    closeSetup();
  }
}, true);

function clampInt(v, min, max, fb){
  const n = parseInt(v,10);
  return Number.isFinite(n) ? Math.max(min, Math.min(max,n)) : fb;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function removeItem(id){
  if (refs[id]) refs[id].el.remove();
  delete refs[id];
  const topIdx = state.items.findIndex(i=>i.id===id);
  if (topIdx !== -1){
    state.items.splice(topIdx, 1);
  } else {
    for (const it of state.items){
      if (it.type !== 'group') continue;
      const idx = it.children.findIndex(c=>c.id===id);
      if (idx !== -1){
        it.children.splice(idx, 1);
        const parentRef = refs[it.id];
        if (parentRef) delete parentRef.childRefs[id];
        break;
      }
    }
  }
  save(); render(); startTicking(true);
}

// 04/20のようなデジタル時計表示を組み立てる共通処理(スタミナ・放置報酬で共用)。
function renderClock(el, remainMs, isFull, now, fullAt){
  if (!el) return;
  const key = isFull ? 'full:' + fmtHM(fullAt || now) : (()=>{ const c = fmtClockAt(remainMs, now); return c.h+c.m; })();
  if (el.dataset.clk === key) return;
  el.dataset.clk = key;
  if (isFull) el.innerHTML = `<span class="full-at">${fmtHM(fullAt || now)}</span>`;
  else el.textContent = fmtHM((now || Date.now()) + Math.max(0, remainMs));
}


function findItemById(id){
  for (const it of state.items){
    if (it.id === id) return it;
    if (it.type === 'group'){
      const c = it.children.find(ch=>ch.id===id);
      if (c) return c;
    }
  }
  return null;
}
function paintUseChunkPreview(id){
  const it = findItemById(id);
  if (it && it.type === 'stam') updateOneTimer(it);
}
function render(){
  const now = Date.now();
  emptyEl.style.display = state.items.length ? 'none' : 'block';

  const existingIds = new Set(state.items.map(i=>i.id));
  state.items.forEach(it=>{ if (it.type==='group') it.children.forEach(c=>existingIds.add(c.id)); });
  Object.keys(refs).forEach(id=>{ if(!existingIds.has(id)) delete refs[id]; });

  for (const it of state.items){
      if (!refs[it.id]){
      const el = it.type==='stam' ? buildStamCard(it) : it.type==='idle' ? buildIdleCard(it) : it.type==='rule' ? buildRuleCard(it) : it.type==='group' ? buildGroupCard(it) : buildHeaderCard(it);
    } else if (it.type==='group'){
      renderGroupBody(it);
    }
  }

  const topEls = state.items.map(it => refs[it.id].el);

  // 順序が違うときだけ並べ替え（毎分の append を避ける）
  let needOrder = false;
  const kids = cardsEl.children;
  for (let i = 0; i < topEls.length; i++){
    if (kids[i] !== topEls[i]){ needOrder = true; break; }
  }
  if (needOrder){
    for (const el of topEls) cardsEl.appendChild(el);
  }

  for (const it of state.items){
    const r = refs[it.id];
    if (it.type==='rule') r.el.style.borderTopColor = it.color || '#52617a';
    if (it.type==='header' && r.nameEditor){
      r.nameEditor.setColor(it.color || '#9b8bff');
      if (!r.nameEditor.isEditing()) r.nameEditor.setText(it.name || '');
    }
    if (it.type==='group'){
      if (r.nameEditor && !r.nameEditor.isEditing()) r.nameEditor.setText(it.name || '');
      for (const child of it.children) updateTimerCard(child, r.childRefs[child.id], now);
    } else {
      updateTimerCard(it, r, now);
    }
  }
}
// スタミナ/放置の値更新をトップレベル/アカウント枠の子どちらでも共用する
function updateTimerCard(it, r, now){
  if (!it || !r) return;
  if (it.type==='stam'){
    let info = stamInfo(it, now);
    // 自然回復で満タン到達したら固定して以降の計算を止める
    if (info.isFull && it.current < it.max){
      it.current = it.max;
      it.start = info.fullAt || now;
      info = stamInfo(it, now);
      saveAfterPaint();
    }
    const waitChunk = hasUseChunk(it) && pending40Id === it.id;
    r.el.classList.toggle('full', info.isFull);
    r.el.classList.toggle('claim', waitChunk);
    renderClock(r.clockEl, info.remainMs, info.isFull, now, info.fullAt);
    if (r.curEl && !r.curEl.isEditing()) r.curEl.setText(waitChunk ? remainingAfterUse(info.cur, it) : info.cur);
    if (r.maxLabel){
      const v = String(it.max);
      if (r.maxLabel.textContent !== v) r.maxLabel.textContent = v;
    }
    setNearOnCurrent(r.curEl, isNearFull(info.remainMs, info.isFull));
  } else if (it.type==='idle'){
    // claimId と state のズレ（再起動・途中操作など）で「受取」が固まるのを自己修復
    if (it.state === 'claim' && claimId !== it.id){
      it.state = 'running';
    }
    const info = idleInfo(it, now);
    r.el.classList.toggle('claim', it.state==='claim');
    r.el.classList.toggle('full', info.isFull && it.state!=='claim');
    const label = it.state==='claim' ? '受取' : (info.isFull ? fmtHM(info.fullAt) : fmtCountdown(info.remainMs));
    if (r.curEl.textContent !== label) r.curEl.textContent = label;
    // 放置の数字：カウントダウン中かつ2時間未満で赤
    // 満タン・2時間前・受取待ちも赤維持
    r.curEl.classList.toggle('near', it.state==='claim' || isNearFull(info.remainMs, info.isFull));
    renderClock(r.clockEl, info.remainMs, info.isFull, now, info.fullAt);
  }
}

let pendingAddGroupId = null;
let setupType = null;

function closeAddPanel(){
  addPanelEl.classList.remove('show');
  addPanelEl.classList.remove('group-mode');
}
function openAddPanel(opts){
  opts = opts || {};
  pendingAddGroupId = opts.groupId || null;
  addPanelEl.classList.toggle('group-mode', !!pendingAddGroupId);
  if (!opts.groupId) pendingAddGroupId = null;
  addPanelEl.classList.add('show');
  closeSetup();
}
function closeSetup(){
  setupType = null;
  setupPanelEl.classList.remove('show');
}
const SHARED_COLORS = ['#9b8bff','#b48cff','#6fc7ff','#70d6b0','#ffd166','#ff9f68','#ff7b9c','#d7dbe7','#52617a'];
function fillColorPalette(defaultColor){
  const current = defaultColor || SHARED_COLORS[0];
  setupFieldsEl.innerHTML = `<div class="header-palette">${SHARED_COLORS.map(c=>`<button type="button" class="header-swatch${c===current?' selected':''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>`;
  setupFieldsEl.dataset.color = current;
  setupFieldsEl.querySelectorAll('.header-swatch').forEach(btn=>{
    bindTapDown(btn, ()=>{
      setupFieldsEl.querySelectorAll('.header-swatch').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      setupFieldsEl.dataset.color = btn.dataset.color;
    });
  });
}
function openSetup(type){
  setupType = type;
  closeAddPanel();
  setupFieldsEl.innerHTML = '';
  delete setupFieldsEl.dataset.color;
  if (type === 'header'){
    setupLabelEl.textContent = 'ゲーム名ヘッダーの文字色';
    fillColorPalette('#9b8bff');
  } else if (type === 'stam'){
    setupLabelEl.textContent = 'スタミナ設定';
    setupFieldsEl.innerHTML = `
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupInterval" value="5"><span>分で1</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupMax" value="100" style="margin-left:6px;"><span>最大</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupUseChunk" value="" style="margin-left:6px;" placeholder="—"><span>使い切り</span>`;
  } else if (type === 'orb'){
    setupLabelEl.textContent = 'オーブ設定';
    setupFieldsEl.innerHTML = `
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupOrbHours" value="6"><span>時間で1個</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupMax" value="4" style="margin-left:6px;"><span>最大</span>`;
  } else if (type === 'rule'){
    setupLabelEl.textContent = '仕切り線の色';
    fillColorPalette('#52617a');
  } else {
    setupLabelEl.textContent = '満タンまでの時間';
    setupFieldsEl.innerHTML = `<input type="text" inputmode="numeric" pattern="[0-9]*" id="setupH" value="12"><span>h</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="setupM" value="0"><span>m</span>`;
  }
  setupFieldsEl.querySelectorAll('input').forEach(el=>{
    if (el.type === 'color') return;
    clearOnFocus(el);
  });
  setupPanelEl.classList.add('show');
}
function pushNewTimer(item){
  const group = pendingAddGroupId ? state.items.find(g=>g.id===pendingAddGroupId && g.type==='group') : null;
  if (!group || group.children.length >= 2){
    pendingAddGroupId = null;
    closeAddPanel();
    return false;
  }
  group.children.push(item);
  pendingAddGroupId = null;
  closeAddPanel();
  return true;
}
function confirmSetup(){
  if (!setupType) return;
  if (setupType === 'header'){
    const item = newHeaderItem();
    item.color = setupFieldsEl.dataset.color || '#9b8bff';
    state.items.push(item);
  } else if (setupType === 'stam'){
    const interval = clampInt(setupFieldsEl.querySelector('#setupInterval')?.value, 1, 999, 5);
    const max = clampInt(setupFieldsEl.querySelector('#setupMax')?.value, 1, 999, 100);
    const chunkRaw = String(setupFieldsEl.querySelector('#setupUseChunk')?.value || '').replace(/\D/g, '');
    const useChunk = chunkRaw === '' ? null : clampUseChunk(chunkRaw);
    if (!pushNewTimer(newStamItem(interval, max, useChunk))) return;
  } else if (setupType === 'orb'){
    const hours = clampInt(setupFieldsEl.querySelector('#setupOrbHours')?.value, 1, 999, 6);
    const max = clampInt(setupFieldsEl.querySelector('#setupMax')?.value, 1, 99, 4);
    if (!pushNewTimer(newOrbItem(hours * 60, max))) return;
  } else if (setupType === 'rule'){
    const color = setupFieldsEl.dataset.color || '#52617a';
    state.items.push(newRuleItem(color));
  } else if (setupType === 'idle'){
    const h = clampInt(setupFieldsEl.querySelector('#setupH')?.value, 0, 999, 12);
    const m = clampInt(setupFieldsEl.querySelector('#setupM')?.value, 0, 59, 0);
    if (!pushNewTimer(newIdleItem(h*60+m))) return;
  }
  closeSetup();
  save(); render(); startTicking(true);
}

bindTapDown(addBtnEl, ()=>{
  if (addPanelEl.classList.contains('show') && !addPanelEl.classList.contains('group-mode')){
    closeAddPanel();
  } else {
    openAddPanel();
  }
});
bindTapDown(addPanelEl, (e)=>{
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  const type = btn.dataset.type;
  if (type === 'group'){
    state.items.push(newGroupItem());
    closeAddPanel();
    save(); render(); startTicking(true);
    return;
  }
  openSetup(type);
});
bindTapDown(setupConfirmEl, (e)=>{
  e.stopPropagation();
  confirmSetup();
});
if (setupCancelEl){
  bindTapDown(setupCancelEl, (e)=>{
    e.stopPropagation();
    closeSetup();
  });
}

const resumeVeilEl = document.getElementById('resumeVeil');
let resumeTimer = null;
let wasBackgrounded = false;
let hiddenAt = 0;
function clearResumeVeil(){
  if (resumeTimer){ clearTimeout(resumeTimer); resumeTimer = null; }
  if (resumeVeilEl) resumeVeilEl.classList.remove('show');
}
// 復帰処理を1本化：覆う → 差分更新 → tick再開 → 安定後に覆いを外す
// キーボード開閉などの短い hidden では動かさない（黒ベール残留の主因）
function resumePipeline(){
  if (resumeTimer) clearTimeout(resumeTimer);
  if (!resumeVeilEl) return;
  resumeVeilEl.classList.add('show');
  const finish = () => {
    tickRender(Date.now());
    startTicking(true);
    resumeTimer = setTimeout(()=>{
      resumeTimer = null;
      resumeVeilEl.classList.remove('show');
    }, 220);
  };
  requestAnimationFrame(() => requestAnimationFrame(finish));
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){
    wasBackgrounded = true;
    hiddenAt = Date.now();
    tickGen++;
    if (tickId){ clearTimeout(tickId); tickId=null; }
    return;
  }
  if (!wasBackgrounded) return;
  wasBackgrounded = false;
  // キーボード等の瞬間的な hidden はベールなしで tick だけ再開
  if (Date.now() - hiddenAt < 200){
    startTicking(true);
    clearResumeVeil();
    return;
  }
  resumePipeline();
});
window.addEventListener('pageshow', (e)=>{
  if (e.persisted) resumePipeline();
});
// 入力外タップで選択解除（キーボード専用の viewport ハックは外した）
document.addEventListener('pointerdown', (e)=>{
  clearResumeVeil();
  const t = e.target;
  if (!t || !t.closest || !t.closest('input, textarea, [contenteditable]')){
    try { window.getSelection()?.removeAllRanges(); } catch (err) {}
  }
}, true);

bindTimerMenuDelegation(cardsEl);
bindHeaderMenuDelegation(cardsEl);

render();
startTicking(true);

// 長押しメニュー(コピー等)やドラッグ選択を出さない。
document.addEventListener('contextmenu', (e)=> e.preventDefault());
document.addEventListener('dragstart', (e)=> e.preventDefault());
// テキスト選択は入力欄側で必要な範囲だけ抑止する。
document.addEventListener('paste', (e)=> e.preventDefault());

bindTapDown(document.getElementById('updateBtn'), ()=>{
  // クエリ付きで update.html 自体のキャッシュも避ける
  location.href = 'update.html?r=' + Date.now().toString(36);
});

// Service worker: register once, never poll for updates automatically.
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
